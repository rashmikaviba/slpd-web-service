info:
  name: Create Vehicle Maintenance
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/vehicleMaintenance/"
  body:
    type: json
    data: |-
      {
        "vehicle": "{{vehicleId}}",
        "maintenancePart": "Engine oil change",
        "garage": "{{garageId}}",
        "maintenanceDate": "{{vmDate}}",
        "cost": 12500,
        "note": "Bruno test maintenance",
        "billImageUrls": [
          "https://example.com/bills/bruno-1.png"
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200 || res.status === 201) bru.setVar("vehicleMaintenanceId", res.body.data._id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Vehicle maintenance record created successfully
    - expression: res.body.data.vehicle
      operator: eq
      value: '"{{vehicleId}}"'
    - expression: res.body.data.isMonthEndDone
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      Preconditions: Setup ran; `{{vehicleId}}` and `{{garageId}}` exist. Stores `{{vehicleMaintenanceId}}` (vehicleMaintenance.controller.ts:17-85).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle Maintenance/Create Vehicle Maintenance/Create Vehicle Maintenance - 201.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/"
      method: POST
      body:
        type: json
        data: |-
