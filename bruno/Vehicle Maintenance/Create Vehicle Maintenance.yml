docs: |-
  **POST `/api/v1/vehicleMaintenance`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Vehicle maintenance record created successfully |
  | 2 | 201 | 201 throwaway record for delete | Vehicle maintenance record created successfully |
  | 3 | 400 | 400 missing vehicle | Vehicle is required |
  | 4 | 400 | 400 invalid vehicle | Vehicle is invalid |
  | 5 | 400 | 400 missing maintenancePart | Maintenance Part is required |
  | 6 | 400 | 400 invalid maintenancePart | Maintenance Part is invalid |
  | 7 | 400 | 400 maintenancePart too long | Maintenance Part cannot be more than 100 characters |
  | 8 | 400 | 400 missing garage | Garage is required |
  | 9 | 400 | 400 invalid garage | Garage is invalid |
  | 10 | 400 | 400 missing maintenanceDate | Maintenance Date is required |
  | 11 | 400 | 400 invalid maintenanceDate | Maintenance Date is invalid |
  | 12 | 400 | 400 missing cost | Cost is required |
  | 13 | 400 | 400 invalid cost | Cost is invalid |
  | 14 | 400 | 400 invalid note | Note is invalid |
  | 15 | 400 | 400 note too long | Note cannot be more than 500 characters |
  | 16 | 400 | 400 billImageUrls not an array | Bill Image URLs must be an array |
  | 17 | 400 | 400 invalid billImageUrls item | Bill Image URL is invalid |
  | 18 | 400 | 400 date not in working month | Vehicle maintenance date is not in working month! |
  | 19 | 400 | 400 vehicle does not exist | Invalid vehicle. Vehicle does not exist! |
  | 20 | 400 | 400 garage does not exist | Invalid garage. Garage does not exist! |
  | 21 | 401 | 401 no token | Authentication invalid! |
  | 22 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 23 | 404 | 404 vehicle invalid id | No item found with ID "not-an-object-id"! |
  | 24 | 404 | 404 garage invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Preconditions: Setup ran; `{{vehicleId}}` and `{{garageId}}` exist. Stores `{{vehicleMaintenanceId}}` (vehicleMaintenance.controller.ts:17-85).
