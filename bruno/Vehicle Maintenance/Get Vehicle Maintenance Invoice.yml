info:
  name: Get Vehicle Maintenance Invoice
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/vehicleMaintenance/maintainInvoice/{{vehicleMaintenanceId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data.id
      operator: eq
      value: '"{{vehicleMaintenanceId}}"'
    - expression: res.body.data.vehicleId
      operator: eq
      value: '"{{vehicleId}}"'
    - expression: res.body.data.vehicleOwnerName
      operator: isString
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Invoice DTO with populated vehicle/garage/users (vehicleMaintenance.controller.ts:239-258, vehicleMaintenance.util.ts:34).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle Maintenance/Get Vehicle Maintenance Invoice/Get Vehicle Maintenance Invoice - 200.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/maintainInvoice/{{vehicleMaintenanceId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
