docs: |-
  **GET `/api/v1/vehicleMaintenance/maintainInvoice/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 200 | 200 not found returns null | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Invoice DTO with populated vehicle/garage/users (vehicleMaintenance.controller.ts:239-258, vehicleMaintenance.util.ts:34).
