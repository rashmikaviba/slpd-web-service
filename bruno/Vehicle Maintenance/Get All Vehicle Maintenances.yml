  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Vehicle Maintenance/Get All Vehicle Maintenances/Get All Vehicle Maintenances - 401 no token.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/?startDate={{vmMonthStart}}&endDate={{vmMonthEnd}}"
      method: GET
      params:
        - name: startDate
          value: "{{vmMonthStart}}"
          type: query
        - name: endDate
          value: "{{vmMonthEnd}}"
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 without dates
    description: |-
      [KNOWN BUG] No query validation: missing startDate/endDate → `Invalid Date` → CastError on `maintenanceDate` → 404
      (vehicleMaintenance.service.ts:32-40, Document/vehicleMaintenance.md › Known issues).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle Maintenance/Get All Vehicle Maintenances/Get All Vehicle Maintenances - 404 without dates.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"Invalid Date\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/vehicleMaintenance`**

  This request runs the main scenario **200 working month**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 working month | (empty) |
  | 2 | 200 | 200 closed month lookup | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 without dates | No item found with ID "Invalid Date"! |

  ## Main scenario notes

  ACTIVE records in the date range as VehicleMaintenanceResponseDto[] (`id`, not `_id`) (vehicleMaintenance.controller.ts:217-237). Any authenticated role.
