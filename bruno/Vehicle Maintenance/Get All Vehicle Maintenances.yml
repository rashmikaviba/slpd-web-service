  - name: 200 closed month lookup
    description: |-
      Setup for month-end cases: records before the working month that month-end already closed. Stores the first one as
      `{{closedVehicleMaintenanceId}}`. If the DB has no closed record, the `… month end done` requests cannot pass.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle Maintenance/Get All Vehicle Maintenances/Get All Vehicle Maintenances - 200 closed month lookup.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/?startDate=2000-01-01&endDate={{vmBeforeMonthEnd}}"
      method: GET
      params:
        - name: startDate
