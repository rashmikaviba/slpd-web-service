info:
  name: Get All Vehicle Maintenances
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/vehicleMaintenance/?startDate={{vmMonthStart}}&endDate={{vmMonthEnd}}"
  params:
    - name: startDate
      value: "{{vmMonthStart}}"
      type: query
    - name: endDate
      value: "{{vmMonthEnd}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("contains created record", function () {
          expect(res.body.data.map((x) => x.id)).to.include(bru.getVar("vehicleMaintenanceId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
