info:
  name: Update Vehicle Maintenance
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/vehicleMaintenance/{{vehicleMaintenanceId}}"
  body:
    type: json
    data: |-
      {
        "vehicle": "{{vehicleId}}",
        "maintenancePart": "Engine oil change",
        "garage": "{{garageId}}",
        "maintenanceDate": "{{vmDate}}",
        "cost": 13000,
        "note": "Updated by Bruno",
        "billImageUrls": [
          "https://example.com/bills/bruno-1.png"
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Vehicle maintenance updated successfully
    - expression: res.body.data.cost
      operator: eq
      value: "13000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Same vehicle/garage, date inside working month (vehicleMaintenance.controller.ts:88-170).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle Maintenance/Update Vehicle Maintenance/Update Vehicle Maintenance - 200.yml
    request:
      url: "{{baseUrl}}/vehicleMaintenance/{{vehicleMaintenanceId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "vehicle": "{{vehicleId}}",
            "maintenancePart": "Engine oil change",
            "garage": "{{garageId}}",
            "maintenanceDate": "{{vmDate}}",
            "cost": 13000,
            "note": "Updated by Bruno",
            "billImageUrls": [
              "https://example.com/bills/bruno-1.png"
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle maintenance updated successfully",
            "data": {
