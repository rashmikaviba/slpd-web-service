docs: |-
  **PUT `/api/v1/vehicleMaintenance/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Vehicle maintenance updated successfully |
  | 2 | 400 | 400 missing cost | Cost is required |
  | 3 | 400 | 400 not found | Invalid vehicle maintenance! |
  | 4 | 400 | 400 month end done | Cannot update vehicle maintenance, Month end process already done! |
  | 5 | 400 | 400 vehicle does not exist | Invalid vehicle. Vehicle does not exist! |
  | 6 | 400 | 400 date not in working month | Vehicle maintenance date is not in working month! |
  | 7 | 400 | 400 garage does not exist | Invalid garage. Garage does not exist! |
  | 8 | 401 | 401 no token | Authentication invalid! |
  | 9 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 10 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Same vehicle/garage, date inside working month (vehicleMaintenance.controller.ts:88-170).
