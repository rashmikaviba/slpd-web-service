info:
  name: Monthly Trip Report
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/report/monthlyTripReport?date={{reportDate}}"
  params:
    - name: date
      value: "{{reportDate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        // mid-month day avoids TZ edge cases (server builds month bounds in local time from a UTC-parsed date)
        bru.setVar("reportDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-15`);
    - type: after-response
      code: if (res.status === 200) bru.setVar("monthlyTripReportCount", res.body.data.length);
    - type: tests
      code: |-
        const data = res.body.data;
        test("every trip is PENDING/START/FINISHED and ends in the selected month", function () {
          const sel = new Date(bru.getVar("reportDate"));
          const from = new Date(sel.getFullYear(), sel.getMonth(), 1).getTime();
          const to = new Date(sel.getFullYear(), sel.getMonth() + 1, 1).getTime();
          data.forEach((t) => {
            expect(t).to.include.all.keys("_id", "tripConfirmedNumber", "startDate", "endDate", "status", "expenses");
            expect([1, 3, 4]).to.include(t.status);
            const e = new Date(t.endDate).getTime();
            expect(e).to.be.at.least(from);
            expect(e).to.be.below(to);
          });
        });
        test("expenses is null or the TripExpensesResponseDto", function () {
          data.forEach((t) => {
            if (t.expenses === null) return;
            expect(t.expenses).to.have.all.keys("_id", "tripId", "expenses", "driverSalaries", "isMonthEndDone",
              "tripExpensesAmount", "totalTripExpensesAmount", "remainingTripExpensesAmount");
            expect(t.expenses.tripId).to.equal(t._id);
            t.expenses.expenses.forEach((x) => expect(x.status).to.equal(1));
            const total = t.expenses.expenses.reduce((s, x) => s + x.amount, 0);
            expect(t.expenses.totalTripExpensesAmount).to.equal(total);
            if (typeof t.expenses.tripExpensesAmount === "number") {
              expect(t.expenses.remainingTripExpensesAmount).to.equal(t.expenses.tripExpensesAmount - total);
            }
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 current month
    description: |-
      Raw lean trips (status PENDING/START/FINISHED, endDate in month) each with `expenses` = TripExpensesResponseDto or null
      (report.controller.ts:20-77, expenses.util.ts:3). Tests check the month window, statuses, expense DTO keys,
      ACTIVE-only items and the totals formula. Rows exist only if trips ending this month were created earlier in the run.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Report/Monthly Trip Report/Monthly Trip Report - 200 current month.yml
    request:
      url: "{{baseUrl}}/report/monthlyTripReport?date={{reportDate}}"
      method: GET
      params:
        - name: date
          value: "{{reportDate}}"
          type: query
    response:
