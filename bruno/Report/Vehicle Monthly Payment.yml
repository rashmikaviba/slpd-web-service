docs: |-
  **POST `/api/v1/report/vehicleMonthlyPaymentMaintance`**

  This request runs the main scenario **200 freelance vehicle**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 freelance vehicle | (empty) |
  | 2 | 400 | 400 missing month | Month is required |
  | 3 | 400 | 400 month not a string | Month is invalid |
  | 4 | 400 | 400 empty month | "month" is not allowed to be empty |
  | 5 | 400 | 400 missing vehicle | Vehicle is required |
  | 6 | 400 | 400 vehicle not a string | Vehicle is invalid |
  | 7 | 400 | 400 empty vehicle | "vehicle" is not allowed to be empty |
  | 8 | 400 | 400 missing rentalFor30Days | Rental For 30 Days is required |
  | 9 | 400 | 400 invalid rentalFor30Days | Rental For 30 Days is invalid |
  | 10 | 400 | 400 missing workedDaysCount | Worked Days Count is required |
  | 11 | 400 | 400 invalid workedDaysCount | Worked Days Count is invalid |
  | 12 | 400 | 400 unknown field | "foo" is not allowed |
  | 13 | 400 | 400 empty body | Month is required |
  | 14 | 400 | 400 vehicle not found | Invalid vehicle! |
  | 15 | 400 | 400 company vehicle | This vehicle is not freelance or rental vehicle! |
  | 16 | 401 | 401 no token | Authentication invalid! |
  | 17 | 403 | 403 Driver | You're unauthorized to access this resource! |
  | 18 | 403 | 403 Driver Assistant | You're unauthorized to access this resource! |
  | 19 | 403 | 403 Trip Assistant | You're unauthorized to access this resource! |
  | 20 | 404 | 404 malformed vehicle id | No item found with ID "not-an-object-id"! |
  | 21 | 404 | 404 invalid month string | No item found with ID "Invalid Date"! |

  ## Main scenario notes

  valuePerDay = rentalFor30Days / 30 = 3000; freelance → effectiveMaintenanceCost = Σ all maintenance costs this month
  (report.controller.ts:307-371). New vehicle → normally no maintenance → totals 0.
  [KNOWN BUG] report.controller.ts:365-366: `netTotal` is the amount BEFORE deductions and `grossTotal` the amount AFTER
  (names inverted, report.md › Known issues 3). Only presence/type is asserted so the test survives a rename fix.
