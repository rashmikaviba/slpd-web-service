info:
  name: Vehicle Monthly Payment
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/report/vehicleMonthlyPaymentMaintance"
  body:
    type: json
    data: |-
      {
        "month": "{{reportDate}}",
        "vehicle": "{{reportFreelanceVehicleId}}",
        "rentalFor30Days": 90000,
        "workedDaysCount": 20
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        // mid-month day avoids TZ edge cases (server builds month bounds in local time from a UTC-parsed date)
        bru.setVar("reportDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-15`);
    - type: tests
      code: |-
        const d = res.body.data;
        test("exactly the payment report fields", function () {
          expect(d).to.have.all.keys("vehicleMaintenances", "vehicle", "rentalFor30Days", "workedDaysCount", "valuePerDay",
            "totalVehicleMaintenance", "effectiveMaintenanceCost", "netTotal", "grossTotal", "selectedDate");
        });
        test("vehicle is the populated freelance vehicle", function () {
          expect(d.vehicle.isFreelanceVehicle).to.equal(true);
          expect(d.vehicle.createdBy).to.be.an("object");
        });
        test("maintenance totals (freelance: every cost is deducted)", function () {
          const total = d.vehicleMaintenances.reduce((s, m) => s + m.cost, 0);
          expect(d.totalVehicleMaintenance).to.equal(total);
          expect(d.effectiveMaintenanceCost).to.equal(total);
        });
        test("[KNOWN BUG] netTotal / grossTotal present (names are swapped)", function () {
          expect(d).to.have.property("netTotal");
          expect(d).to.have.property("grossTotal");
          expect(d.netTotal).to.be.a("number");
          expect(d.grossTotal).to.be.a("number");
        });
        test("selectedDate is the parsed month", function () {
          expect(new Date(d.selectedDate).toISOString().slice(0, 10)).to.equal(bru.getVar("reportDate"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data.rentalFor30Days
      operator: eq
      value: "90000"
    - expression: res.body.data.workedDaysCount
      operator: eq
      value: "20"
    - expression: res.body.data.valuePerDay
      operator: eq
      value: "3000"
    - expression: res.body.data.vehicle._id
      operator: eq
      value: "{{reportFreelanceVehicleId}}"
    - expression: res.body.data.vehicleMaintenances
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 freelance vehicle
    description: |-
      valuePerDay = rentalFor30Days / 30 = 3000; freelance → effectiveMaintenanceCost = Σ all maintenance costs this month
      (report.controller.ts:307-371). New vehicle → normally no maintenance → totals 0.
      [KNOWN BUG] report.controller.ts:365-366: `netTotal` is the amount BEFORE deductions and `grossTotal` the amount AFTER
      (names inverted, report.md › Known issues 3). Only presence/type is asserted so the test survives a rename fix.

