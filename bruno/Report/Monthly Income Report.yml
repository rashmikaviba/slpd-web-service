info:
  name: Monthly Income Report
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/report/monthlyIncomeReport?date={{reportDate}}"
  params:
    - name: date
      value: "{{reportDate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        // mid-month day avoids TZ edge cases (server builds month bounds in local time from a UTC-parsed date)
        bru.setVar("reportDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-15`);
    - type: after-response
      code: if (res.status === 200) bru.setVar("monthlyIncomeReportCount", res.body.data.length);
    - type: tests
      code: |-
        const data = res.body.data;
        test("every row has the MonthlyIncomeReportResponseDto fields", function () {
          data.forEach((r) => {
            expect(r).to.have.all.keys("tripId", "confirmationNumber", "startDate", "endDate", "expenseId", "totalCost",
              "totalCostLocalCurrency", "estimatedExpense", "remainingExpenses", "totalExpense", "totalDriverSalary",
              "isRemainingToDriver", "tripIncome");
            expect(r.isRemainingToDriver).to.be.a("boolean");
          });
        });
        test("tripIncome = totalCostLocalCurrency - totalDriverSalary - totalExpense", function () {
          data.forEach((r) => expect(r.tripIncome).to.equal(r.totalCostLocalCurrency - r.totalDriverSalary - r.totalExpense));
        });
        test("remainingExpenses = estimatedExpense - totalExpense", function () {
          data.filter((r) => typeof r.estimatedExpense === "number").forEach((r) =>
            expect(r.remainingExpenses).to.equal(r.estimatedExpense - r.totalExpense));
        });
        test("[KNOWN BUG] totalIncomeLocalCurrency is always undefined (missing from JSON)", function () {
          data.forEach((r) => expect(r).to.not.have.property("totalIncomeLocalCurrency"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

