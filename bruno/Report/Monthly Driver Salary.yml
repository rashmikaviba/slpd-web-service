info:
  name: Monthly Driver Salary
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/report/monthlyDriverSalary?date={{reportDate}}"
  params:
    - name: date
      value: "{{reportDate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        // mid-month day avoids TZ edge cases (server builds month bounds in local time from a UTC-parsed date)
        bru.setVar("reportDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-15`);
    - type: after-response
      code: if (res.status === 200) bru.setVar("monthlyDriverSalaryCount", res.body.data.length);
    - type: tests
      code: |-
        const data = res.body.data;
        test("every row has exactly the DriverSalaryReportResponseDto fields", function () {
          data.forEach((r) => {
            expect(r).to.have.all.keys("tripId", "tripConfirmationNumber", "driverId", "driverName", "salaryPerDay",
              "remainingExpenses", "totalDeduction", "totalAddition", "totalSalary", "noOfDays", "isRemainingToDriver",
              "createdDate", "createdUser", "updatedDate", "updatedUser");
            ["salaryPerDay", "remainingExpenses", "totalDeduction", "totalAddition", "totalSalary", "noOfDays"].forEach((k) =>
              expect(r[k]).to.be.a("number"));
            expect(r.isRemainingToDriver).to.be.a("boolean");
            expect(r.driverName).to.be.a("string");
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
