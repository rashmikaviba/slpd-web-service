  - name: 404 invalid date
    description: |-
      `new Date("not-a-date")` → Invalid Date month bounds → Mongoose CastError in report.service.ts:7-15
      (findAllTripsByDateAndStatusIn) → error.middleware.ts:56-60 → 404 `No item found with ID "Invalid Date"!`.
      No 400 validation exists for `date` (report.md › Known issues 11). Note: report.md says 500; verified the cast
      error is a `CastError`, which the middleware maps to 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Report/Monthly Driver Salary/Monthly Driver Salary - 404 invalid date.yml
    request:
      url: "{{baseUrl}}/report/monthlyDriverSalary?date=not-a-date"
      method: GET
      params:
        - name: date
          value: not-a-date
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"Invalid Date\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/report/monthlyDriverSalary`**

  This request runs the main scenario **200 current month**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 current month | (empty) |
  | 2 | 200 | 200 Finance Officer | (empty) |
  | 3 | 200 | 200 Trip Manager | (empty) |
  | 4 | 200 | 200 no date defaults to current month | (empty) |
  | 5 | 200 | 200 month with no data | (empty) |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 403 | 403 Driver | You're unauthorized to access this resource! |
  | 8 | 403 | 403 Driver Assistant | You're unauthorized to access this resource! |
  | 9 | 403 | 403 Trip Assistant | You're unauthorized to access this resource! |
  | 10 | 404 | 404 invalid date | No item found with ID "Invalid Date"! |

  ## Main scenario notes

  One row per `driverSalaries[]` entry of FINISHED trips ending this month (report.controller.ts:177-203,
  report.util.ts:72). Rows exist only if a trip was finished and driver salaries were saved earlier in the run.
