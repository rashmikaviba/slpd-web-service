info:
  name: Monthly Expenses Report
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/report/monthlyExpensesReport?date={{reportDate}}"
  params:
    - name: date
      value: "{{reportDate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        // mid-month day avoids TZ edge cases (server builds month bounds in local time from a UTC-parsed date)
        bru.setVar("reportDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-15`);
    - type: after-response
      code: if (res.status === 200) bru.setVar("monthlyExpensesReportCount", res.body.data.length);
    - type: tests
      code: |-
        const data = res.body.data;
        const maint = ["Company Vehicle Maintenance", "Rental Vehicle Maintenance"];
        test("every row has exactly the ExpensesReportResponseDto fields", function () {
          data.forEach((r) => {
            expect(r).to.have.all.keys("tripId", "confirmationNumber", "expenseId", "typeId", "typeName", "amount", "description", "date", "createdDate", "createdUser", "updatedDate", "updatedUser");
            expect(r.amount).to.be.a("number");
            expect(r.createdUser).to.be.a("string");
            expect(r.updatedUser).to.be.a("string");
          });
        });
        test("maintenance rows: typeId 0, no trip, description format", function () {
          data.filter((r) => maint.includes(r.typeName)).forEach((r) => {
            expect(r.typeId).to.equal(0);
            expect(r.tripId).to.equal("");
            expect(r.confirmationNumber).to.equal("");
            expect(r.description).to.match(/^Vehicle : .*, Garage Name : .*, Maintenance Part : /);
          });
        });
        test("rows ordered: trip expenses, then monthly expenses, then maintenance", function () {
          const rank = (r) => (r.tripId !== "" ? 0 : maint.includes(r.typeName) ? 2 : 1);
          for (let i = 1; i < data.length; i++) expect(rank(data[i - 1])).to.be.at.most(rank(data[i]));
        });
        test("[KNOWN BUG] monthly (company) expense rows have updatedUser 'undefined (undefined)'", function () {
          data.filter((r) => r.tripId === "" && !maint.includes(r.typeName)).forEach((r) => {
            expect(r.updatedUser).to.equal("undefined (undefined)");
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 current month
    description: |-
      Flat ledger: ACTIVE trip expense items of trips ending this month, then ACTIVE items of the month's MonthlyExpenses
      doc, then company-borne maintenance (report.controller.ts:80-173, report.util.ts:4/31).
      [KNOWN BUG] Monthly expense rows always have `updatedUser: "undefined (undefined)"` because report.service.ts:39-45 populates
      only `expenses.createdBy` (report.md › Known issues 2). That test is vacuous unless a MonthlyExpenses doc exists for
      the current month (created by the Monthly Expenses module earlier in the run).

