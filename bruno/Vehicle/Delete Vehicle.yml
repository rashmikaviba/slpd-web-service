info:
  name: Delete Vehicle
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/vehicle/{{vehicleToDeleteId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Vehicle deleted successfully!
    - expression: res.body.data
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      [DESTRUCTIVE] Soft-deletes the throwaway vehicle (status 3).
      [KNOWN BUG] `data` is the `updateVehicle` function reference → absent in JSON (vehicle.controller.ts:275). SUPERADMIN only.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 200.yml
    request:
      url: "{{baseUrl}}/vehicle/{{vehicleToDeleteId}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle deleted successfully!"
          }
  - name: 400 already deleted
    description: |-
      Precondition: previous request deleted it. Only ACTIVE/INACTIVE are found (vehicle.controller.ts:256-263).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 400 already deleted.yml
    request:
      url: "{{baseUrl}}/vehicle/{{vehicleToDeleteId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle not found!",
            "data": null
          }
  - name: 400 not found
    description: |-
      vehicle.controller.ts:256-263.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 400 not found.yml
    request:
      url: "{{baseUrl}}/vehicle/{{nonExistingId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 401 no token.yml
    request:
      url: "{{baseUrl}}/vehicle/{{vehicleToDeleteId}}"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 admin role
    description: |-
      SUPERADMIN only (vehicle.route.ts:46-50).

      Auth: bearer {{adminToken}}

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 403 admin role.yml
    request:
      url: "{{baseUrl}}/vehicle/{{vehicleToDeleteId}}"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → CastError → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Delete Vehicle/Delete Vehicle - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/vehicle/{{invalidId}}"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }
  - name: 200 cleanup renewal vehicle (Notification setup)
    description: |-
      [DESTRUCTIVE] Cleanup: soft-deletes (status 3) the vehicle created by seq 1 so it stops appearing in
      renewal notifications (deleted vehicles are excluded, notification.service.ts:15). vehicle.controller.ts deleteVehicleById.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Notification/Delete Vehicle - 200 cleanup renewal vehicle.yml
    request:
      url: "{{baseUrl}}/vehicle/{{notifVehicleId}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle deleted successfully!"
          }
  - name: 200 cleanup freelance vehicle (Report setup)
    description: |-
      [DESTRUCTIVE] Cleanup: soft-deletes the freelance vehicle created in setup (vehicle.controller.ts deleteVehicleById).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Report/Vehicle Monthly Payment Maintance/Delete Vehicle - 200 cleanup freelance vehicle.yml
    request:
      url: "{{baseUrl}}/vehicle/{{reportFreelanceVehicleId}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle deleted successfully!"
          }
  - name: 200 cleanup company vehicle (Report setup)
    description: |-
      [DESTRUCTIVE] Cleanup: soft-deletes the company vehicle created in setup (vehicle.controller.ts deleteVehicleById).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Report/Vehicle Monthly Payment Maintance/Delete Vehicle - 200 cleanup company vehicle.yml
    request:
      url: "{{baseUrl}}/vehicle/{{reportCompanyVehicleId}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle deleted successfully!"
          }

docs: |-
  **DELETE `/api/v1/vehicle/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Vehicle deleted successfully! |
  | 2 | 400 | 400 already deleted | Vehicle not found! |
  | 3 | 400 | 400 not found | Vehicle not found! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 403 | 403 admin role | You're unauthorized to access this resource! |
  | 6 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |
  | 7 | 200 | 200 cleanup renewal vehicle (Notification setup) | Vehicle deleted successfully! |
  | 8 | 200 | 200 cleanup freelance vehicle (Report setup) | Vehicle deleted successfully! |
  | 9 | 200 | 200 cleanup company vehicle (Report setup) | Vehicle deleted successfully! |

  ## Main scenario notes

  [DESTRUCTIVE] Soft-deletes the throwaway vehicle (status 3).
  [KNOWN BUG] `data` is the `updateVehicle` function reference → absent in JSON (vehicle.controller.ts:275). SUPERADMIN only.
