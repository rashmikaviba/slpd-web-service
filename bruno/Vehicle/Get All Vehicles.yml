docs: |-
  **GET `/api/v1/vehicle`**

  This request runs the main scenario **200 withInactive=false still includes inactive**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 active only | (empty) |
  | 2 | 200 | 200 withInactive=false still includes inactive | (empty) |
  | 3 | 200 | 200 withInactive | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |

  ## Main scenario notes

  [KNOWN BUG] `withInactive` is truthy for any non-empty string, so `false` still returns INACTIVE vehicles (vehicle.controller.ts:230). Precondition: previous request inactivated `{{vehicleToDeleteId}}`.
