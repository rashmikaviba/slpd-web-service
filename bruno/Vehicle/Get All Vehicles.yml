info:
  name: Get All Vehicles
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/vehicle/?withInactive=false"
  params:
    - name: withInactive
      value: "false"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("inactive throwaway vehicle is listed", function () {
          expect(res.body.data.map((v) => v._id)).to.include(bru.getVar("vehicleToDeleteId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
