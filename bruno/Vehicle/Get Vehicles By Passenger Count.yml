        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"NaN\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/vehicle/passengerCount/:count`**

  This request runs the main scenario **200 no date range**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 no date range | (empty) |
  | 2 | 200 | 200 with date range and tripId | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 date range without tripId | No item found with ID ""! |
  | 5 | 404 | 404 non-numeric count | No item found with ID "NaN"! |

  ## Main scenario notes

  ACTIVE vehicles with availableSeats >= 10; no trip exclusion without dates (vehicle.controller.ts:329-353, vehicle.service.ts:86-140).
