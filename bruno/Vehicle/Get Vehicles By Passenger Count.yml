  - name: 200 with date range and tripId
    description: |-
      With both dates, vehicles on overlapping ACTIVE internal trips / PENDING-START trips are excluded. `tripId` must be a valid ObjectId (see next request).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Get Vehicles By Passenger Count/Get Vehicles By Passenger Count - 200 with date range and tripId.yml
    request:
      url: "{{baseUrl}}/vehicle/passengerCount/10?startDate=2090-06-01&endDate=2090-06-05&tripId={{nonExistingId}}"
