info:
  name: Get Vehicles By Passenger Count
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/vehicle/passengerCount/10"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("main vehicle (14 seats) is available", function () {
          expect(res.body.data.map((v) => v._id)).to.include(bru.getVar("vehicleId"));
        });
        test("typeName added", function () {
          expect(res.body.data[0]).to.have.property("typeName");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

