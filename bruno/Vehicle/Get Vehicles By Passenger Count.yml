  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Vehicle/Get Vehicles By Passenger Count/Get Vehicles By Passenger Count - 401 no token.yml
    request:
      url: "{{baseUrl}}/vehicle/passengerCount/10"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 date range without tripId
    description: |-
      [KNOWN BUG] `tripId` defaults to `''`; `_id: { $ne: '' }` throws a CastError, so the lookup used when creating a new trip always fails (vehicle.service.ts:113, Document/vehicle.md › Known issues).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Get Vehicles By Passenger Count/Get Vehicles By Passenger Count - 404 date range without tripId.yml
    request:
      url: "{{baseUrl}}/vehicle/passengerCount/10?startDate=2090-06-01&endDate=2090-06-05"
      method: GET
      params:
        - name: startDate
          value: 2090-06-01
          type: query
        - name: endDate
          value: 2090-06-05
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"\"!",
            "data": null
          }
  - name: 404 non-numeric count
    description: |-
      [KNOWN BUG] `+count` is NaN → CastError on `availableSeats` → 404 instead of 400 (vehicle.controller.ts:337).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Get Vehicles By Passenger Count/Get Vehicles By Passenger Count - 404 non-numeric count.yml
    request:
      url: "{{baseUrl}}/vehicle/passengerCount/abc"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
