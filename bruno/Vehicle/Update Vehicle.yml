info:
  name: Update Vehicle
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/vehicle/{{vehicleId}}"
  body:
    type: json
    data: |-
      {
        "vehicleType": 2,
        "vehicleOwner": "SLPD Bruno",
        "registrationNumber": "{{vehicleRegNo}}",
        "capacity": 15,
        "availableSeats": 14,
        "gpsTracker": "{{vehicleGps}}",
        "description": "Updated by Bruno",
        "licenseRenewalDate": "2027-06-30",
        "insuranceRenewalDate": "2027-06-30",
        "gearOil": "75W-90",
        "airFilter": "AF-100",
        "oilFilter": "OF-200",
        "initialMileage": 1000,
        "isFreelanceVehicle": false,
        "isRentalVehicle": false,
        "rentalFor30Days": 0
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Vehicle updated successfully!
    - expression: res.body.data.description
      operator: eq
      value: Updated by Bruno
    - expression: res.body.data.currentMileage
      operator: eq
      value: "1000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

