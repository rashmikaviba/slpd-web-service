docs: |-
  **PUT `/api/v1/vehicle/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Vehicle updated successfully! |
  | 2 | 200 | 200 initialMileage change resets currentMileage | Vehicle updated successfully! |
  | 3 | 400 | 400 missing vehicleType | Vehicle Type is required! |
  | 4 | 400 | 400 not found | Vehicle not found! |
  | 5 | 400 | 400 duplicate registrationNumber | Vehicle already exists with this registration number! |
  | 6 | 400 | 400 duplicate gpsTracker | Vehicle already exists with this GPS Tracker! |
  | 7 | 401 | 401 no token | Authentication invalid! |
  | 8 | 403 | 403 admin role | You're unauthorized to access this resource! |
  | 9 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Same registration/GPS/initialMileage as created, new description (vehicle.controller.ts:111-210). SUPERADMIN only. initialMileage unchanged so currentMileage is kept.
