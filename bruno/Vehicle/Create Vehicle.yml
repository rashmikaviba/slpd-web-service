docs: |-
  **POST `/api/v1/vehicle`**

  This request runs the main scenario **201 company vehicle**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 company vehicle | Vehicle created successfully! |
  | 2 | 201 | 201 throwaway vehicle for delete | Vehicle created successfully! |
  | 3 | 201 | 201 freelance vehicle without GPS | Vehicle created successfully! |
  | 4 | 400 | 400 missing vehicleType | Vehicle Type is required! |
  | 5 | 400 | 400 invalid vehicleType | Vehicle Type is invalid! |
  | 6 | 400 | 400 missing vehicleOwner | Vehicle Owner is required |
  | 7 | 400 | 400 invalid vehicleOwner | Vehicle Owner is invalid |
  | 8 | 400 | 400 missing registrationNumber | Registration Number is required |
  | 9 | 400 | 400 invalid registrationNumber | Registration Number is invalid |
  | 10 | 400 | 400 missing capacity | Capacity is required |
  | 11 | 400 | 400 invalid capacity | Capacity is invalid |
  | 12 | 400 | 400 missing availableSeats | Available Seats is required |
  | 13 | 400 | 400 invalid availableSeats | Available Seats is invalid |
  | 14 | 400 | 400 invalid gpsTracker | GPS Tracker is invalid |
  | 15 | 400 | 400 invalid description | Reason is invalid |
  | 16 | 400 | 400 description too long | Reason cannot be more than 500 characters |
  | 17 | 400 | 400 invalid licenseRenewalDate | License Renewal Date is invalid |
  | 18 | 400 | 400 invalid insuranceRenewalDate | Insurance Renewal Date is invalid |
  | 19 | 400 | 400 invalid gearOil | Gear Oil is invalid |
  | 20 | 400 | 400 gearOil too long | Gear Oil cannot be more than 200 characters |
  | 21 | 400 | 400 airFilter too long | Air Filter cannot be more than 200 characters |
  | 22 | 400 | 400 oilFilter too long | Air Filter cannot be more than 200 characters |
  | 23 | 400 | 400 missing initialMileage | Initial Mileage is required |
  | 24 | 400 | 400 invalid initialMileage | Initial Mileage is invalid |
  | 25 | 400 | 400 invalid isFreelanceVehicle | "isFreelanceVehicle" must be a boolean |
  | 26 | 400 | 400 freelance without rentalFor30Days | Rental For 30 Days is required for rental vehicles |
  | 27 | 400 | 400 rental without rentalFor30Days | Rental For 30 Days is required for rental vehicles |
  | 28 | 400 | 400 invalid rentalFor30Days | Rental For 30 Days must be a number |
  | 29 | 400 | 400 duplicate registrationNumber | Vehicle already exists with this registration number! |
  | 30 | 400 | 400 duplicate gpsTracker | Vehicle already exists with this GPS Tracker! |
  | 31 | 400 | 400 null gpsTracker collides | Vehicle already exists with this GPS Tracker! |
  | 32 | 401 | 401 no token | Authentication invalid! |
  | 33 | 403 | 403 admin role | You're unauthorized to access this resource! |
  | 34 | 201 | 201 internal trip vehicle setup (Internal Trip setup) | Vehicle created successfully! |
  | 35 | 201 | 201 setup renewal due (Notification setup) | Vehicle created successfully! |
  | 36 | 201 | 201 setup freelance vehicle (Report setup) | Vehicle created successfully! |
  | 37 | 201 | 201 setup company vehicle (Report setup) | Vehicle created successfully! |

  ## Main scenario notes

  Company vehicle (not freelance, not rental), initialMileage 1000. Stores `{{vehicleId}}`, `{{vehicleRegNo}}`, `{{vehicleGps}}`.
  Response 201 with the saved document, currentMileage = initialMileage (vehicle.controller.ts:89-103). Role: SUPERADMIN.
