info:
  name: Create Vehicle
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/vehicle/"
  body:
    type: json
    data: |-
      {
        "vehicleType": 2,
        "vehicleOwner": "SLPD Bruno",
        "registrationNumber": "{{newVehicleRegNo}}",
        "capacity": 15,
        "availableSeats": 14,
        "gpsTracker": "{{newVehicleGps}}",
        "description": "Bruno test vehicle",
        "licenseRenewalDate": "2027-06-30",
        "insuranceRenewalDate": "2027-06-30",
        "gearOil": "75W-90",
        "airFilter": "AF-100",
        "oilFilter": "OF-200",
        "initialMileage": 1000,
        "isFreelanceVehicle": false,
        "isRentalVehicle": false,
        "rentalFor30Days": 0
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const ts = Date.now();
        bru.setVar("newVehicleRegNo", "BRU-" + ts);
        bru.setVar("newVehicleGps", "GPS-" + ts);
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          bru.setVar("vehicleId", res.body.data._id);
          bru.setVar("vehicleRegNo", res.body.data.registrationNumber);
          bru.setVar("vehicleGps", res.body.data.gpsTracker);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Vehicle created successfully!
    - expression: res.body.data.status
      operator: eq
      value: "1"
    - expression: res.body.data.currentMileage
      operator: eq
      value: "1000"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 company vehicle
    description: |-
      Company vehicle (not freelance, not rental), initialMileage 1000. Stores `{{vehicleId}}`, `{{vehicleRegNo}}`, `{{vehicleGps}}`.
      Response 201 with the saved document, currentMileage = initialMileage (vehicle.controller.ts:89-103). Role: SUPERADMIN.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Create Vehicle/Create Vehicle - 201 company vehicle.yml
    request:
      url: "{{baseUrl}}/vehicle/"
      method: POST
