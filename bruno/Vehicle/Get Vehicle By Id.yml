            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → Mongoose CastError in findOne → error.middleware.ts:57-60.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Get Vehicle By Id/Get Vehicle By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/vehicle/{{invalidId}}"
      method: GET
    response:
