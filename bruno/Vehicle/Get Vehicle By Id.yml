info:
  name: Get Vehicle By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/vehicle/{{vehicleId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data._id
      operator: eq
      value: '"{{vehicleId}}"'
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
