  - name: 400 not found
    description: |-
      Valid ObjectId that does not exist (vehicle.controller.ts:221-223).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Vehicle/Get Vehicle By Id/Get Vehicle By Id - 400 not found.yml
    request:
      url: "{{baseUrl}}/vehicle/{{nonExistingId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Vehicle/Get Vehicle By Id/Get Vehicle By Id - 401 no token.yml
    request:
