info:
  name: Get Expense Request By Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/expenseRequest/{{expenseRequestId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data.requestedAmount
      operator: eq
      value: "5000"
    - expression: res.body.data.typeName
      operator: eq
      value: Expense Extension Request
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Any role. `ExpenseRequestByIdResponseDto` incl. requester bank details. `src/modules/expenseRequest/expenseRequest.controller.ts:268`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expense Request/Get Expense Request By Id - 200.yml
    request:
      url: "{{baseUrl}}/expenseRequest/{{expenseRequestId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "_id": "6731f4a2b4c5d6e7f8a9b101",
              "tripId": "6731e5a2b4c5d6e7f8a9b0a1",
              "typeName": "Expense Extension Request",
              "description": "Bruno needs more fuel money",
              "requestedAmount": 5000,
              "requestedUserId": "6650a1b2c3d4e5f6a7b8c9d1",
              "requestedUserName": "Nuwan Bandara",
              "bankName": "Bank of Ceylon",
              "bankId": 7010,
              "branch": "Kandy",
              "accountNumber": "0081234567",
              "accountHolderName": "N. Bandara",
              "accountHolderAddress": "No. 12, Peradeniya Road, Kandy",
              "tripConfirmedNumber": "BRUNO-MAIN-1794990790000",
              "createdAt": "2026-11-18T08:42:00.512Z"
            }
          }
  - name: 400 not found
    description: |-
      Not-found is a 400 here. `src/modules/expenseRequest/expenseRequest.controller.ts:281`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expense Request/Get Expense Request By Id - 400 not found.yml
    request:
      url: "{{baseUrl}}/expenseRequest/{{nonExistingId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No expense requests were found.!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Expense Request/Get Expense Request By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/expenseRequest/{{expenseRequestId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `src/modules/expenseRequest/expenseRequest.controller.ts:274`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expense Request/Get Expense Request By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/expenseRequest/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **GET `/api/v1/expenseRequest/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 400 | 400 not found | No expense requests were found.! |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid id | No item found with ID " |

  ## Main scenario notes

  Any role. `ExpenseRequestByIdResponseDto` incl. requester bank details. `src/modules/expenseRequest/expenseRequest.controller.ts:268`
