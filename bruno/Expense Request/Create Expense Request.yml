docs: |-
  **POST `/api/v1/expenseRequest`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Expense request saved successfully! |
  | 2 | 201 | 201 second request | Expense request saved successfully! |
  | 3 | 400 | 400 pending request exists | You already have a pending expense request for this trip. If you need immediate assistance, please contact the administrator! |
  | 4 | 400 | 400 missing tripId | Type is required |
  | 5 | 400 | 400 tripId not a string | Type is invalid |
  | 6 | 400 | 400 missing requestedAmount | Requested Amount is required |
  | 7 | 400 | 400 requestedAmount not a number | Requested Amount is invalid |
  | 8 | 400 | 400 description too long | Description should not be more than 500 characters |
  | 9 | 400 | 400 unknown field | "foo" is not allowed |
  | 10 | 400 | 400 trip not started | Invalid trip or trip is not in started status! |
  | 11 | 401 | 401 no token | Authentication invalid! |
  | 12 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 13 | 404 | 404 invalid trip id | No item found with ID " |
  | 14 | 201 | Request Expense - 201 setup pending expense request (Trip setup) | Expense request saved successfully! |

  ## Main scenario notes

  DRIVER only. Trip must be START and have no PENDING request. Emits socket `new-expense-request`. Returns `data: null`. `src/modules/expenseRequest/expenseRequest.controller.ts:20`
