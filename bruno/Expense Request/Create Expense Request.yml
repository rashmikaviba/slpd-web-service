info:
  name: Create Expense Request
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/expenseRequest"
  body:
    type: json
    data: |-
      {
        "tripId": "{{tripId}}",
        "requestedAmount": 5000,
        "description": "Bruno needs more fuel money"
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Expense request saved successfully!
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      DRIVER only. Trip must be START and have no PENDING request. Emits socket `new-expense-request`. Returns `data: null`. `src/modules/expenseRequest/expenseRequest.controller.ts:20`

      Auth: bearer {{driverToken}}

      Source scenario: Expense Request/Create Expense Request - 201.yml
    request:
      url: "{{baseUrl}}/expenseRequest"
      method: POST
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "requestedAmount": 5000,
            "description": "Bruno needs more fuel money"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Expense request saved successfully!",
            "data": null
          }
  - name: 201 second request
    description: |-
      Allowed again because the previous one is no longer PENDING. Will be rejected.

      Auth: bearer {{driverToken}}

      Source scenario: Expense Request/Create Expense Request - 201 second request.yml
    request:
      url: "{{baseUrl}}/expenseRequest"
      method: POST
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "requestedAmount": 2000,
            "description": "Bruno second request"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Expense request saved successfully!",
            "data": null
          }
  - name: 400 pending request exists
    description: |-
      State-dependent, so placed right after the create: the request above is still PENDING. `src/modules/expenseRequest/expenseRequest.controller.ts:48`

