info:
  name: Update User
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/user/{{createdUserId}}"
  body:
    type: json
    data: |-
      {
        "fullName": "Bruno Test User (updated)",
        "userName": "{{createdUserName}}",
        "gender": 1,
        "dateOfBirth": "1990-01-15",
        "address": "1 Test Street, Colombo",
        "phoneNumber1": "0771234567",
        "phoneNumber2": "",
        "email": "{{createdUserEmail}}",
        "profileImageUrl": "",
        "nic": "{{createdUserNic}}",
        "bankName": "Test Bank",
        "bankId": 1,
        "branch": "Colombo",
        "accountNumber": "000111222333",
        "accountHolderName": "Bruno Test User",
        "accountHolderAddress": "1 Test Street, Colombo",
        "basicSalary": 50000,
        "leaveCount": 14,
        "languages": ["English", "Sinhala"],
        "role": 3,
        "isFreelanceDriver": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns updated raw user", function () {
          expect(res.body.data._id).to.equal(bru.getVar("createdUserId"));
          expect(res.body.data.fullName).to.equal("Bruno Test User (updated)");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: User updated successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
