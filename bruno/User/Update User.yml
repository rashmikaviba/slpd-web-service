docs: |-
  **PUT `/api/v1/user/:id`**

  This request runs the main scenario **200 created user**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 created user | User updated successfully! |
  | 2 | 400 | 400 duplicate userName | User Name already exists! |
  | 3 | 400 | 400 invalid role | Valid Role is required! |
  | 4 | 400 | 400 invalid gender | Valid Gender is required! |
  | 5 | 400 | 400 missing bankId | Bank Id is required |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 403 | 403 admin | You're unauthorized to access this resource! |
  | 8 | 404 | 404 not found | User not found! |
  | 9 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Same userName/email/nic (own values are excluded from the uniqueness check), new fullName (user.controller.ts:155-294).
