info:
  name: Get User By Id
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/user/{{createdUserId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("dto of the created driver", function () {
          expect(res.body.data._id).to.equal(bru.getVar("createdUserId"));
          expect(res.body.data.role).to.equal(3);
          expect(res.body.data.gender).to.equal(1);
          expect(res.body.data.isBlackListed).to.equal(false);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

