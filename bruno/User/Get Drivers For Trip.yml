  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. user.router.ts:20-28.

      Auth: none (no Authorization header)

      Source scenario: User/Get Drivers For Trip/Get Drivers For Trip - 401 no token.yml
    request:
      url: "{{baseUrl}}/user/getDriversForTrip"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 driver
    description: |-
      Route allows SUPERADMIN, ADMIN, TRIPMANAGER only; `{{driverToken}}` is rejected by auth.middleware.ts:73-77. user.router.ts:20-28.

      Auth: bearer {{driverToken}}

      Source scenario: User/Get Drivers For Trip/Get Drivers For Trip - 403 driver.yml
    request:
      url: "{{baseUrl}}/user/getDriversForTrip"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 [KNOWN BUG] dates without tripId
    description: |-
      [KNOWN BUG] `tripId` defaults to `''` (user.controller.ts:496) and is used as `_id: { $ne: '' }`
      (user.service.ts:205) → CastError → 404 `No item found with ID ""!`. Creating a new trip must therefore always
      send a tripId. Document/user.md #11.

      Auth: collection default ({{superAdminToken}})

      Source scenario: User/Get Drivers For Trip/Get Drivers For Trip - 404 [KNOWN BUG] dates without tripId.yml
    request:
      url: "{{baseUrl}}/user/getDriversForTrip?startDate=2026-01-01&endDate=2026-01-03"
      method: GET
      params:
        - name: startDate
          value: 2026-01-01
          type: query
        - name: endDate
          value: 2026-01-03
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/user/getDriversForTrip`**

  This request runs the main scenario **200 no dates**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 no dates | (empty) |
  | 2 | 200 | 200 date range with tripId | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 403 | 403 driver | You're unauthorized to access this resource! |
  | 5 | 404 | 404 [KNOWN BUG] dates without tripId | No item found with ID ""! |

  ## Main scenario notes

  Without both dates no trips are excluded (user.service.ts:186). Precondition: User/Unblock ran so `{{createdUserId}}` is unblocked.
