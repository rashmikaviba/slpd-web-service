info:
  name: Get Drivers For Trip
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/user/getDriversForTrip"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("all active unblocked drivers incl. created user", function () {
          expect(res.body.data).to.be.an("array");
          expect(res.body.data.map((u) => u._id)).to.include(bru.getVar("createdUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

