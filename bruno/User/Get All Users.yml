docs: |-
  **GET `/api/v1/user`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 401 | 401 no token | Authentication invalid! |
  | 3 | 403 | 403 admin | You're unauthorized to access this resource! |
  | 4 | 401 | No token - 401 (Auth setup) | Authentication invalid! |
  | 5 | 401 | Header without Bearer prefix - 401 (Auth setup) | Authentication invalid! |
  | 6 | 401 | Expired token - 401 (Auth setup) | Your session is expired! |
  | 7 | 403 | Malformed token - 403 (Auth setup) | You're unauthorized to access this resource! |
  | 8 | 403 | Wrong role - 403 (Auth setup) | You're unauthorized to access this resource! |

  ## Main scenario notes

  Cached `user-findAllWithGenderRole`; caller removed (user.controller.ts:346-361). `isBlackListed` comes from Auth.
  [KNOWN ISSUE] cache is not cleared by block/unblock, so `isBlackListed` can be stale (Document/user.md #3).
