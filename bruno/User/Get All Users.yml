info:
  name: Get All Users
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/user"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("UserResponseDto list without the caller", function () {
          const ids = res.body.data.map((u) => u._id);
          expect(ids).to.include(bru.getVar("createdUserId"));
          expect(ids).to.not.include(bru.getVar("superAdminUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
