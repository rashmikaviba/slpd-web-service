info:
  name: Validate User
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/user/validateUser?userName=free_{{$timestamp}}{{$randomInt}}&email=free{{$timestamp}}{{$randomInt}}@example.com&nic=FREE{{$timestamp}}{{$randomInt}}"
  params:
    - name: userName
      value: free_{{$timestamp}}{{$randomInt}}
      type: query
    - name: email
      value: free{{$timestamp}}{{$randomInt}}@example.com
      type: query
    - name: nic
      value: FREE{{$timestamp}}{{$randomInt}}
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("empty message", function () {
          expect(res.body.message).to.equal("");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 all values free
    description: |-
      No ACTIVE user has these values (user.controller.ts:415-432).

      Auth: collection default ({{superAdminToken}})

      Source scenario: User/Validate User/Validate User - 200 all values free.yml
    request:
      url: "{{baseUrl}}/user/validateUser?userName=free_{{$timestamp}}{{$randomInt}}&email=free{{$timestamp}}{{$randomInt}}@example.com&nic=FREE{{$timestamp}}{{$randomInt}}"
      method: GET
      params:
        - name: userName
          value: free_{{$timestamp}}{{$randomInt}}
          type: query
        - name: email
          value: free{{$timestamp}}{{$randomInt}}@example.com
          type: query
        - name: nic
          value: FREE{{$timestamp}}{{$randomInt}}
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": true
          }
  - name: 200 username taken
    description: |-
      user.controller.ts:420-422.

      Auth: collection default ({{superAdminToken}})

      Source scenario: User/Validate User/Validate User - 200 username taken.yml
    request:
      url: "{{baseUrl}}/user/validateUser?userName={{createdUserName}}&email=free{{$timestamp}}{{$randomInt}}@example.com&nic=FREE{{$timestamp}}{{$randomInt}}"
      method: GET
      params:
        - name: userName
          value: "{{createdUserName}}"
          type: query
        - name: email
          value: free{{$timestamp}}{{$randomInt}}@example.com
          type: query
        - name: nic
          value: FREE{{$timestamp}}{{$randomInt}}
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Username already exists, please try another username!",
            "data": false
          }
  - name: 200 email taken
