  - name: 200 edit mode own values
    description: |-
      With `id`, the user itself is excluded (`_id $ne id`) → own values are free (user.controller.ts:388-413).

      Auth: collection default ({{superAdminToken}})

      Source scenario: User/Validate User/Validate User - 200 edit mode own values.yml
    request:
      url: "{{baseUrl}}/user/validateUser?id={{createdUserId}}&userName={{createdUserName}}&email={{createdUserEmail}}&nic={{createdUserNic}}"
      method: GET
      params:
        - name: id
          value: "{{createdUserId}}"
          type: query
        - name: userName
          value: "{{createdUserName}}"
          type: query
