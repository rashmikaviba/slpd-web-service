info:
  name: Create User
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/user"
  body:
    type: json
    data: |-
      {
        "fullName": "Bruno Test User",
        "userName": "bru_user_{{$timestamp}}{{$randomInt}}",
        "gender": 1,
        "dateOfBirth": "1990-01-15",
        "address": "1 Test Street, Colombo",
        "phoneNumber1": "0771234567",
        "phoneNumber2": "",
        "email": "bru{{$timestamp}}{{$randomInt}}@example.com",
        "profileImageUrl": "",
        "nic": "BRU{{$timestamp}}{{$randomInt}}",
        "bankName": "Test Bank",
        "bankId": 1,
        "branch": "Colombo",
        "accountNumber": "000111222333",
        "accountHolderName": "Bruno Test User",
        "accountHolderAddress": "1 Test Street, Colombo",
        "basicSalary": 50000,
        "leaveCount": 14,
        "languages": ["English", "Sinhala"],
        "role": 3,
        "isFreelanceDriver": false
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("createdUserId", res.body.data._id);
          bru.setVar("createdUserName", res.body.data.userName);
          bru.setVar("createdUserEmail", res.body.data.email);
          bru.setVar("createdUserNic", res.body.data.nic);
        }
    - type: tests
      code: |-
        test("returns the raw saved user", function () {
          expect(res.body.data).to.have.property("_id");
          expect(res.body.data.status).to.equal(1);
          expect(res.body.data).to.not.have.property("password");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: User created successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 driver
    description: |-
      Creates a DRIVER (role 3, gender 1) with unique userName/email/nic, plus its Auth with the default password, in one
      transaction (user.controller.ts:22-152). 201 + raw User document.
      Sets `{{createdUserId}}` `{{createdUserName}}` `{{createdUserEmail}}` `{{createdUserNic}}` (shared with other modules).

      Auth: collection default ({{superAdminToken}})

      Source scenario: User/Create User/Create User - 201 driver.yml
