docs: |-
  **POST `/api/v1/user`**

  This request runs the main scenario **201 driver**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 driver | User created successfully! |
  | 2 | 201 | 201 throwaway for delete (setup) | User created successfully! |
  | 3 | 400 | 400 duplicate userName | User Name already exists! |
  | 4 | 400 | 400 duplicate email | Email already exists! |
  | 5 | 400 | 400 duplicate nic | NIC already exists! |
  | 6 | 400 | 400 [KNOWN BUG] missing userName | User Name already exists! |
  | 7 | 400 | 400 [KNOWN BUG] missing email | Email already exists! |
  | 8 | 400 | 400 [KNOWN BUG] missing nic | NIC already exists! |
  | 9 | 400 | 400 invalid role | Valid Role is required! |
  | 10 | 400 | 400 invalid gender | Valid Gender is required! |
  | 11 | 400 | 400 missing fullName | Full Name is required |
  | 12 | 400 | 400 fullName too long | Full Name cannot be more than 120 characters |
  | 13 | 400 | 400 userName too long | Username cannot be more than 50 characters |
  | 14 | 400 | 400 invalid email | not-an-email is not a valid email |
  | 15 | 400 | 400 nic too long | NIC cannot be more than 20 characters |
  | 16 | 400 | 400 missing bankId | Bank Id is required |
  | 17 | 400 | 400 non-numeric bankId | Cast to Number failed for value "abc" (type string) at path "bankId" |
  | 18 | 401 | 401 no token | Authentication invalid! |
  | 19 | 403 | 403 admin | You're unauthorized to access this resource! |
  | 20 | 404 | 404 non-numeric role | No item found with ID "abc"! |
  | 21 | 201 | 201 reset target (setup) (Auth setup) | User created successfully! |

  ## Main scenario notes

  Creates a DRIVER (role 3, gender 1) with unique userName/email/nic, plus its Auth with the default password, in one
  transaction (user.controller.ts:22-152). 201 + raw User document.
  Sets `{{createdUserId}}` `{{createdUserName}}` `{{createdUserEmail}}` `{{createdUserNic}}` (shared with other modules).
