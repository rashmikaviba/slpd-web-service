  - name: 400 blocked user
    description: |-
      Needs a user blocked via PUT /user/block/:id. Checked before the password.

      Auth: none (no Authorization header)

      Source scenario: Auth/Login/Login - 400 blocked user.yml
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "userName": "{{blockedUserName}}",
            "password": "{{blockedUserPassword}}"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "User is blocked, Please contact admin!",
            "data": null
          }
