  - name: 400 unblocked user reaches password check (User setup)
    description: |-
      Effect of the unblock: login no longer stops at the blocked check and fails on the (deliberately wrong) password instead (auth.controller.ts:36-44).

      Auth: none (no Authorization header)

      Source scenario: User/Unblock User/Login - 400 unblocked user reaches password check.yml
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "userName": "{{createdUserName}}",
            "password": "wrong-password"
