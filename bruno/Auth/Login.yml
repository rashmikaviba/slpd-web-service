  - name: 400 invalid password
    description: |-
      bcrypt compare fails.

      Auth: none (no Authorization header)

      Source scenario: Auth/Login/Login - 400 invalid password.yml
    request:
      url: "{{baseUrl}}/auth/login"
      method: POST
      body:
        type: json
        data: |-
