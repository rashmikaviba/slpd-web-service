docs: |-
  **POST `/api/v1/auth/login`**

  This request runs the main scenario **200 Super Admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 Super Admin | Login Successful! |
  | 2 | 200 | 200 Admin | Login Successful! |
  | 3 | 200 | 200 Driver | Login Successful! |
  | 4 | 200 | 200 Finance Officer | Login Successful! |
  | 5 | 200 | 200 Trip Manager | Login Successful! |
  | 6 | 200 | 200 Driver Assistant | Login Successful! |
  | 7 | 200 | 200 Trip Assistant | Login Successful! |
  | 8 | 400 | 400 invalid username | Invalid username, Please try again with correct username! |
  | 9 | 400 | 400 invalid password | Invalid password, Please try again with correct password! |
  | 10 | 400 | 400 blocked user | User is blocked, Please contact admin! |
  | 11 | 500 | 500 empty body | Illegal arguments: undefined, string |
  | 12 | 400 | 400 blocked created user (User setup) | User is blocked, Please contact admin! |
  | 13 | 400 | 400 unblocked user reaches password check (User setup) | Invalid password, Please try again with correct password! |

  ## Main scenario notes

  Logs in as role 1 (Super Admin). Stores `{{superAdminToken}}` and `{{superAdminUserId}}` runtime vars.
