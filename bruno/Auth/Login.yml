info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "userName": "{{superAdminUserName}}",
        "password": "{{superAdminPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        // Stores <role>Token and <role>UserId for whichever role logs in.
        // To log in as another role, change userName/password in the body (e.g. {{driverUserName}} / {{driverPassword}}).
        const roleKeys = {1:"superAdmin",2:"admin",3:"driver",4:"financeOfficer",5:"tripManager",6:"driverAssistant",7:"tripAssistant"};
        if (res.status === 200) {
          const key = roleKeys[res.body.data.role];
          bru.setVar(key + "Token", res.body.data.token.replace(/^Bearer /, ""));
          bru.setVar(key + "UserId", res.body.data.user._id);
        }
    - type: tests
      code: |-
        test("token is a Bearer JWT", function () {
          expect(res.body.data.token).to.match(/^Bearer [\w-]+\.[\w-]+\.[\w-]+$/);
        });
        test("menu modules match moduleIds", function () {
          expect(res.body.data.moduleIds).to.eql(res.body.data.modules.map((m) => m.id));
        });
        test("working period returned", function () {
          expect(res.body.data).to.have.property("workingMonth");
          expect(res.body.data).to.have.property("workingYear");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Login Successful!
    - expression: res.body.data.role
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

