info:
  name: Reset Password
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/auth/resetPassword/{{createdUserId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: User password reset successfully as default password!
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 created user
    description: |-
      [DESTRUCTIVE] Resets `{{createdUserId}}` to the default password (auth.controller.ts:97-119). SUPERADMIN token.
      Existing tokens of that user stay valid (Document/auth.md › Known issues #3).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Auth/Reset Password/Reset Password - 200 created user.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{createdUserId}}"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "User password reset successfully as default password!",
            "data": null
          }
  - name: 400 user not found
    description: |-
      No ACTIVE Auth for that user id → `BadRequestError` (auth.controller.ts:101-103). Note: 400, not 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Auth/Reset Password/Reset Password - 400 user not found.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{nonExistingId}}"
      method: PUT
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "User not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. auth.router.ts:16-20.

      Auth: none (no Authorization header)

      Source scenario: Auth/Reset Password/Reset Password - 401 no token.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{createdUserId}}"
      method: PUT
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 driver
    description: |-
      Route allows SUPERADMIN only; `{{driverToken}}` is rejected by auth.middleware.ts:73-77. auth.router.ts:16-20.

      Auth: bearer {{driverToken}}

      Source scenario: Auth/Reset Password/Reset Password - 403 driver.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{createdUserId}}"
      method: PUT
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 403 admin
    description: |-
      Route allows SUPERADMIN only; `{{adminToken}}` is rejected by auth.middleware.ts:73-77. auth.router.ts:16-20.

      Auth: bearer {{adminToken}}

      Source scenario: Auth/Reset Password/Reset Password - 403 admin.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{createdUserId}}"
      method: PUT
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `Auth.findOne({ user: "not-an-object-id" })` → Mongoose CastError → error.middleware.ts:56-60 → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Auth/Reset Password/Reset Password - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/auth/resetPassword/{{invalidId}}"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **PUT `/api/v1/auth/resetPassword/:id`**

  This request runs the main scenario **200 created user**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 created user | User password reset successfully as default password! |
  | 2 | 400 | 400 user not found | User not found! |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 403 | 403 driver | You're unauthorized to access this resource! |
  | 5 | 403 | 403 admin | You're unauthorized to access this resource! |
  | 6 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [DESTRUCTIVE] Resets `{{createdUserId}}` to the default password (auth.controller.ts:97-119). SUPERADMIN token.
  Existing tokens of that user stay valid (Document/auth.md › Known issues #3).
