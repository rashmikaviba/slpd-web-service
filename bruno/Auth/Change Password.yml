info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/auth/changePassword"
  body:
    type: json
    data: |-
      {
        "oldPassword": "{{financeOfficerPassword}}",
        "newPassword": "{{tempPassword}}"
      }
  auth:
    type: bearer
    token: "{{financeOfficerToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // random throwaway password, only kept as a runtime var until seq 2 restores the original
        bru.setVar("tempPassword", "Tmp-" + Date.now() + "-" + Math.floor(Math.random() * 1e6));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Password changed successfully!
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 to temporary password
    description: |-
      [DESTRUCTIVE] Changes the Finance Officer password to `{{tempPassword}}` (auth.controller.ts:121-152).
      After running it, send the body of the **200 restore original password** example to change it back.

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Auth/Change Password/Change Password - 200 to temporary password.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "{{financeOfficerPassword}}",
            "newPassword": "{{tempPassword}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Password changed successfully!",
            "data": null
          }
  - name: 200 restore original password
    description: |-
      Restores `{{financeOfficerPassword}}`. Also proves seq 1 really changed the hash (old = temp password matched).

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Auth/Change Password/Change Password - 200 restore original password.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "{{tempPassword}}",
            "newPassword": "{{financeOfficerPassword}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Password changed successfully!",
            "data": null
          }
  - name: 400 wrong old password
    description: |-
      bcrypt compare fails → `BadRequestError` (auth.controller.ts:129-137). Password unchanged.

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Auth/Change Password/Change Password - 400 wrong old password.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "wrong-password",
            "newPassword": "never-applied"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Invalid old password, Please try again with correct password!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. auth.router.ts:22-26.

      Auth: none (no Authorization header)

      Source scenario: Auth/Change Password/Change Password - 401 no token.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "x",
            "newPassword": "y"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 500 [KNOWN BUG] empty body
    description: |-
      [KNOWN BUG] No validation: `bcrypt.compare(undefined, hash)` throws → 500 (auth.controller.ts:129-132).
      Should be a 400 Joi error. Password unchanged.

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Auth/Change Password/Change Password - 500 [KNOWN BUG] empty body.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: "{}"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Illegal arguments: undefined, string",
            "data": null
          }
  - name: 500 [KNOWN BUG] missing newPassword
    description: |-
      [KNOWN BUG] Old password matches, then `bcrypt.hash(undefined, salt)` throws → 500 (auth.controller.ts:139,
      util/passwordHash.util.ts:6). Fails before save, so the password is unchanged. No new-password rules exist
      (Document/auth.md › Known issues #4).

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Auth/Change Password/Change Password - 500 [KNOWN BUG] missing newPassword.yml
    request:
      url: "{{baseUrl}}/auth/changePassword"
      method: PUT
      body:
        type: json
        data: |-
          {
            "oldPassword": "{{financeOfficerPassword}}"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Illegal arguments: undefined, string",
            "data": null
          }

docs: |-
  **PUT `/api/v1/auth/changePassword`**

  This request runs the main scenario **200 to temporary password**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 to temporary password | Password changed successfully! |
  | 2 | 200 | 200 restore original password | Password changed successfully! |
  | 3 | 400 | 400 wrong old password | Invalid old password, Please try again with correct password! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 500 | 500 [KNOWN BUG] empty body | Illegal arguments: undefined, string |
  | 6 | 500 | 500 [KNOWN BUG] missing newPassword | Illegal arguments: undefined, string |

  ## Main scenario notes

  [DESTRUCTIVE] Changes the Finance Officer password to `{{tempPassword}}` (auth.controller.ts:121-152).
  After running it, send the body of the **200 restore original password** example to change it back.
