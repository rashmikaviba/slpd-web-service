info:
  name: Get Roles
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/common/role"

runtime:
  scripts:
    - type: tests
      code: |-
        test("array of active roles", function () {
          expect(res.body.data).to.be.an("array");
          res.body.data.forEach((r) => expect(r.status).to.equal(1));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 public
    description: |-
      Public (common.route.ts:16). `roleService.findAllByStatusIn([ACTIVE])`, cached `role-[1]` (common.controller.ts:19).
      [KNOWN ISSUE] unauthenticated endpoint (Document/common.md › Known issues #6).

      Auth: none (no Authorization header)

      Source scenario: Common/Get Roles - 200 public.yml
    request:
      url: "{{baseUrl}}/common/role"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
