info:
  name: Get Measure Units
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/common/measureUnits"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("3 categories with their units", function () {
          expect(res.body.data.map((c) => c.categoryId)).to.eql([1, 2, 3]);
          expect(res.body.data.map((c) => c.items.length)).to.eql([10, 4, 3]);
        });
        test("items belong to their category", function () {
          res.body.data.forEach((c) => c.items.forEach((u) => expect(u.categoryId).to.equal(c.categoryId)));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
