info:
  name: Get Common Data
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/common/data?type=VehicleTypes"
  params:
    - name: type
      value: VehicleTypes
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("vehicle types list", function () {
          expect(res.body.data).to.eql([
            { id: 1, name: "Car" },
            { id: 2, name: "Van" },
            { id: 3, name: "Bus" },
            { id: 4, name: "SUV" }
          ]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 VehicleTypes
    description: |-
      Any authenticated role. `type=VehicleTypes` → `vehicleTypes` from util/data/commonData.ts (common.controller.ts:25-36).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Common/Get Common Data - 200 VehicleTypes.yml
    request:
      url: "{{baseUrl}}/common/data?type=VehicleTypes"
      method: GET
      params:
        - name: type
          value: VehicleTypes
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": [
              {
                "id": 1,
                "name": "Car"
              },
              {
                "id": 2,
                "name": "Van"
              },
              {
                "id": 3,
                "name": "Bus"
              },
              {
                "id": 4,
                "name": "SUV"
              }
            ]
          }
  - name: 200 unknown type returns empty
    description: |-
      Only `VehicleTypes` is recognised; any other value falls through the switch → `[]`, still 200 (common.controller.ts:29-35).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Common/Get Common Data - 200 unknown type returns empty.yml
    request:
      url: "{{baseUrl}}/common/data?type=Unknown"
      method: GET
      params:
        - name: type
          value: Unknown
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": []
          }
  - name: 200 missing type returns empty
    description: |-
      No `type` query → `[]`, 200 (common.controller.ts:25-36). No validation.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Common/Get Common Data - 200 missing type returns empty.yml
    request:
      url: "{{baseUrl}}/common/data"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": []
          }
  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. common.route.ts:18-22.

      Auth: none (no Authorization header)

      Source scenario: Common/Get Common Data - 401 no token.yml
    request:
      url: "{{baseUrl}}/common/data?type=VehicleTypes"
      method: GET
      params:
        - name: type
          value: VehicleTypes
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }

docs: |-
  **GET `/api/v1/common/data`**

  This request runs the main scenario **200 VehicleTypes**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 VehicleTypes | (empty) |
  | 2 | 200 | 200 unknown type returns empty | (empty) |
  | 3 | 200 | 200 missing type returns empty | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |

  ## Main scenario notes

  Any authenticated role. `type=VehicleTypes` → `vehicleTypes` from util/data/commonData.ts (common.controller.ts:25-36).
