docs: |-
  **GET `/api/v1/notification`**

  This request runs the main scenario **200 Super Admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 Super Admin | (empty) |
  | 2 | 200 | 200 Admin | (empty) |
  | 3 | 200 | 200 Finance Officer | (empty) |
  | 4 | 200 | 200 Trip Manager | (empty) |
  | 5 | 200 | 200 Driver empty | (empty) |
  | 6 | 200 | 200 Driver Assistant empty | (empty) |
  | 7 | 200 | 200 Trip Assistant empty | (empty) |
  | 8 | 401 | 401 no token | Authentication invalid! |
  | 9 | 200 | Find Expense Request Id - 200 via notifications (Expense Request setup) | (empty) |
  | 10 | 200 | Find Expense Request Id - 200 second request (Expense Request setup) | (empty) |

  ## Main scenario notes

  Role 1 (Super Admin) gets all 4 collectors concatenated (types 1-5), sorted by `createdAt` desc
  (notification.controller.ts:13-38, sort :48). Tests check every item field-by-field per type
  (notification.util.ts:7/35/73/91) and that the setup vehicle (seq 1) shows up as types 2 and 3.
  Preconditions: seq 1 ran. Other types appear only if pending expense requests / trips / leaves exist.
