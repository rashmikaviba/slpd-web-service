info:
  name: Get All Notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/notification"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body.data;
        const base = ["_id", "type", "typeName", "description", "createdAt"];
        const extra = {
          1: ["tripId", "requestedAmount", "requestedUserId", "requestedUserName", "tripConfirmedNumber"],
          2: ["vehicleName", "expiryDate"],
          3: ["vehicleName", "expiryDate"],
          4: ["tripConfirmedNumber", "startDate"],
          5: ["appliedBy", "startDate"],
        };
        const names = {
          1: "Expense Extension Request",
          2: "Insurance Renewal",
          3: "License Renewal",
          4: "Driver and Vehicle assign",
          5: "Approve or Reject Leave",
        };
        test("data is an array", function () {
          expect(data).to.be.an("array");
        });
        test("every item has exactly the fields of its type", function () {
          data.forEach((n) => {
            expect([1, 2, 3, 4, 5]).to.include(n.type);
            expect(n).to.have.all.keys(base.concat(extra[n.type]));
            expect(n.typeName).to.equal(names[n.type]);
            expect(n.description).to.be.a("string");
            expect(new Date(n.createdAt).toString()).to.not.equal("Invalid Date");
          });
        });
        test("type 1 field types", function () {
          data.filter((n) => n.type === 1).forEach((n) => {
            expect(n.requestedAmount).to.be.a("number");
            expect(n.requestedUserName).to.be.a("string");
          });
        });
        test("types 2-5 have empty description", function () {
          data.filter((n) => n.type !== 1).forEach((n) => expect(n.description).to.equal(""));
        });
        test("sorted newest first by createdAt", function () {
          for (let i = 1; i < data.length; i++) {
            expect(new Date(data[i - 1].createdAt).getTime()).to.be.at.least(new Date(data[i].createdAt).getTime());
          }
        });
        test("setup vehicle listed as insurance (2) and licence (3) renewal", function () {
          const mine = data.filter((n) => n._id === bru.getVar("notifVehicleId"));
          expect(mine.map((n) => n.type).sort()).to.eql([2, 3]);
          mine.forEach((n) => expect(n.vehicleName).to.equal(bru.getVar("notifVehicleRegNo")));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

