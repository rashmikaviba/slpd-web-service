info:
  name: Create Internal Trip
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/internalTrip/"
  body:
    type: json
    data: |-
      {
        "startDate": "2090-01-10T00:00:00.000Z",
        "endDate": "2090-01-12T00:00:00.000Z",
        "dateCount": 3,
        "vehicle": "{{internalTripVehicleId}}",
        "meterReading": 1100,
        "driver": "{{driverUserId}}",
        "reason": "Bruno internal trip"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200 || res.status === 201) bru.setVar("internalTripId", res.body.data._id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Internal trip created successfully!
    - expression: res.body.data.calcDistance
      operator: eq
      value: "100"
    - expression: res.body.data.meterReading
      operator: eq
      value: "1100"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 with meterReading
    description: |-
      Precondition: Setup ran (vehicle mileage 1000). meterReading 1100 → calcDistance 100, vehicle mileage → 1100 in the same transaction (internalTrip.controller.ts:14-100).
      Stores `{{internalTripId}}`.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Create Internal Trip/Create Internal Trip - 201 with meterReading.yml
    request:
      url: "{{baseUrl}}/internalTrip/"
      method: POST
      body:
        type: json
        data: |-
          {
            "startDate": "2090-01-10T00:00:00.000Z",
            "endDate": "2090-01-12T00:00:00.000Z",
            "dateCount": 3,
            "vehicle": "{{internalTripVehicleId}}",
            "meterReading": 1100,
            "driver": "{{driverUserId}}",
            "reason": "Bruno internal trip"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Internal trip created successfully!",
            "data": {
              "startDate": "2090-01-10T00:00:00.000Z",
              "endDate": "2090-01-12T00:00:00.000Z",
              "dateCount": 3,
              "vehicle": "6651a1b2c3d4e5f6a7b8c9d3",
              "meterReading": 1100,
              "calcDistance": 100,
              "driver": "6650a1b2c3d4e5f6a7b8c9d1",
              "isMonthEndDone": false,
              "reason": "Bruno internal trip",
              "status": 1,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "_id": "6654a1b2c3d4e5f6a7b8c9d0",
              "createdAt": "2026-11-18T08:46:00.000Z",
              "updatedAt": "2026-11-18T08:46:00.000Z"
            }
          }
