docs: |-
  **POST `/api/v1/internalTrip`**

  This request runs the main scenario **201 with meterReading**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 with meterReading | Internal trip created successfully! |
  | 2 | 201 | 201 without meterReading | Internal trip created successfully! |
  | 3 | 201 | 201 non-existent vehicle accepted | Internal trip created successfully! |
  | 4 | 400 | 400 missing startDate | Start Date is required! |
  | 5 | 400 | 400 invalid startDate | Start Date is invalid! |
  | 6 | 400 | 400 missing endDate | End Date is required |
  | 7 | 400 | 400 invalid endDate | End Date is invalid |
  | 8 | 400 | 400 missing dateCount | Date Count is required |
  | 9 | 400 | 400 invalid dateCount | Date Count is invalid |
  | 10 | 400 | 400 dateCount less than 1 | Date Count cannot be less than 1 |
  | 11 | 400 | 400 missing vehicle | Vehicle is required |
  | 12 | 400 | 400 invalid vehicle | Vehicle is invalid |
  | 13 | 400 | 400 invalid meterReading | Meter Reading is invalid |
  | 14 | 400 | 400 missing driver | Driver is required |
  | 15 | 400 | 400 invalid driver | Driver is invalid |
  | 16 | 400 | 400 missing reason | Reason is required |
  | 17 | 400 | 400 empty reason | "reason" is not allowed to be empty |
  | 18 | 400 | 400 reason too long | Reason cannot be more than 500 characters |
  | 19 | 400 | 400 overlapping date range | Vehicle already has internal trip or an other trip for this date range! |
  | 20 | 400 | 400 vehicle not found | Vehicle not found! |
  | 21 | 400 | 400 meterReading not above current mileage | Vehicle current mileage is greater than meter reading! |
  | 22 | 400 | 400 driver invalid id | Cast to ObjectId failed for value "not-an-object-id" (type string) at path "driver" because of "BSONError" |
  | 23 | 401 | 401 no token | Authentication invalid! |
  | 24 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 25 | 404 | 404 vehicle invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Precondition: Setup ran (vehicle mileage 1000). meterReading 1100 → calcDistance 100, vehicle mileage → 1100 in the same transaction (internalTrip.controller.ts:14-100).
  Stores `{{internalTripId}}`.
