  - name: 400 meterReading not above current mileage
    description: |-
      Precondition: vehicle mileage is 1100 after `201 with meterReading`. 900 <= 1100 → error, transaction aborted (internalTrip.controller.ts:63-67).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Create Internal Trip/Create Internal Trip - 400 meterReading not above current mileage.yml
    request:
      url: "{{baseUrl}}/internalTrip/"
      method: POST
      body:
        type: json
        data: |-
