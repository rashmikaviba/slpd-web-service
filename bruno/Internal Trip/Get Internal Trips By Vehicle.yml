  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Internal Trip/Get Internal Trips By Vehicle/Get Internal Trips By Vehicle - 401 no token.yml
    request:
      url: "{{baseUrl}}/internalTrip/getByVehicle/{{internalTripVehicleId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 driver role
    description: |-
      internalTrip.route.ts:59-68.

      Auth: bearer {{driverToken}}

      Source scenario: Internal Trip/Get Internal Trips By Vehicle/Get Internal Trips By Vehicle - 403 driver role.yml
    request:
      url: "{{baseUrl}}/internalTrip/getByVehicle/{{internalTripVehicleId}}"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed vehicle id → CastError in find → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Get Internal Trips By Vehicle/Get Internal Trips By Vehicle - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/internalTrip/getByVehicle/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/internalTrip/getByVehicle/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 401 | 401 no token | Authentication invalid! |
  | 3 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 4 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  ACTIVE internal trips of the setup vehicle (the two created above), sorted by startDate desc (internalTrip.controller.ts:263-278).
