info:
  name: Get Internal Trips By Vehicle
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/internalTrip/getByVehicle/{{internalTripVehicleId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("driver mapped to full name", function () {
          expect(res.body.data[0].driver).to.be.a("string");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.data
      operator: length
      value: "2"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      ACTIVE internal trips of the setup vehicle (the two created above), sorted by startDate desc (internalTrip.controller.ts:263-278).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Get Internal Trips By Vehicle/Get Internal Trips By Vehicle - 200.yml
    request:
      url: "{{baseUrl}}/internalTrip/getByVehicle/{{internalTripVehicleId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
