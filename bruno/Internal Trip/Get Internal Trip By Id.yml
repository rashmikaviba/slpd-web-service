  - name: 403 driver role
    description: |-
      internalTrip.route.ts:26-35.

      Auth: bearer {{driverToken}}

      Source scenario: Internal Trip/Get Internal Trip By Id/Get Internal Trip By Id - 403 driver role.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripId}}"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → CastError → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Get Internal Trip By Id/Get Internal Trip By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
