info:
  name: Delete Internal Trip
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/internalTrip/{{internalTripId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Internal trip Deleted successfully!
    - expression: res.body.data.status
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      [DESTRUCTIVE] Soft-deletes `{{internalTripId}}` and subtracts its calcDistance (100) from the setup vehicle mileage (internalTrip.controller.ts:206-261).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 200.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripId}}"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Internal trip Deleted successfully!",
            "data": {
              "_id": "6654a1b2c3d4e5f6a7b8c9d0",
              "startDate": "2090-01-10T00:00:00.000Z",
              "endDate": "2090-01-12T00:00:00.000Z",
              "dateCount": 3,
              "vehicle": "6651a1b2c3d4e5f6a7b8c9d3",
              "meterReading": 1100,
              "calcDistance": 100,
              "driver": "6650a1b2c3d4e5f6a7b8c9d1",
              "isMonthEndDone": false,
              "reason": "Updated by Bruno",
              "status": 3,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "createdAt": "2026-11-18T08:46:00.000Z",
              "updatedAt": "2026-11-18T08:48:00.000Z"
            }
          }
  - name: 400 already deleted
    description: |-
      Precondition: previous request. Only ACTIVE trips are found (internalTrip.controller.ts:210-217).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 400 already deleted.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Internal trip not found!",
            "data": null
          }
  - name: 400 vehicle not found
    description: |-
      Precondition: `{{internalTripOrphanId}}` (trip on a non-existent vehicle). Vehicle is loaded even when calcDistance is 0 (internalTrip.controller.ts:219-226).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 400 vehicle not found.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripOrphanId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Vehicle not found!",
            "data": null
          }
  - name: 400 not found
    description: |-
      internalTrip.controller.ts:210-217.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 400 not found.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{nonExistingId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Internal trip not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 401 no token.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripNoMeterId}}"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 driver role
    description: |-
      internalTrip.route.ts:48-57.

      Auth: bearer {{driverToken}}

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 403 driver role.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{internalTripNoMeterId}}"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → CastError → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Internal Trip/Delete Internal Trip/Delete Internal Trip - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/internalTrip/{{invalidId}}"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **DELETE `/api/v1/internalTrip/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Internal trip Deleted successfully! |
  | 2 | 400 | 400 already deleted | Internal trip not found! |
  | 3 | 400 | 400 vehicle not found | Vehicle not found! |
  | 4 | 400 | 400 not found | Internal trip not found! |
  | 5 | 401 | 401 no token | Authentication invalid! |
  | 6 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 7 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [DESTRUCTIVE] Soft-deletes `{{internalTripId}}` and subtracts its calcDistance (100) from the setup vehicle mileage (internalTrip.controller.ts:206-261).
