    description: |-
      FINANCEOFFICER is not in [SUPERADMIN, ADMIN] (dashboard.route.ts:10). auth.middleware.ts:68-79 — role not in the route's roles array → ForbiddenError.

      Auth: bearer {{financeOfficerToken}}

      Source scenario: Dashboard/Inventory Summary - 403 Finance Officer.yml
    request:
      url: "{{baseUrl}}/dashboard/inventorySummary"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }

docs: |-
  **GET `/api/v1/dashboard/inventorySummary`**

  This request runs the main scenario **200 Super Admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 Super Admin | (empty) |
  | 2 | 200 | 200 Admin | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 403 | 403 Finance Officer | You're unauthorized to access this resource! |

  ## Main scenario notes

  ACTIVE products mapped to `{_id, productName, productShortCode, measureUnitDetails, inventory}` with inventory
  converted from SI to the product unit, sorted ascending (dashboard.controller.ts:20-31, dashboard.util.ts:4).
  `measureUnitDetails` is omitted when the product's unit id is not in measureUnitData. Empty array if no products.
