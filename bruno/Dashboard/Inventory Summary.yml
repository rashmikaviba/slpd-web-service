  - name: 401 no token
    description: |-
      auth.middleware.ts:25-26 — no `Authorization: Bearer` header → UnauthorizedError.

      Auth: none (no Authorization header)

      Source scenario: Dashboard/Inventory Summary - 401 no token.yml
    request:
      url: "{{baseUrl}}/dashboard/inventorySummary"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
