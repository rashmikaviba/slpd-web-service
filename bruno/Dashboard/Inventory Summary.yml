info:
  name: Inventory Summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/dashboard/inventorySummary"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.body.data;
        test("every row has the summary fields", function () {
          data.forEach((p) => {
            expect(p).to.include.all.keys("_id", "productName", "productShortCode", "inventory");
            expect(Object.keys(p).filter((k) => !["_id", "productName", "productShortCode", "measureUnitDetails", "inventory"].includes(k))).to.eql([]);
            expect(p.inventory).to.be.a("number");
            if (p.measureUnitDetails !== undefined) {
              expect(p.measureUnitDetails).to.include.all.keys("unitId", "code", "name", "isSaveWithSiUnit", "isSiUnit", "isAllowDecimal", "categoryId", "conversionToSi");
            }
          });
        });
        test("sorted by inventory ascending (lowest stock first)", function () {
          for (let i = 1; i < data.length; i++) expect(data[i - 1].inventory).to.be.at.most(data[i].inventory);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Super Admin
    description: |-
      ACTIVE products mapped to `{_id, productName, productShortCode, measureUnitDetails, inventory}` with inventory
      converted from SI to the product unit, sorted ascending (dashboard.controller.ts:20-31, dashboard.util.ts:4).
      `measureUnitDetails` is omitted when the product's unit id is not in measureUnitData. Empty array if no products.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Dashboard/Inventory Summary - 200 Super Admin.yml
    request:
      url: "{{baseUrl}}/dashboard/inventorySummary"
      method: GET
    response:
