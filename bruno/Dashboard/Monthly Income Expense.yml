docs: |-
  **GET `/api/v1/dashboard/monthlyIncomeExpense`**

  This request runs the main scenario **200 current year**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 current year | (empty) |
  | 2 | 200 | 200 past year | (empty) |
  | 3 | 200 | 200 future year all zeros | (empty) |
  | 4 | 200 | 200 empty year treated as 1900 | (empty) |
  | 5 | 401 | 401 no token | Authentication invalid! |
  | 6 | 403 | 403 Trip Manager | You're unauthorized to access this resource! |
  | 7 | 500 | 500 missing year | Error fetching dashboard data |
  | 8 | 500 | 500 invalid year | Error fetching dashboard data |

  ## Main scenario notes

  Current year → months 1..current month computed, later months stay 0 (dashboard.controller.ts:226-301).
  Closed months (before CompanyWorkingInfo.workingDate) are cached for a year under `monthlyIncomeExpense_<y>_<m>`.
