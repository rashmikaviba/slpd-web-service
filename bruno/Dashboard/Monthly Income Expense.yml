info:
  name: Monthly Income Expense
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/dashboard/monthlyIncomeExpense?year={{dashYear}}"
  params:
    - name: year
      value: "{{dashYear}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("dashYear", String(new Date().getFullYear()));
    - type: tests
      code: |-
        const data = res.body.data;
        const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        test("12 entries January..December with exact fields", function () {
          expect(data).to.have.length(12);
          data.forEach((m, i) => {
            expect(m).to.have.all.keys("monthIndex", "month", "income", "expenses");
            expect(m.monthIndex).to.equal(i + 1);
            expect(m.month).to.equal(months[i]);
            expect(m.income).to.be.a("number");
            expect(m.expenses).to.be.a("number");
          });
        });

        test("months after the current month are not computed (0)", function () {
          const cur = new Date().getMonth() + 1;
          data.filter((m) => m.monthIndex > cur).forEach((m) => {
            expect(m.income).to.equal(0);
            expect(m.expenses).to.equal(0);
          });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

