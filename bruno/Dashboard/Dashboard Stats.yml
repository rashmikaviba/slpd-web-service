info:
  name: Dashboard Stats
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/dashboard/getDashboardstats?startDate={{dashStartDate}}&endDate={{dashEndDate}}"
  params:
    - name: startDate
      value: "{{dashStartDate}}"
      type: query
    - name: endDate
      value: "{{dashEndDate}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        bru.setVar("dashStartDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-01`);
        bru.setVar("dashEndDate", `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(last)}`);
    - type: tests
      code: |-
        test("exactly finishedTripsCount, totalIncome, totalExpenses (numbers)", function () {
          expect(res.body.data).to.have.all.keys("finishedTripsCount", "totalIncome", "totalExpenses");
          expect(res.body.data.finishedTripsCount).to.be.a("number");
          expect(res.body.data.totalIncome).to.be.a("number");
          expect(res.body.data.totalExpenses).to.be.a("number");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 current month
    description: |-
      KPI tiles for the current calendar month: FINISHED trips by endDate, Σ totalCostLocalCurrency, and
      trip expenses + driver salaries + monthly expenses + company-borne maintenance (dashboard.controller.ts:33-58, :141, :157).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Dashboard/Dashboard Stats - 200 current month.yml
    request:
      url: "{{baseUrl}}/dashboard/getDashboardstats?startDate={{dashStartDate}}&endDate={{dashEndDate}}"
      method: GET
      params:
        - name: startDate
          value: "{{dashStartDate}}"
          type: query
        - name: endDate
          value: "{{dashEndDate}}"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "finishedTripsCount": 1,
              "totalIncome": 375000,
              "totalExpenses": 115950
            }
          }
  - name: 200 Admin
    description: |-
      Same as Super Admin; ADMIN is allowed (dashboard.route.ts:14).

      Auth: bearer {{adminToken}}

      Source scenario: Dashboard/Dashboard Stats - 200 Admin.yml
