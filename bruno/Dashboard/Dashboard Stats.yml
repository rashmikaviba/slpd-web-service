docs: |-
  **GET `/api/v1/dashboard/getDashboardstats`**

  This request runs the main scenario **200 current month**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 current month | (empty) |
  | 2 | 200 | 200 Admin | (empty) |
  | 3 | 200 | 200 start after end returns zeros | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 403 | 403 Driver | You're unauthorized to access this resource! |
  | 6 | 500 | 500 missing startDate | Error fetching dashboard data |
  | 7 | 500 | 500 missing endDate | Error fetching dashboard data |
  | 8 | 500 | 500 missing both dates | Error fetching dashboard data |
  | 9 | 500 | 500 invalid startDate | Error fetching dashboard data |
  | 10 | 500 | 500 invalid endDate | Error fetching dashboard data |

  ## Main scenario notes

  KPI tiles for the current calendar month: FINISHED trips by endDate, Σ totalCostLocalCurrency, and
  trip expenses + driver salaries + monthly expenses + company-borne maintenance (dashboard.controller.ts:33-58, :141, :157).
