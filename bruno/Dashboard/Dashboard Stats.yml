  - name: 200 start after end returns zeros
    description: |-
      [KNOWN BUG] No date-order validation: startDate > endDate is accepted and every range query is empty, so the
      handler returns 200 with zeros instead of a 400 (dashboard.controller.ts:33-58, dashboard.md › Known issues 5).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Dashboard/Dashboard Stats - 200 start after end returns zeros.yml
    request:
