docs: |-
  **POST `/api/v1/monthlyExpenses/advanceSearch`**

  This request runs the main scenario **200 setup**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 setup | (empty) |
  | 2 | 400 | 400 missing startMonth | Start Date is required! |
  | 3 | 400 | 400 invalid startMonth | Start Date is invalid! |
  | 4 | 400 | 400 missing endMonth | End Date is required |
  | 5 | 400 | 400 invalid endMonth | End Date is invalid |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 403 | 403 driver role | You're unauthorized to access this resource! |

  ## Main scenario notes

  Header summaries (no lines) for every month in range, sorted by month desc (monthlyExpenses.controller.ts:225-251). No status filter (known issue).
  Setup: stores `{{monthlyExpensesId}}` + `{{monthlyExpensesMonth}}` (open header) and `{{closedMonthlyExpensesId}}` (closed header, if one exists).
