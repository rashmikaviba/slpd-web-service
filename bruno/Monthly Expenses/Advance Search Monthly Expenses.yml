info:
  name: Advance Search Monthly Expenses
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/monthlyExpenses/advanceSearch"
  body:
    type: json
    data: |-
      {
        "startMonth": "2000-01-01",
        "endMonth": "2100-12-31"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          const list = res.body.data || [];
          const open = list.find((x) => x.isMonthEndDone === false && x.status !== 3);
          const closed = list.find((x) => x.isMonthEndDone === true && x.status !== 3);
          if (open) {
            bru.setVar("monthlyExpensesId", open._id);
            bru.setVar("monthlyExpensesMonth", open.month);
          }
          if (closed) bru.setVar("closedMonthlyExpensesId", closed._id);
        }
    - type: tests
      code: |-
        test("an open monthly expense header exists", function () {
          expect(res.body.data.some((x) => x.isMonthEndDone === false)).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 setup
    description: |-
      Header summaries (no lines) for every month in range, sorted by month desc (monthlyExpenses.controller.ts:225-251). No status filter (known issue).
      Setup: stores `{{monthlyExpensesId}}` + `{{monthlyExpensesMonth}}` (open header) and `{{closedMonthlyExpensesId}}` (closed header, if one exists).

      Auth: collection default ({{superAdminToken}})

