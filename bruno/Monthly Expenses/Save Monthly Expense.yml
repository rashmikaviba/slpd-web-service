docs: |-
  **POST `/api/v1/monthlyExpenses/save/:id`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Monthly expense saved successfully! |
  | 2 | 201 | 201 second line for delete | Monthly expense saved successfully! |
  | 3 | 400 | 400 missing expenseType | Expense type is required |
  | 4 | 400 | 400 invalid expenseType | Expense type is invalid |
  | 5 | 400 | 400 missing date | Date is required |
  | 6 | 400 | 400 invalid date | Date is invalid |
  | 7 | 400 | 400 missing expenseTypeName | Expense type name is required |
  | 8 | 400 | 400 invalid expenseTypeName | Expense type name is invalid |
  | 9 | 400 | 400 missing description | Description is required |
  | 10 | 400 | 400 invalid description | Description is invalid |
  | 11 | 400 | 400 missing amount | Amount is required |
  | 12 | 400 | 400 invalid amount | Amount is invalid |
  | 13 | 400 | 400 description too long | Description cannot exceed 500 characters |
  | 14 | 400 | 400 month end done | Cannot update monthly expense after month end! |
  | 15 | 401 | 401 no token | Authentication invalid! |
  | 16 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 17 | 404 | 404 monthly expense not found | Monthly expense not found! |
  | 18 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Precondition: Advance Search setup found an open header. Pushes a line, recomputes totalExpenses in a transaction (monthlyExpenses.controller.ts:14-89).
  Stores the new line `_id` as `{{monthlyExpenseLineId}}`.
