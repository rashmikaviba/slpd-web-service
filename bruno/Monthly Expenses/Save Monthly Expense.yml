info:
  name: Save Monthly Expense
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/monthlyExpenses/save/{{monthlyExpensesId}}"
  body:
    type: json
    data: |-
      {
        "expenseType": 1,
        "expenseTypeName": "Electricity",
        "date": "{{monthlyExpensesMonth}}",
        "description": "Bruno monthly expense",
        "amount": 2500
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 || res.status === 201) {
          const lines = res.body.data.expenses;
          bru.setVar("monthlyExpenseLineId", lines[lines.length - 1]._id);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Monthly expense saved successfully!
    - expression: res.body.data._id
      operator: eq
      value: '"{{monthlyExpensesId}}"'
    - expression: res.body.data.totalExpenses
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      Precondition: Advance Search setup found an open header. Pushes a line, recomputes totalExpenses in a transaction (monthlyExpenses.controller.ts:14-89).
      Stores the new line `_id` as `{{monthlyExpenseLineId}}`.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Monthly Expenses/Save Monthly Expense/Save Monthly Expense - 201.yml
    request:
      url: "{{baseUrl}}/monthlyExpenses/save/{{monthlyExpensesId}}"
      method: POST
      body:
        type: json
        data: |-
          {
            "expenseType": 1,
            "expenseTypeName": "Electricity",
            "date": "{{monthlyExpensesMonth}}",
            "description": "Bruno monthly expense",
            "amount": 2500
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
