info:
  name: Update Monthly Expense
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/monthlyExpenses/update/{{monthlyExpensesId}}/expense/{{monthlyExpenseLineToDeleteId}}"
  body:
    type: json
    data: |-
      {
        "expenseType": 2,
        "expenseTypeName": "Water",
        "date": "{{monthlyExpensesMonth}}",
        "description": "Edited after delete",
        "amount": 999
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deleted line edited, still status 3", function () {
          const l = res.body.data.expenses.find((e) => e._id === bru.getVar("monthlyExpenseLineToDeleteId"));
          expect(l.status).to.equal(3);
          expect(l.amount).to.equal(999);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Expense updated successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

