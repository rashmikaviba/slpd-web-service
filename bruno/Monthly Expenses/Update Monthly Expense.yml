docs: |-
  **PUT `/api/v1/monthlyExpenses/update/:id/expense/:expenseId`**

  This request runs the main scenario **201 deleted line can be edited**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Expense updated successfully! |
  | 2 | 201 | 201 deleted line can be edited | Expense updated successfully! |
  | 3 | 400 | 400 missing amount | Amount is required |
  | 4 | 400 | 400 month end done | Cannot update monthly expense after month end! |
  | 5 | 401 | 401 no token | Authentication invalid! |
  | 6 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 7 | 404 | 404 monthly expense not found | Monthly expense not found! |
  | 8 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |
  | 9 | 404 | 404 expense line not found | Expense not found in this monthly expense! |

  ## Main scenario notes

  [KNOWN BUG] Update does not check the line status: a DELETED line is edited (monthlyExpenses.controller.ts:122-134). Also 201 instead of 200.
  Precondition: line deleted above.
