info:
  name: Get Monthly Expense By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/monthlyExpenses/{{monthlyExpensesId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("contains saved line", function () {
          expect(res.body.data.expenses.map((e) => e._id)).to.include(bru.getVar("monthlyExpenseLineId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data._id
      operator: eq
      value: '"{{monthlyExpensesId}}"'
    - expression: res.body.data.expenses
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
