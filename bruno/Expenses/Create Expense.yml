            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Cannot add new expense after trip finished!",
            "data": null
          }
  - name: 400 after month end
    description: |-
      Precondition: `{{tripId}}` FINISHED and Month Audit has set `isMonthEndDone` on its expense header. `src/modules/expenses/expenses.controller.ts:54`
      Not covered: update/delete 'after month end' and 'No expense header found' — month end only closes FINISHED trips while update/delete
      require START, and START always creates a header, so those branches are unreachable via HTTP.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Manual Preconditions/Create Expense - 400 after month end.yml
    request:
