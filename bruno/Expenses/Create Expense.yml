  - name: 201 negative amount accepted
    description: |-
      [KNOWN BUG] `amount` has no `.min()` (`src/modules/expenses/expenses.validation.ts:11`); a negative expense lowers the trip total. Expected: 400.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Create Expense - 201 negative amount accepted.yml
    request:
