info:
  name: Create Expense
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/expense/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "typeId": 1,
        "typeName": "Fuel",
        "amount": 1500,
        "description": "Bruno expense",
        "date": "{{expenseDate}}",
        "receiptUrl": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("expenseDate", new Date().toISOString());
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Expense saved successfully!
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      Adds a 'Fuel' line (1500) to the trip's expense header (created lazily if missing). Precondition: `{{tripId}}` in START (or FINISHED for non-drivers).
      Roles: SUPERADMIN, ADMIN, TRIPMANAGER, DRIVER. Response is sent before the transaction commits (`src/modules/expenses/expenses.controller.ts:85-92`). `src/modules/expenses/expenses.controller.ts:16`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Create Expense - 201.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}"
      method: POST
      body:
        type: json
        data: |-
          {
            "typeId": 1,
            "typeName": "Fuel",
            "amount": 1500,
            "description": "Bruno expense",
            "date": "{{expenseDate}}",
            "receiptUrl": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Expense saved successfully!",
            "data": null
          }
  - name: 201 as driver
    description: |-
      DRIVER may add while trip is START. No check that the driver is assigned to the trip (Known issues). `src/modules/expenses/expenses.controller.ts:59-66`

      Auth: bearer {{driverToken}}

      Source scenario: Expenses/Create Expense - 201 as driver.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}"
      method: POST
      body:
        type: json
        data: |-
          {
            "typeId": 2,
            "typeName": "Meals",
            "amount": 800,
            "description": "Bruno driver expense",
            "date": "{{expenseDate}}",
            "receiptUrl": ""
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
