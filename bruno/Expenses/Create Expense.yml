  - name: 400 driver after trip finished
    description: |-
      Precondition: `{{tripId}}` FINISHED and header not month-end. Admins may still add. `src/modules/expenses/expenses.controller.ts:63`

      Auth: bearer {{driverToken}}

      Source scenario: Expenses/Manual Preconditions/Create Expense - 400 driver after trip finished.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}"
      method: POST
      body:
