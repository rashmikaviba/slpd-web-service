docs: |-
  **POST `/api/v1/expense/:tripId`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Expense saved successfully! |
  | 2 | 201 | 201 as driver | Expense saved successfully! |
  | 3 | 201 | 201 negative amount accepted | Expense saved successfully! |
  | 4 | 400 | 400 driver after trip finished | Cannot add new expense after trip finished! |
  | 5 | 400 | 400 after month end | Cannot add new expense after month end! |
  | 6 | 400 | 400 missing typeId | Type is required |
  | 7 | 400 | 400 typeId not a number | Type is invalid |
  | 8 | 400 | 400 empty typeName | "typeName" is not allowed to be empty |
  | 9 | 400 | 400 missing amount | Amount is required |
  | 10 | 400 | 400 amount not a number | Amount is invalid |
  | 11 | 400 | 400 missing date | Date is required |
  | 12 | 400 | 400 invalid date | Date is invalid |
  | 13 | 400 | 400 description too long | Description should not be more than 500 characters |
  | 14 | 400 | 400 description not a string | Description is invalid |
  | 15 | 400 | 400 receiptUrl not a string | Receipt URL is invalid |
  | 16 | 400 | 400 unknown field | "foo" is not allowed |
  | 17 | 400 | 400 trip not found | No trip found! |
  | 18 | 401 | 401 no token | Authentication invalid! |
  | 19 | 403 | 403 wrong role | You're unauthorized to access this resource! |
