info:
  name: Update Expense
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/expense/{{tripId}}/{{expenseId}}"
  body:
    type: json
    data: |-
      {
        "typeId": 1,
        "typeName": "Fuel",
        "amount": 1750,
        "description": "Bruno expense updated",
        "date": "{{expenseDate}}",
        "receiptUrl": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("expenseDate", new Date().toISOString());
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Expense updated successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Trip must be START, header not month-end. Overwrites all fields. Roles: SUPERADMIN, ADMIN, TRIPMANAGER, DRIVER. `src/modules/expenses/expenses.controller.ts:101`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Update Expense - 200.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{expenseId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "typeId": 1,
            "typeName": "Fuel",
            "amount": 1750,
            "description": "Bruno expense updated",
            "date": "{{expenseDate}}",
            "receiptUrl": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Expense updated successfully!",
            "data": null
          }
  - name: 200 deleted expense still editable
    description: |-
      [KNOWN BUG] Line lookup ignores `status` (`src/modules/expenses/expenses.controller.ts:136-138`), so a DELETED line can be edited. Expected: 400 'Expense not found!'.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Update Expense - 200 deleted expense still editable.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{driverExpenseId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "typeId": 2,
            "typeName": "Meals",
            "amount": 1,
            "description": "Bruno expense",
            "date": "{{expenseDate}}",
            "receiptUrl": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Expense updated successfully!",
            "data": null
          }
  - name: 400 missing typeId
    description: |-
      Joi `updateExpenseSchema` (same rules as save). `src/modules/expenses/expenses.validation.ts:31-57`, `src/modules/expenses/expenses.controller.ts:109`

