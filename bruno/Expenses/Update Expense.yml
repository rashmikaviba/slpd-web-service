          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid trip id
    description: |-
      `src/modules/expenses/expenses.controller.ts:114`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Update Expense - 404 invalid trip id.yml
    request:
      url: "{{baseUrl}}/expense/{{invalidId}}/{{expenseId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "typeId": 1,
            "typeName": "Fuel",
            "amount": 1500,
            "description": "Bruno expense",
            "date": "2026-01-01",
            "receiptUrl": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **PUT `/api/v1/expense/:tripId/:expenseId`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Expense updated successfully! |
  | 2 | 200 | 200 deleted expense still editable | Expense updated successfully! |
  | 3 | 400 | 400 missing typeId | Type is required |
  | 4 | 400 | 400 missing amount | Amount is required |
  | 5 | 400 | 400 missing date | Date is required |
  | 6 | 400 | 400 unknown field | "foo" is not allowed |
  | 7 | 400 | 400 trip not started | No trip found or trip not in started status! |
  | 8 | 400 | 400 expense not found | Expense not found! |
  | 9 | 401 | 401 no token | Authentication invalid! |
  | 10 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 11 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  Trip must be START, header not month-end. Overwrites all fields. Roles: SUPERADMIN, ADMIN, TRIPMANAGER, DRIVER. `src/modules/expenses/expenses.controller.ts:101`
