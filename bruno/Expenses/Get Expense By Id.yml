info:
  name: Get Expense By Id
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/expense/{{tripId}}/{{expenseId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("line", function () {
          expect(res.body.data._id).to.equal(bru.getVar("expenseId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Any role. Raw ACTIVE line item. `src/modules/expenses/expenses.controller.ts:269`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expense By Id - 200.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{expenseId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "typeId": 1,
              "typeName": "Fuel",
              "amount": 1500,
              "description": "Bruno expense",
              "date": "2026-11-18T08:40:00.215Z",
              "receiptUrl": "",
              "status": 1,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "createdAt": "2026-11-18T08:40:00.301Z",
              "updatedAt": "2026-11-18T08:40:00.301Z",
              "_id": "6731f3a2b4c5d6e7f8a9b0f2"
            }
          }
  - name: 200 null for unknown expense
    description: |-
      Never 404s: unknown line -> `data: null`. `src/modules/expenses/expenses.controller.ts:279-293`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expense By Id - 200 null for unknown expense.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": null
          }
  - name: 200 null for deleted expense
    description: |-
      Deleted lines are filtered out. Precondition: `Delete Expense - 200`. `src/modules/expenses/expenses.controller.ts:282-286`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expense By Id - 200 null for deleted expense.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{driverExpenseId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Expenses/Get Expense By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}/{{expenseId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid trip id
    description: |-
      `src/modules/expenses/expenses.controller.ts:274`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expense By Id - 404 invalid trip id.yml
    request:
      url: "{{baseUrl}}/expense/{{invalidId}}/{{expenseId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **GET `/api/v1/expense/:tripId/:expenseId`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 200 | 200 null for unknown expense | (empty) |
  | 3 | 200 | 200 null for deleted expense | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  Any role. Raw ACTIVE line item. `src/modules/expenses/expenses.controller.ts:269`
