info:
  name: Get Expenses By Trip
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/expense/{{tripId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data) {
          const ex = res.body.data.expenses;
          const fuel = ex.filter((e) => e.typeName === "Fuel").pop();
          const meals = ex.filter((e) => e.typeName === "Meals").pop();
          if (fuel) bru.setVar("expenseId", fuel._id);
          if (meals) bru.setVar("driverExpenseId", meals._id);
        }
    - type: tests
      code: |-
        test("totals", function () {
          const d = res.body.data;
          const sum = d.expenses.reduce((t, e) => t + e.amount, 0);
          expect(d.totalTripExpensesAmount).to.equal(sum);
          expect(d.remainingTripExpensesAmount).to.equal(d.tripExpensesAmount - sum);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Any role. Header with ACTIVE lines only, `tripExpensesAmount` = trip.estimatedExpense, totals and remaining (may be negative).
      Stores `{{expenseId}}` (last 'Fuel' line) and `{{driverExpenseId}}` (last 'Meals' line). `src/modules/expenses/expenses.controller.ts:222`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expenses By Trip - 200.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}"
      method: GET
    response:
