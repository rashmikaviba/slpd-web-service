  - name: 200 null for unknown trip
    description: |-
      No header for that trip -> `data: null` (no 404). `src/modules/expenses/expenses.controller.ts:231-254`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expenses By Trip - 200 null for unknown trip.yml
    request:
      url: "{{baseUrl}}/expense/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Expenses/Get Expenses By Trip - 401 no token.yml
    request:
      url: "{{baseUrl}}/expense/{{tripId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid trip id
    description: |-
      `src/modules/expenses/expenses.controller.ts:226` (query on `tripId`).

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Get Expenses By Trip - 404 invalid trip id.yml
    request:
      url: "{{baseUrl}}/expense/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **GET `/api/v1/expense/:tripId`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 200 | 200 null for unknown trip | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  Any role. Header with ACTIVE lines only, `tripExpensesAmount` = trip.estimatedExpense, totals and remaining (may be negative).
  Stores `{{expenseId}}` (last 'Fuel' line) and `{{driverExpenseId}}` (last 'Meals' line). `src/modules/expenses/expenses.controller.ts:222`
