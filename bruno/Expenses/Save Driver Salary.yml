docs: |-
  **POST `/api/v1/expense/saveSalary/:tripId`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Driver salary saved successfully! |
  | 2 | 400 | 400 driver not in trip | Driver not found in trip! |
  | 3 | 400 | 400 missing driver | Driver Id is required |
  | 4 | 400 | 400 driver not a string | Driver Id is invalid |
  | 5 | 400 | 400 missing salaryPerDay | Salary Per Day is required |
  | 6 | 400 | 400 salaryPerDay not a number | Salary Per Day is invalid |
  | 7 | 400 | 400 missing noOfDays | No of Days is required |
  | 8 | 400 | 400 noOfDays not a number | No of Days is invalid |
  | 9 | 400 | 400 totalAddition not a number | Total Addition is invalid |
  | 10 | 400 | 400 totalDeduction not a number | Total Deduction is invalid |
  | 11 | 400 | 400 isRemainingToDriver not boolean | Is Remaining To Driver is invalid |
  | 12 | 400 | 400 trip not finished | Trip not found! |
  | 13 | 401 | 401 no token | Authentication invalid! |
  | 14 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 15 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  Precondition: `{{tripId}}` FINISHED and `{{driverUserId}}` listed in `trip.drivers`. Upserts the driver's salary entry
  (re-running overwrites it). `isMonthEndDone` is not checked. `src/modules/expenses/expenses.controller.ts:299`
