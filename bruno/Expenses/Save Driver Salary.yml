info:
  name: Save Driver Salary
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/expense/saveSalary/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "driver": "{{driverUserId}}",
        "salaryPerDay": 3000,
        "noOfDays": 2,
        "totalAddition": 500,
        "totalDeduction": 0,
        "isRemainingToDriver": false
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Driver salary saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Precondition: `{{tripId}}` FINISHED and `{{driverUserId}}` listed in `trip.drivers`. Upserts the driver's salary entry
      (re-running overwrites it). `isMonthEndDone` is not checked. `src/modules/expenses/expenses.controller.ts:299`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Expenses/Manual Preconditions/Save Driver Salary - 200.yml
    request:
      url: "{{baseUrl}}/expense/saveSalary/{{tripId}}"
      method: POST
      body:
        type: json
        data: |-
          {
            "driver": "{{driverUserId}}",
            "salaryPerDay": 3000,
            "noOfDays": 2,
            "totalAddition": 500,
            "totalDeduction": 0,
            "isRemainingToDriver": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Driver salary saved successfully!",
            "data": null
