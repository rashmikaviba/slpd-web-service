info:
  name: Active Inactive Garage
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/garage/activeInactiveGarage/{{garageToDeleteId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Garage inactivated successfully!
    - expression: res.body.data
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 inactivate
    description: |-
      Toggle ACTIVE → INACTIVE on the throwaway garage (garage.controller.ts:179-219). No body/query.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 200 inactivate.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{garageToDeleteId}}"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Garage inactivated successfully!",
            "data": null
          }
  - name: 200 activate
    description: |-
      Precondition: previous request inactivated it. Toggle INACTIVE → ACTIVE.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 200 activate.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{garageToDeleteId}}"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Garage activated successfully!",
            "data": null
          }
  - name: 400 not found
    description: |-
      garage.controller.ts:188-190.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 400 not found.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{nonExistingId}}"
      method: PUT
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Garage not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 401 no token.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{garageToDeleteId}}"
      method: PUT
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 driver role
    description: |-
      DRIVER is not in the write roles (garage.route.ts:56-64).

      Auth: bearer {{driverToken}}

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 403 driver role.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{garageToDeleteId}}"
      method: PUT
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → CastError → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Active Inactive Garage/Active Inactive Garage - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/garage/activeInactiveGarage/{{invalidId}}"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **PUT `/api/v1/garage/activeInactiveGarage/:id`**

  This request runs the main scenario **200 inactivate**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 inactivate | Garage inactivated successfully! |
  | 2 | 200 | 200 activate | Garage activated successfully! |
  | 3 | 400 | 400 not found | Garage not found! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 403 | 403 driver role | You're unauthorized to access this resource! |
  | 6 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Toggle ACTIVE → INACTIVE on the throwaway garage (garage.controller.ts:179-219). No body/query.
