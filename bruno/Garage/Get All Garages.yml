info:
  name: Get All Garages
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/garage/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("contains created garage", function () {
          expect(res.body.data.map((g) => g._id)).to.include(bru.getVar("garageId"));
        });
        test("specializations flattened to a string", function () {
          const g = res.body.data.find((x) => x._id === bru.getVar("garageId"));
          expect(g.specializations).to.equal("Engine, Brakes");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      ACTIVE + INACTIVE garages as GarageResponseDto[] (garage.controller.ts:140-160). Any authenticated role.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Get All Garages/Get All Garages - 200.yml
