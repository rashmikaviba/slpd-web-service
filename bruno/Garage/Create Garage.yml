info:
  name: Create Garage
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/garage/"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Garage {{$timestamp}}",
        "address": "12 Main Street",
        "city": "Colombo",
        "contactNumber1": "0771234567",
        "contactNumber2": "0112345678",
        "googleMapUrl": "https://maps.google.com/?q=6.9271,79.8612",
        "specializations": [
          {
            "id": 1,
            "name": "Engine"
          },
          {
            "id": 2,
            "name": "Brakes"
          }
        ],
        "description": "Created by Bruno"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 200 || res.status === 201) bru.setVar("garageId", res.body.data._id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Garage created successfully!
    - expression: res.body.data.status
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      Stores `{{garageId}}`. Response 201 with saved document (garage.controller.ts:12-56). No duplicate-name check.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Create Garage/Create Garage - 201.yml
    request:
      url: "{{baseUrl}}/garage/"
