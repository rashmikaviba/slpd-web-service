docs: |-
  **POST `/api/v1/garage`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Garage created successfully! |
  | 2 | 201 | 201 throwaway garage for delete | Garage created successfully! |
  | 3 | 400 | 400 missing name | Garage Name is required |
  | 4 | 400 | 400 invalid name | "name" must be a string |
  | 5 | 400 | 400 name too long | Garage Name cannot be more than 100 characters |
  | 6 | 400 | 400 address too long | Address cannot be more than 300 characters |
  | 7 | 400 | 400 city too long | City cannot be more than 100 characters |
  | 8 | 400 | 400 contactNumber1 too long | Contact Number cannot be more than 14 characters |
  | 9 | 400 | 400 contactNumber2 too long | Contact Number cannot be more than 14 characters |
  | 10 | 400 | 400 invalid googleMapUrl | Google Map URL must be a string |
  | 11 | 400 | 400 missing specializations | Specializations are required |
  | 12 | 400 | 400 specializations not an array | "specializations" must be an array |
  | 13 | 400 | 400 empty specializations | At least one specialization is required |
  | 14 | 400 | 400 specialization missing id | Specialization Id is required |
  | 15 | 400 | 400 specialization invalid id | Specialization Id must be a number |
  | 16 | 400 | 400 specialization missing name | Specialization Name is required |
  | 17 | 400 | 400 specialization name too long | Specialization Name cannot be more than 100 characters |
  | 18 | 400 | 400 description too long | Description cannot be more than 500 characters |
  | 19 | 401 | 401 no token | Authentication invalid! |
  | 20 | 403 | 403 driver role | You're unauthorized to access this resource! |

  ## Main scenario notes

  Stores `{{garageId}}`. Response 201 with saved document (garage.controller.ts:12-56). No duplicate-name check.
