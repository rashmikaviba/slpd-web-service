info:
  name: Update Garage
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/garage/{{garageId}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Garage Updated {{$timestamp}}",
        "address": "12 Main Street",
        "city": "Kandy",
        "contactNumber1": "0771234567",
        "contactNumber2": "0112345678",
        "googleMapUrl": "https://maps.google.com/?q=6.9271,79.8612",
        "specializations": [
          {
            "id": 1,
            "name": "Engine"
          },
          {
            "id": 2,
            "name": "Brakes"
          }
        ],
        "description": "Created by Bruno"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Garage updated successfully!
    - expression: res.body.data.city
      operator: eq
      value: Kandy

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

