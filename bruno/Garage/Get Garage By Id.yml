      [KNOWN BUG] No not-found error: 200 with `data: null` (garage.controller.ts:162-177, Document/garage.md › Known issues).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Get Garage By Id/Get Garage By Id - 200 not found returns null.yml
    request:
      url: "{{baseUrl}}/garage/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
