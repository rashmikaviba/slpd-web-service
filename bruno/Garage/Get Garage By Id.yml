  - name: 401 no token
    description: |-
      No Authorization header.

      Auth: none (no Authorization header)

      Source scenario: Garage/Get Garage By Id/Get Garage By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/garage/{{garageId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed id → CastError → 404 (error.middleware.ts:57-60).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Get Garage By Id/Get Garage By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/garage/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/garage/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 200 | 200 not found returns null | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Raw document, no populate (garage.controller.ts:162-177).
