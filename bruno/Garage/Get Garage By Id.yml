info:
  name: Get Garage By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/garage/{{garageId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data._id
      operator: eq
      value: '"{{garageId}}"'
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Raw document, no populate (garage.controller.ts:162-177).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Garage/Get Garage By Id/Get Garage By Id - 200.yml
    request:
      url: "{{baseUrl}}/garage/{{garageId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
