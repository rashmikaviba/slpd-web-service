            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 wrong role
    description: |-
      Route allows TRIPMANAGER, SUPERADMIN, ADMIN, FINANCEOFFICER, DRIVER (src/modules/tripSummary/tripSummary.route.ts:51-61); DRIVERASSISTANT is rejected (src/middleware/auth.middleware.ts:66-74).

      Auth: bearer {{driverAssistantToken}}

      Source scenario: Trip Summary/Delete Trip Summary/Delete Trip Summary - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/tripSummary/{{tripSummaryId}}"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches findOne → CastError → 404 (error.middleware.ts CastError branch). src/modules/tripSummary/tripSummary.controller.ts:201.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip Summary/Delete Trip Summary/Delete Trip Summary - 404 invalid id.yml
    request:
