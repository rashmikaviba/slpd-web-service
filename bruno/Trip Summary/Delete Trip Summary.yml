info:
  name: Delete Trip Summary
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/tripSummary/{{deleteTripSummaryId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip summary deleted successfully!
    - expression: res.body.data.status
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

