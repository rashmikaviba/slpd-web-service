  - name: 401 no token
    description: |-
      No Authorization header → UnauthorizedError (src/middleware/auth.middleware.ts:24-26).

      Auth: none (no Authorization header)

      Source scenario: Trip Summary/Delete Trip Summary/Delete Trip Summary - 401 no token.yml
