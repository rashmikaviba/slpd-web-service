            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **DELETE `/api/v1/tripSummary/:id`**

  This request runs the main scenario **200 admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 admin | Trip summary deleted successfully! |
  | 2 | 200 | 200 driver on started trip | Trip summary deleted successfully! |
  | 3 | 400 | 400 already deleted | No trip summary found! |
  | 4 | 400 | 400 driver on finished trip | You can not delete trip summary, because trip is already finished! |
  | 5 | 400 | 400 not found | No trip summary found! |
  | 6 | 400 | 400 month end done | You can not delete trip summary, because month end is already done! |
  | 7 | 401 | 401 no token | Authentication invalid! |
  | 8 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 9 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [DESTRUCTIVE] Soft delete: status = DELETED (src/modules/tripSummary/tripSummary.controller.ts:225-235). updatedBy not set (Known issue 6).
