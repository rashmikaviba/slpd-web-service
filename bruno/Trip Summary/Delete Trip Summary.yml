    description: |-
      Only ACTIVE summaries are found (src/modules/tripSummary/tripSummary.controller.ts:201-209).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip Summary/Delete Trip Summary/Delete Trip Summary - 400 already deleted.yml
