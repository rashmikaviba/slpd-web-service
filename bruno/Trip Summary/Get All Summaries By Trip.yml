        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/tripSummary/trip/:tripId`**

  This request runs the main scenario **200 started trip**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 started trip | (empty) |
  | 2 | 200 | 200 as driver | (empty) |
  | 3 | 400 | 400 trip not found | No trip found! |
  | 4 | 400 | 400 canceled trip | No trip found! |
  | 5 | 401 | 401 no token | Authentication invalid! |
  | 6 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  `data: { trip: TripResponseDtoGetAll, tripSummaries: TripSummaryResponseDto[] }` — DTO field names startTime/endTime (src/modules/tripSummary/tripSummary.controller.ts:147-167).
