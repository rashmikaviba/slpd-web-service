info:
  name: Get All Summaries By Trip
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tripSummary/trip/{{tripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("trip DTO and ACTIVE summaries", function () {
          expect(res.body.data.trip.id).to.equal(bru.getVar("tripId"));
          const ids = res.body.data.tripSummaries.map((s) => s._id);
          expect(ids).to.include(bru.getVar("tripSummaryId"));
          expect(ids).to.include(bru.getVar("driverTripSummaryId"));
          expect(res.body.data.tripSummaries[0]).to.have.property("startTime");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

