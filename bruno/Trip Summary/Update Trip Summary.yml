docs: |-
  **PUT `/api/v1/tripSummary/:id`**

  This request runs the main scenario **200 admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 admin | Trip summary updated successfully! |
  | 2 | 200 | 200 driver on started trip | Trip summary updated successfully! |
  | 3 | 200 | 200 [KNOWN BUG] tripId in body ignored | Trip summary updated successfully! |
  | 4 | 400 | 400 driver on finished trip | You can not update trip summary, because trip is already finished! |
  | 5 | 400 | 400 not found | No trip summary found! |
  | 6 | 400 | 400 month end done | You can not update trip summary, because month end is already done! |
  | 7 | 400 | 400 missing tripId | tripId is required |
  | 8 | 400 | 400 missing date | Date is required |
  | 9 | 400 | 400 startingKm not number | Starting Km is invalid |
  | 10 | 401 | 401 no token | Authentication invalid! |
  | 11 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 12 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Overwrites the editable fields (src/modules/tripSummary/tripSummary.controller.ts:110-121).
