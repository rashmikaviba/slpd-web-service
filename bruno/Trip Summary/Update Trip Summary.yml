info:
  name: Update Trip Summary
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/tripSummary/{{tripSummaryId}}"
  body:
    type: json
    data: |-
      {
        "tripId": "{{tripId}}",
        "date": "{{summaryDate}}",
        "startTime": "{{summaryStart}}",
        "endTime": "{{summaryEnd}}",
        "startingKm": 1000,
        "endingKm": 1120,
        "totalKm": 120,
        "fuel": 12,
        "description": "Kandy to Ella via Nuwara Eliya"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // summary date = today, 08:00 -> 17:00 UTC
        const d = new Date().toISOString().slice(0, 10);
        bru.setVar("summaryDate", d + "T00:00:00.000Z");
        bru.setVar("summaryStart", d + "T08:00:00.000Z");
        bru.setVar("summaryEnd", d + "T17:00:00.000Z");
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip summary updated successfully!
    - expression: res.body.data.endingKm
      operator: eq
      value: "1120"
    - expression: res.body.data.totalKm
      operator: eq
      value: "120"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 admin
    description: |-
      Overwrites the editable fields (src/modules/tripSummary/tripSummary.controller.ts:110-121).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip Summary/Update Trip Summary/Update Trip Summary - 200 admin.yml
    request:
      url: "{{baseUrl}}/tripSummary/{{tripSummaryId}}"
      method: PUT
      body:
        type: json
