info:
  name: Save Trip Summary
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/tripSummary"
  body:
    type: json
    data: |-
      {
        "tripId": "{{tripId}}",
        "date": "{{summaryDate}}",
        "startTime": "{{summaryStart}}",
        "endTime": "{{summaryEnd}}",
        "startingKm": 1000,
        "endingKm": 1080,
        "totalKm": 80,
        "fuel": 12,
        "description": "Kandy to Ella"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // summary date = today, 08:00 -> 17:00 UTC
        const d = new Date().toISOString().slice(0, 10);
        bru.setVar("summaryDate", d + "T00:00:00.000Z");
        bru.setVar("summaryStart", d + "T08:00:00.000Z");
        bru.setVar("summaryEnd", d + "T17:00:00.000Z");
    - type: after-response
      code: if (res.status === 200) bru.setVar("deleteTripSummaryId", res.body.data._id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip summary saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
