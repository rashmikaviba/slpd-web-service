docs: |-
  **POST `/api/v1/tripSummary`**

  This request runs the main scenario **200 setup summary to delete**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 setup summary to delete | Trip summary saved successfully! |
  | 2 | 200 | 200 admin on started trip | Trip summary saved successfully! |
  | 3 | 200 | 200 driver on started trip | Trip summary saved successfully! |
  | 4 | 200 | 200 office role on finished trip | Trip summary saved successfully! |
  | 5 | 400 | 400 driver on finished trip | You can not save trip summary, because trip is already finished! |
  | 6 | 400 | 400 trip not found | No trip found! |
  | 7 | 400 | 400 canceled trip | No trip found! |
  | 8 | 400 | 400 month end done | You can not save trip summary, because month end is already done! |
  | 9 | 400 | 400 missing tripId | tripId is required |
  | 10 | 400 | 400 tripId not string | tripId is invalid |
  | 11 | 400 | 400 missing date | Date is required |
  | 12 | 400 | 400 invalid date | Date is invalid |
  | 13 | 400 | 400 missing startTime | Start Time is required |
  | 14 | 400 | 400 invalid startTime | Start Time is invalid |
  | 15 | 400 | 400 invalid endTime | End Time is invalid |
  | 16 | 400 | 400 missing startingKm | Starting Km is required |
  | 17 | 400 | 400 startingKm not number | Starting Km is invalid |
  | 18 | 400 | 400 endingKm not number | Ending Km is invalid |
  | 19 | 400 | 400 totalKm not number | Total Km is invalid |
  | 20 | 400 | 400 fuel not number | Fuel is invalid |
  | 21 | 400 | 400 description too long | Description should not be more than 500 characters |
  | 22 | 400 | 400 description not string | Description is invalid |
  | 23 | 400 | 400 unknown field | "foo" is not allowed |
  | 24 | 401 | 401 no token | Authentication invalid! |
  | 25 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 26 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Setup: throw-away summary on the START trip.
