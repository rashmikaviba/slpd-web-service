      Source scenario: Trip Summary/Delete Trip Summary/Save Trip Summary - 200 setup summary to delete.yml
    request:
      url: "{{baseUrl}}/tripSummary"
      method: POST
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "date": "{{summaryDate}}",
            "startTime": "{{summaryStart}}",
            "endTime": "{{summaryEnd}}",
            "startingKm": 1000,
            "endingKm": 1080,
            "totalKm": 80,
            "fuel": 12,
            "description": "Kandy to Ella"
