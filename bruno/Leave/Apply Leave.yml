info:
  name: Apply Leave
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/leave/apply"
  body:
    type: json
    data: |-
      {
        "startDate": "{{leaveFrom1}}",
        "endDate": "{{leaveTo1}}",
        "dateCount": 2,
        "reason": "Bruno test leave"
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // random far-future year so reruns never overlap and month-end never selects these leaves
        const year = 2100 + Math.floor(Math.random() * 800);
        const day = (n) => new Date(Date.UTC(year, 0, 1 + n)).toISOString().slice(0, 10);
        bru.setVar("leaveYear", year);
        [10, 20, 30, 40, 50, 60].forEach((n, i) => {
          bru.setVar("leaveFrom" + (i + 1), day(n));
          bru.setVar("leaveTo" + (i + 1), day(n + 1));
        });
    - type: after-response
      code: if (res.status === 201) bru.setVar("leaveId", res.body.data._id);
    - type: tests
      code: |-
        test("pending leave of the driver", function () {
          expect(res.body.data.status).to.equal(1);
          expect(res.body.data.appliedUser).to.equal(bru.getVar("driverUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Leave applied successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 driver
    description: |-
      Driver leave, no entitlement check (leave.controller.ts:45-54,82-101). Sets `{{leaveYear}}`, date slots and `{{leaveId}}`.

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Apply Leave/Apply Leave - 201 driver.yml
    request:
      url: "{{baseUrl}}/leave/apply"
      method: POST
      body:
        type: json
        data: |-
          {
            "startDate": "{{leaveFrom1}}",
            "endDate": "{{leaveTo1}}",
            "dateCount": 2,
