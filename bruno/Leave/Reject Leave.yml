docs: |-
  **PUT `/api/v1/leave/reject/:id`**

  This request runs the main scenario **201 super admin rejects approved leave**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 super admin rejects approved leave | Leave rejected successfully! |
  | 2 | 201 | 403 [KNOWN BUG] driver role accepted | Leave rejected successfully! |
  | 3 | 201 | 201 reject again (cleanup) | Leave rejected successfully! |
  | 4 | 400 | 400 missing remark | Remark is required |
  | 5 | 400 | 400 remark too long | Remark cannot be more than 500 characters |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 404 | 404 already rejected | Leave not found! |
  | 8 | 404 | 404 cancelled leave | Leave not found! |
  | 9 | 404 | 404 not found | Leave not found! |
  | 10 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  APPROVED → REJECTED (leave.controller.ts:507-546). Approved-days cache is not cleared (Document/leave.md #4).
