info:
  name: Reject Leave
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/leave/reject/{{leaveId}}"
  body:
    type: json
    data: |-
      {
        "remark": "Bruno remark"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejected, approve info cleared", function () {
          expect(res.body.data.statusName).to.equal("REJECTED");
          expect(res.body.data.rejectReason).to.equal("Bruno remark");
          expect(res.body.data.approveBy).to.equal(null);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Leave rejected successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
