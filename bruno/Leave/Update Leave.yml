            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 rejected leave
    description: |-
      Only PENDING leaves can be updated (leave.controller.ts:167-173).

      Auth: bearer {{driverToken}}

      Source scenario: Leave/State Checks/Update Leave - 404 rejected leave.yml
    request:
      url: "{{baseUrl}}/leave/update/{{leaveId}}"
