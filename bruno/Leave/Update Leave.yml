          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Leave not found!",
            "data": null
          }
  - name: 404 not found
    description: |-
      Free dates (slot 5) pass the overlap check, then no PENDING leave → `NotFoundError` (leave.controller.ts:167-173).

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Update Leave/Update Leave - 404 not found.yml
    request:
      url: "{{baseUrl}}/leave/update/{{nonExistingId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "startDate": "{{leaveFrom5}}",
            "endDate": "{{leaveTo5}}",
            "dateCount": 2,
            "reason": "Bruno test leave"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Leave not found!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `_id: { $ne: "not-an-object-id" }` in the overlap query → CastError → 404 (leave.service.ts:26-46).

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Update Leave/Update Leave - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/leave/update/{{invalidId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "startDate": "{{leaveFrom5}}",
            "endDate": "{{leaveTo5}}",
            "dateCount": 2,
            "reason": "Bruno test leave"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
