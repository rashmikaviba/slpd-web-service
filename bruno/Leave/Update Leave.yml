  - name: 400 overlapping dates
    description: |-
      Moving `{{leaveId}}` onto slot 2 overlaps `{{cancelLeaveId}}` (PENDING) (leave.controller.ts:153-165). Note the trailing `.!` in this message.

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Update Leave/Update Leave - 400 overlapping dates.yml
    request:
      url: "{{baseUrl}}/leave/update/{{leaveId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "startDate": "{{leaveFrom2}}",
            "endDate": "{{leaveTo2}}",
            "dateCount": 2,
            "reason": "Bruno test leave"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Leave is already applied for the given dates.!",
            "data": null
          }
  - name: 400 [KNOWN BUG] admin within limit rejected
    description: |-
      [KNOWN BUG] Inverted check: with 0 approved days and the new count within the limit
      (`0 == 0 && 0 - L + 1 <= L`) it throws "exceeded" (leave.controller.ts:253-260, Document/leave.md #2).
      Expected: 200. Precondition: `{{adminLeaveId}}` PENDING, admin has no approved days in `{{leaveYear}}`.

      Auth: bearer {{adminToken}}

      Source scenario: Leave/Update Leave/Update Leave - 400 [KNOWN BUG] admin within limit rejected.yml
    request:
      url: "{{baseUrl}}/leave/update/{{adminLeaveId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "startDate": "{{leaveFrom3}}",
            "endDate": "{{leaveTo3}}",
            "dateCount": 1,
            "reason": "Bruno test leave"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You have exceeded the leave limit for 2437 year!",
            "data": null
          }
  - name: 400 missing startDate
    description: |-
      Same Joi `leaveSchema` as apply (leave.controller.ts:147-151). Full rule set is covered in Apply Leave.

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Update Leave/Update Leave - 400 missing startDate.yml
