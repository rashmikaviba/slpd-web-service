info:
  name: Update Leave
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/leave/update/{{leaveId}}"
  body:
    type: json
    data: |-
      {
        "startDate": "{{leaveFrom1}}",
        "endDate": "{{leaveTo1}}",
        "dateCount": 2,
        "reason": "Bruno test leave (updated)"
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns updated raw leave", function () {
          expect(res.body.data._id).to.equal(bru.getVar("leaveId"));
          expect(res.body.data.reason).to.equal("Bruno test leave (updated)");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Leave updated successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

