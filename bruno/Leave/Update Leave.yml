        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **PUT `/api/v1/leave/update/:id`**

  This request runs the main scenario **200 driver**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 driver | Leave updated successfully! |
  | 2 | 400 | 400 overlapping dates | Leave is already applied for the given dates.! |
  | 3 | 400 | 400 [KNOWN BUG] admin within limit rejected | You have exceeded the leave limit for 2437 year! |
  | 4 | 400 | 400 missing startDate | Start Date is required! |
  | 5 | 400 | 400 dateCount 0 | Date Count cannot be less than 1 |
  | 6 | 400 | 400 reason too long | Reason cannot be more than 500 characters |
  | 7 | 401 | 401 no token | Authentication invalid! |
  | 8 | 404 | 404 rejected leave | Leave not found! |
  | 9 | 404 | 404 not found | Leave not found! |
  | 10 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Same dates (own leave excluded from overlap), new reason (leave.controller.ts:142-234). Returns the raw document (not the DTO).
