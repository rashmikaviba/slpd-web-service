docs: |-
  **PUT `/api/v1/leave/cancel/:id`**

  This request runs the main scenario **201 driver cancels pending leave**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 driver cancels pending leave | Leave cancelled successfully! |
  | 2 | 201 | 201 admin leave (cleanup) | Leave cancelled successfully! |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 already cancelled | Leave not found! |
  | 5 | 404 | 404 rejected leave | Leave not found! |
  | 6 | 404 | 404 not found | Leave not found! |
  | 7 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  PENDING → CANCELLED (leave.controller.ts:549-584).
