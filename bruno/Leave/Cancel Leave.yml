info:
  name: Cancel Leave
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/leave/cancel/{{cancelLeaveId}}"
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("cancelled", function () {
          expect(res.body.data.statusName).to.equal("CANCELLED");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Leave cancelled successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 driver cancels pending leave
    description: |-
      PENDING → CANCELLED (leave.controller.ts:549-584).

      Auth: bearer {{driverToken}}

      Source scenario: Leave/Cancel Leave/Cancel Leave - 201 driver cancels pending leave.yml
