info:
  name: Approve Leave
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/leave/approve/{{leaveId}}"
  body:
    type: json
    data: |-
      {
        "remark": "Bruno remark"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("approved", function () {
          expect(res.body.data.statusName).to.equal("APPROVED");
          expect(res.body.data.approveBy).to.equal(bru.getVar("superAdminUserId"));
          expect(res.body.data.approveRemark).to.equal("Bruno remark");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Leave approved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
