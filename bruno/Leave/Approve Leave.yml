docs: |-
  **PUT `/api/v1/leave/approve/:id`**

  This request runs the main scenario **201 super admin**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 super admin | Leave approved successfully! |
  | 2 | 201 | 403 [KNOWN BUG] driver role accepted | Leave approved successfully! |
  | 3 | 201 | 201 re-approve rejected leave | Leave approved successfully! |
  | 4 | 400 | 400 applicant exceeded leave limit | This user have exceeded the leave limit for 2437 year! |
  | 5 | 400 | 400 missing remark | Remark is required |
  | 6 | 400 | 400 empty remark | "remark" is not allowed to be empty |
  | 7 | 400 | 400 remark too long | Remark cannot be more than 500 characters |
  | 8 | 400 | 400 non-string remark | Remark is invalid |
  | 9 | 401 | 401 no token | Authentication invalid! |
  | 10 | 404 | 404 cancelled leave | Leave not found! |
  | 11 | 404 | 404 already approved | Leave not found! |
  | 12 | 404 | 404 not found | Leave not found! |
  | 13 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Driver leave (no entitlement check) PENDING → APPROVED (leave.controller.ts:454-491).
