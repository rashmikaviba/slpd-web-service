info:
  name: Get All Leaves
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/leave?year={{leaveYear}}"
  params:
    - name: year
      value: "{{leaveYear}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("contains driver and admin leaves", function () {
          const ids = res.body.data.map((l) => l._id);
          expect(ids).to.include(bru.getVar("leaveId"));
          expect(ids).to.include(bru.getVar("adminLeaveId"));
        });
        test("admin leaves carry availableLeaveCount", function () {
          const l = res.body.data.find((x) => x._id === bru.getVar("adminLeaveId"));
          expect(l.availableLeaveCount).to.equal(Number(bru.getVar("adminLeaveCount")));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

