docs: |-
  **GET `/api/v1/leave`**

  This request runs the main scenario **200 super admin sees all**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 super admin sees all | (empty) |
  | 2 | 200 | 200 driver sees own | (empty) |
  | 3 | 200 | 200 driver assistant empty | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |

  ## Main scenario notes

  SUPERADMIN: everyone's leaves of the year; ADMIN/FO/TM applicants get `availableLeaveCount` (leave.controller.ts:339-386).
