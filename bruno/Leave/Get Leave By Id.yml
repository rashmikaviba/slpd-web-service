  - name: 404 invalid id
    description: |-
      CastError in `Leave.findOne` → 404.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Leave/Get Leave By Id/Get Leave By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/leave/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/leave/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 401 | 401 no token | Authentication invalid! |
  | 3 | 404 | 404 cancelled leave | Leave not found! |
  | 4 | 404 | 404 not found | Leave not found! |
  | 5 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  PENDING/APPROVED/REJECTED leaves only → `LeaveResponseDto` (leave.controller.ts:394-408).
