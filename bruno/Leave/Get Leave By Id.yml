info:
  name: Get Leave By Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/leave/{{leaveId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("leave dto", function () {
          expect(res.body.data._id).to.equal(bru.getVar("leaveId"));
          expect(res.body.data.statusName).to.equal("PENDING");
          expect(res.body.data.appliedUser).to.equal(bru.getVar("driverUserId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      PENDING/APPROVED/REJECTED leaves only → `LeaveResponseDto` (leave.controller.ts:394-408).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Leave/Get Leave By Id/Get Leave By Id - 200.yml
    request:
      url: "{{baseUrl}}/leave/{{leaveId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "_id": "6650a1b2c3d4e5f6a7b8f001",
              "startDate": "2437-01-11T00:00:00.000Z",
              "endDate": "2437-01-12T00:00:00.000Z",
              "dateCount": 2,
              "reason": "Bruno test leave (updated)",
              "status": 1,
              "statusName": "PENDING",
              "appliedUser": "6650a1b2c3d4e5f6a7b8c003",
              "appliedUserName": "Ruwan Bandara",
              "appliedUserRole": "",
              "availableLeaveCount": "",
              "approveBy": null,
              "approvedUser": "",
              "approveDate": null,
              "approveRemark": "",
              "rejectBy": null,
              "rejectedUser": "",
              "rejectDate": null,
              "rejectReason": "",
              "isMonthEndDone": false,
              "createdBy": "6650a1b2c3d4e5f6a7b8c003",
              "createdUser": "Ruwan Bandara",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c003",
              "updatedUser": "Ruwan Bandara",
              "createdAt": "2026-11-18T08:31:00.120Z",
              "updatedAt": "2026-11-18T08:31:01.340Z"
            }
          }
  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. leave.route.ts:42-46.

      Auth: none (no Authorization header)

      Source scenario: Leave/Get Leave By Id/Get Leave By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/leave/{{leaveId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 cancelled leave
    description: |-
      CANCELLED is not readable (leave.controller.ts:397-403).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Leave/State Checks/Get Leave By Id - 404 cancelled leave.yml
    request:
      url: "{{baseUrl}}/leave/{{cancelLeaveId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Leave not found!",
            "data": null
          }
  - name: 404 not found
    description: |-
      leave.controller.ts:403.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Leave/Get Leave By Id/Get Leave By Id - 404 not found.yml
    request:
      url: "{{baseUrl}}/leave/{{nonExistingId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Leave not found!",
            "data": null
