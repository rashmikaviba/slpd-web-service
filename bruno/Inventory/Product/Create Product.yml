info:
  name: Create Product
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/inventory/product"
  body:
    type: json
    data: |-
      {
        "productName": "{{productName}}",
        "productShortCode": "{{productShortCode}}",
        "measureUnit": 13,
        "isReturnableProduct": false,
        "unitPrice": 250,
        "description": "Bruno main product (kg)"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const ts = Date.now();
        bru.setVar("productName", "Bruno Rice " + ts);
        bru.setVar("productShortCode", "BR" + ts);
    - type: after-response
      code: if (res.status === 201) bru.setVar("productId", res.body.data._id);
    - type: tests
      code: |-
        test("stock starts at 0", function () {
          expect(res.body.data.inventory).to.equal(0);
          expect(res.body.data.status).to.equal(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Product saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 kg product
    description: |-
      Creates the main product (measure unit 13 = kg, non-returnable, 250/kg). Stores `{{productId}}`, `{{productName}}`, `{{productShortCode}}`.
      Used by GRN (stock in) and POS (stock out). Roles: SUPERADMIN, ADMIN. `src/modules/inventory/product/product.controller.ts:16` — responds 201 with the raw document.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Create Product - 201 kg product.yml
    request:
      url: "{{baseUrl}}/inventory/product"
      method: POST
      body:
        type: json
        data: |-
          {
            "productName": "{{productName}}",
            "productShortCode": "{{productShortCode}}",
            "measureUnit": 13,
            "isReturnableProduct": false,
            "unitPrice": 250,
            "description": "Bruno main product (kg)"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Product saved successfully!",
            "data": {
              "_id": "6731f0a2b4c5d6e7f8a9b0c1",
              "productName": "Bruno Rice 1794990600000",
              "productShortCode": "BR1794990600000",
              "measureUnit": 13,
