    description: |-
      [KNOWN BUG] `product.service.ts:24,30` interpolates user input into `$regex` without escaping.
      Name `(` makes MongoDB fail with an invalid-regex error -> no `statusCode` -> 500 (message is the raw Mongo error text, not asserted).
      Names like `Coke (1L)` silently bypass the duplicate check. Fix: escape regex metacharacters (or use collation equality).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Create Product - 500 regex-unsafe name.yml
