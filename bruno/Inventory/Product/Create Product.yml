            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Regular expression is invalid: missing closing parenthesis",
            "data": null
          }

docs: |-
  **POST `/api/v1/inventory/product`**

  This request runs the main scenario **201 kg product**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
