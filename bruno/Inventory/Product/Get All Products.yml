docs: |-
  **GET `/api/v1/inventory/product`**

  This request runs the main scenario **200 active only**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 active only | (empty) |
  | 2 | 200 | 200 with inactive | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |

  ## Main scenario notes

  Any authenticated role (`authorize([])`). Returns ACTIVE products as `ProductResponseDto` (stock converted from SI to product unit). Cached under `product-`. `src/modules/inventory/product/product.controller.ts:243`
