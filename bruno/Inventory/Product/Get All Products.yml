info:
  name: Get All Products
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/inventory/product"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("contains productId with converted stock", function () {
          const p = res.body.data.find((x) => x._id === bru.getVar("productId"));
          expect(p).to.exist;
          expect(p.measureUnitDetails.code).to.equal("kg");
          expect(p.statusName).to.equal("ACTIVE");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 active only
    description: |-
      Any authenticated role (`authorize([])`). Returns ACTIVE products as `ProductResponseDto` (stock converted from SI to product unit). Cached under `product-`. `src/modules/inventory/product/product.controller.ts:243`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Get All Products - 200 active only.yml
