  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 200 | 200 undefined for unknown id | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid id | No item found with ID " |

  ## Main scenario notes

  Any role. Returns `inventoryLogs` sorted newest first (empty until GRN approval / POS). `src/modules/inventory/product/product.controller.ts:260`
