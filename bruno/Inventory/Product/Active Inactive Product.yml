info:
  name: Active Inactive Product
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/inventory/product/activeInactive/{{tempProductId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Product inactivated successfully!
    - expression: res.body.data.status
      operator: eq
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 inactivate
    description: |-
      Toggles ACTIVE -> INACTIVE on `{{tempProductId}}`. SUPERADMIN, ADMIN. `src/modules/inventory/product/product.controller.ts:161`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Active Inactive Product - 200 inactivate.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{tempProductId}}"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Product inactivated successfully!",
            "data": {
              "_id": "6731f0a2b4c5d6e7f8a9b0c2",
              "productName": "Bruno Temp 1794990601",
              "productShortCode": "BT1794990601",
              "measureUnit": 1,
              "isReturnableProduct": true,
              "unitPrice": 100,
              "description": "",
              "inventory": 0,
              "inventoryLogs": [],
              "status": 2,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "createdAt": "2026-11-18T08:30:01.230Z",
              "updatedAt": "2026-11-18T08:30:05.310Z"
            }
          }
  - name: 200 activate
    description: |-
      Second toggle: INACTIVE -> ACTIVE. `src/modules/inventory/product/product.controller.ts:161`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Active Inactive Product - 200 activate.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{tempProductId}}"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Product activated successfully!",
            "data": {
              "_id": "6731f0a2b4c5d6e7f8a9b0c2",
              "productName": "Bruno Temp 1794990601",
              "productShortCode": "BT1794990601",
              "measureUnit": 1,
              "isReturnableProduct": true,
              "unitPrice": 100,
              "description": "",
              "inventory": 0,
              "inventoryLogs": [],
              "status": 1,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "updatedBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "createdAt": "2026-11-18T08:30:01.230Z",
              "updatedAt": "2026-11-18T08:30:05.720Z"
            }
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Inventory/Product/Active Inactive Product - 401 no token.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{tempProductId}}"
      method: PUT
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 wrong role
    description: |-
      Route allows SUPERADMIN, ADMIN only; `{{driverToken}}` is rejected by `auth.middleware.ts` role check.

      Auth: bearer {{driverToken}}

      Source scenario: Inventory/Product/Active Inactive Product - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{tempProductId}}"
      method: PUT
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 not found
    description: |-
      `src/modules/inventory/product/product.controller.ts:168` (message says 'for update').

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Active Inactive Product - 404 not found.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{nonExistingId}}"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Product not found for update!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `src/modules/inventory/product/product.controller.ts:165`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Active Inactive Product - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/inventory/product/activeInactive/{{invalidId}}"
      method: PUT
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **PUT `/api/v1/inventory/product/activeInactive/:id`**

  This request runs the main scenario **200 inactivate**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 inactivate | Product inactivated successfully! |
  | 2 | 200 | 200 activate | Product activated successfully! |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 5 | 404 | 404 not found | Product not found for update! |
  | 6 | 404 | 404 invalid id | No item found with ID " |

  ## Main scenario notes

  Toggles ACTIVE -> INACTIVE on `{{tempProductId}}`. SUPERADMIN, ADMIN. `src/modules/inventory/product/product.controller.ts:161`
