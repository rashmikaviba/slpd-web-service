  - name: 200 null for unknown id
    description: |-
      Not-found is **not** a 404: handler returns 200 with `data: null` (`src/modules/inventory/product/product.controller.ts:152-159`, see Known issues).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Get Product By Id - 200 null for unknown id.yml
    request:
      url: "{{baseUrl}}/inventory/product/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Inventory/Product/Get Product By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/inventory/product/{{productId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `src/modules/inventory/product/product.controller.ts:156`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/Product/Get Product By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/inventory/product/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }
