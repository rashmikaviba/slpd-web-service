docs: |-
  **GET `/api/v1/inventory/product/:id`**

  This request runs the main scenario **200 stock after GRN approval**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 stock after GRN approval | (empty) |
  | 2 | 200 | 200 | (empty) |
  | 3 | 200 | 200 null for unknown id | (empty) |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 404 | 404 invalid id | No item found with ID " |
  | 6 | 200 | Get Product - 200 setup read measure unit (Trip setup) | (empty) |
  | 7 | 200 | 200 stock before negative sale (POS setup) | (empty) |
  | 8 | 200 | Get Product - 200 setup read measure unit (Trip setup) #2 | (empty) |
  | 9 | 200 | 200 stock increased by negative sale (POS setup) | (empty) |

  ## Main scenario notes

  Helper check: product stock (SI grams) was increased by the approved GRN. Precondition: `Approve GRN - 201`.
