info:
  name: Get Product By Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/inventory/product/{{productId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("stock includes GRN qty and a GRN_APPROVED log", function () {
          expect(res.body.data.inventory).to.be.at.least(50000);
          expect(res.body.data.inventoryLogs.some((l) => l.inventoryLogType === 1)).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 stock after GRN approval
    description: |-
      Helper check: product stock (SI grams) was increased by the approved GRN. Precondition: `Approve GRN - 201`.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/Get Product By Id - 200 stock after GRN approval.yml
    request:
      url: "{{baseUrl}}/inventory/product/{{productId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
