info:
  name: Create GRN
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/inventory/grn"
  body:
    type: json
    data: |-
      {
        "grnRemarks": "Bruno GRN to approve",
        "products": [
          {
            "_id": "new",
            "productId": "{{productId}}",
            "enteredMeasureUnitId": 13,
            "quantity": 50,
            "remarks": "50 kg via Bruno"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: if (res.status === 201) bru.setVar("grnId", res.body.data._id);
    - type: tests
      code: |-
        test("pending, SI converted", function () {
          expect(res.body.data.status).to.equal(1);
          expect(res.body.data.products[0].siConvertedQuantity).to.equal(50000);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Good Receipt Note saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
      50 kg of `{{productId}}` -> `siConvertedQuantity` 50000 g. Each line needs a dummy `_id` string (ignored).
      Roles: SUPERADMIN, ADMIN, FINANCEOFFICER, TRIPMANAGER. Stores `{{grnId}}`. Stock unchanged until approval. `src/modules/inventory/grn/grn.controller.ts:23`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/Create GRN - 201.yml
    request:
      url: "{{baseUrl}}/inventory/grn"
      method: POST
      body:
        type: json
        data: |-
          {
            "grnRemarks": "Bruno GRN to approve",
            "products": [
              {
                "_id": "new",
                "productId": "{{productId}}",
                "enteredMeasureUnitId": 13,
                "quantity": 50,
                "remarks": "50 kg via Bruno"
              }
            ]
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Good Receipt Note saved successfully!",
            "data": {
              "_id": "6731f1a2b4c5d6e7f8a9b0d1",
              "grnNumber": 24,
              "grnNumberWithPrefix": "GRN-024",
              "grnDate": "2026-11-18T08:31:00.120Z",
              "grnRemarks": "Bruno GRN to approve",
              "products": [
                {
                  "productId": "6731f0a2b4c5d6e7f8a9b0c1",
                  "enteredMeasureUnitId": 13,
                  "actualMeasureUnitId": 13,
                  "siConvertedQuantity": 50000,
                  "quantity": 50,
                  "remarks": "50 kg via Bruno",
                  "_id": "6731f1a2b4c5d6e7f8a9b0d2"
                }
              ],
              "status": 1,
              "createdBy": "6650a1b2c3d4e5f6a7b8c9d0",
              "approvedBy": null,
              "rejectedBy": null,
              "approvedDate": null,
