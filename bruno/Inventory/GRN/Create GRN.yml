docs: |-
  **POST `/api/v1/inventory/grn`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Good Receipt Note saved successfully! |
  | 2 | 201 | 201 to reject | Good Receipt Note saved successfully! |
  | 3 | 201 | 201 stays pending | Good Receipt Note saved successfully! |
  | 4 | 400 | 400 grnRemarks too long | GRN Remarks should not be more than 500 characters |
  | 5 | 400 | 400 grnRemarks not a string | GRN Remarks is invalid |
  | 6 | 400 | 400 line missing _id | Id is required |
  | 7 | 400 | 400 line _id not a string | Id is invalid |
  | 8 | 400 | 400 line missing productId | Product is required |
  | 9 | 400 | 400 line productId not a string | Product is invalid |
  | 10 | 400 | 400 line missing enteredMeasureUnitId | Unit is required |
  | 11 | 400 | 400 line enteredMeasureUnitId not a number | Unit is invalid |
  | 12 | 400 | 400 line missing quantity | Quantity is required |
  | 13 | 400 | 400 line quantity not a number | Quantity is invalid |
  | 14 | 400 | 400 line remarks too long | Remarks should not be more than 500 characters |
  | 15 | 400 | 400 line remarks not a string | Remarks is invalid |
  | 16 | 400 | 400 unknown field | "foo" is not allowed |
  | 17 | 400 | 400 empty products | Please add at least one product to proceed! |
  | 18 | 401 | 401 no token | Authentication invalid! |
  | 19 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 20 | 404 | 404 product not found | Selected product not found! |
  | 21 | 404 | 404 deleted product | Selected product not found! |
  | 22 | 404 | 404 invalid product id | No item found with ID " |
  | 23 | 500 | 500 products omitted | Cannot read properties of undefined (reading 'length') |

  ## Main scenario notes

  50 kg of `{{productId}}` -> `siConvertedQuantity` 50000 g. Each line needs a dummy `_id` string (ignored).
  Roles: SUPERADMIN, ADMIN, FINANCEOFFICER, TRIPMANAGER. Stores `{{grnId}}`. Stock unchanged until approval. `src/modules/inventory/grn/grn.controller.ts:23`
