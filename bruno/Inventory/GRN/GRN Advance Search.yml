docs: |-
  **POST `/api/v1/inventory/grn/advanceSearch`**

  This request runs the main scenario **200 all statuses**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 all statuses | (empty) |
  | 2 | 200 | 200 string status matches nothing | (empty) |
  | 3 | 400 | 400 missing startDate | Start Date is required! |
  | 4 | 400 | 400 invalid startDate | Start Date is invalid! |
  | 5 | 400 | 400 missing endDate | End Date is required |
  | 6 | 400 | 400 invalid endDate | End Date is invalid |
  | 7 | 400 | 400 missing status | Status is required |
  | 8 | 400 | 400 status not a number | Status is invalid |
  | 9 | 401 | 401 no token | Authentication invalid! |
  | 10 | 403 | 403 wrong role | You're unauthorized to access this resource! |

  ## Main scenario notes

  `status: -1` = PENDING+APPROVED+REJECTED (CANCELLED excluded). Day range uses server local time; `{{today}}` set in pre-request. Cached under `grn-`. `src/modules/inventory/grn/grn.controller.ts:350`, `grn.service.ts:30`
