  - name: 200 string status matches nothing
    description: |-
      [KNOWN BUG] `"-1"` passes Joi (converted for validation only) but the service compares the raw body value
      `status === -1` (`grn.service.ts:37`), so it searches status `"-1"` and returns `[]` even though today's GRNs exist.
      Precondition: GRNs created today by earlier requests; `grn-` cache cleared by the last GRN save.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/GRN Advance Search - 200 string status matches nothing.yml
    request:
      url: "{{baseUrl}}/inventory/grn/advanceSearch"
      method: POST
