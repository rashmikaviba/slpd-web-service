info:
  name: GRN Advance Search
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/inventory/grn/advanceSearch"
  body:
    type: json
    data: |-
      {
        "startDate": "{{today}}",
        "endDate": "{{today}}",
        "status": -1
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        bru.setVar("today", d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()));
    - type: tests
      code: |-
        test("contains approved and rejected GRNs", function () {
          const ids = res.body.data.map((g) => g._id);
          expect(ids).to.include(bru.getVar("grnId"));
          expect(ids).to.include(bru.getVar("rejectGrnId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 all statuses
    description: |-
      `status: -1` = PENDING+APPROVED+REJECTED (CANCELLED excluded). Day range uses server local time; `{{today}}` set in pre-request. Cached under `grn-`. `src/modules/inventory/grn/grn.controller.ts:350`, `grn.service.ts:30`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/GRN Advance Search - 200 all statuses.yml
    request:
      url: "{{baseUrl}}/inventory/grn/advanceSearch"
      method: POST
      body:
        type: json
        data: |-
          {
            "startDate": "{{today}}",
            "endDate": "{{today}}",
            "status": -1
