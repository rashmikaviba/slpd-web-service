docs: |-
  **PUT `/api/v1/inventory/grn/:id`**

  This request runs the main scenario **400 always fails**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 400 | 400 always fails | Quantity is required |
  | 2 | 400 | 400 line missing productId | Product is required |
  | 3 | 400 | 400 empty products | Please add at least one product to proceed! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 6 | 404 | 404 not found | Pending Good Receipt Note not found for update! |
  | 7 | 404 | 404 invalid id | No item found with ID " |
  | 8 | 404 | 404 not pending | Pending Good Receipt Note not found for update! |
  | 9 | 404 | 404 product not found | Selected product not found! |

  ## Main scenario notes

  [KNOWN BUG] A perfectly valid update on a PENDING GRN. `src/modules/inventory/grn/grn.controller.ts:123-129` builds lines with `product.enteredUnitId` (field is
  `enteredMeasureUnitId`) and omits `quantity`, so Mongoose validation fails -> error middleware 400 with 'Unit is required' / 'Quantity is required'.
  Expected after fix: 201 'Good Receipt Note updated successfully!'.
