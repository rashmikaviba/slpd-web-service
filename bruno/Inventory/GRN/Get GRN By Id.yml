info:
  name: Get GRN By Id
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/inventory/grn/{{grnId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("dto", function () {
          expect(res.body.data._id).to.equal(bru.getVar("grnId"));
          expect(res.body.data.products[0].measureUnit.code).to.equal("kg");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      SUPERADMIN, ADMIN, FINANCEOFFICER, TRIPMANAGER. `src/modules/inventory/grn/grn.controller.ts:338`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/Get GRN By Id - 200.yml
    request:
      url: "{{baseUrl}}/inventory/grn/{{grnId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "_id": "6731f1a2b4c5d6e7f8a9b0d1",
              "grnNumberWithPrefix": "GRN-024",
              "grnDate": "2026-11-18T08:31:00.120Z",
              "grnRemarks": "Bruno GRN to approve",
              "products": [
                {
                  "_id": "6731f1a2b4c5d6e7f8a9b0d2",
                  "productName": "Bruno Rice 1794990600000",
                  "productId": "6731f0a2b4c5d6e7f8a9b0c1",
                  "quantity": 50,
                  "remarks": "50 kg via Bruno",
                  "enteredMeasureUnitId": 13,
                  "measureUnit": {
                    "unitId": 13,
                    "code": "kg",
                    "name": "Kilogram",
                    "conversionToSi": 1000,
                    "isSaveWithSiUnit": true,
                    "isSiUnit": false,
                    "isAllowDecimal": true,
                    "categoryId": 2
                  }
                }
              ],
              "status": 1
            }
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: Inventory/GRN/Get GRN By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/inventory/grn/{{grnId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 wrong role
    description: |-
      Route allows SUPERADMIN, ADMIN, FINANCEOFFICER, TRIPMANAGER only; `{{driverToken}}` is rejected by `auth.middleware.ts` role check.

      Auth: bearer {{driverToken}}

      Source scenario: Inventory/GRN/Get GRN By Id - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/inventory/grn/{{grnId}}"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 not found
    description: |-
      `src/modules/inventory/grn/grn.controller.ts:344`

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/Get GRN By Id - 404 not found.yml
    request:
      url: "{{baseUrl}}/inventory/grn/{{nonExistingId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Good Receipt Note not found!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      `src/modules/inventory/grn/grn.controller.ts:341`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Inventory/GRN/Get GRN By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/inventory/grn/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **GET `/api/v1/inventory/grn/:id`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 401 | 401 no token | Authentication invalid! |
  | 3 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 4 | 404 | 404 not found | Good Receipt Note not found! |
  | 5 | 404 | 404 invalid id | No item found with ID " |

  ## Main scenario notes

  SUPERADMIN, ADMIN, FINANCEOFFICER, TRIPMANAGER. `src/modules/inventory/grn/grn.controller.ts:338`
