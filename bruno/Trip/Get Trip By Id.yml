info:
  name: Get Trip By Id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/trip/{{otherDriverTripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("driver-assistant user appears twice in drivers[]", function () {
          const d = res.body.data.drivers;
          expect(d.length).to.equal(3);
          expect(d.filter((x) => x.driver === bru.getVar("driverAssistantUserId")).length).to.equal(2);
          expect(d.filter((x) => x.isActive).length).to.equal(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

