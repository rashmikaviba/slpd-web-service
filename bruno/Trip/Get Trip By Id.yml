            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Trip not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header → `authorize()` throws UnauthorizedError (src/middleware/auth.middleware.ts:24-26).

      Auth: none (no Authorization header)

      Source scenario: Trip/Get Trip By Id/Get Trip By Id - 401 no token.yml
    request:
      url: "{{baseUrl}}/trip/{{tripId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches `Trip.findOne({_id})` → Mongoose CastError → error middleware returns 404 (src/middleware/error.middleware.ts, CastError branch). Controller: src/modules/trip/trip.controller.ts:560.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Trip By Id/Get Trip By Id - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/trip/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/trip/:id`**

  This request runs the main scenario **200 [KNOWN BUG] duplicate driver entries**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip | (empty) |
  | 2 | 200 | 200 as driver | (empty) |
  | 3 | 200 | 200 [KNOWN BUG] duplicate driver entries | (empty) |
  | 4 | 400 | 400 not found | Trip not found! |
  | 5 | 400 | 400 canceled trip | Trip not found! |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [KNOWN BUG] Verification of the duplicate push. Expected after fix: 2 entries, driver-assistant re-activated.
