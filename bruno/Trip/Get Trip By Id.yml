    description: |-
      src/modules/trip/trip.controller.ts:566-568. Same message for CANCELED trips (see Cancel Trip folder).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Trip By Id/Get Trip By Id - 400 not found.yml
    request:
      url: "{{baseUrl}}/trip/{{nonExistingId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Trip not found!",
            "data": null
          }
  - name: 400 canceled trip
    description: |-
      Verification: CANCELED trips are invisible to getTripById (src/modules/trip/trip.controller.ts:560-568).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Cancel Trip/Get Trip By Id - 400 canceled trip.yml
    request:
      url: "{{baseUrl}}/trip/{{canceledTripId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
