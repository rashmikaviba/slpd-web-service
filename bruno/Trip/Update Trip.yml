docs: |-
  **PUT `/api/v1/trip/:id`**

  This request runs the main scenario **200 main trip keeps reached place**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip keeps reached place | Trip Updated Successfully |
  | 2 | 200 | 200 [KNOWN BUG] empty places wipes reached place on finished trip | Trip Updated Successfully |
  | 3 | 400 | 400 change reached place | Can not update reached place! |
  | 4 | 400 | 400 delete reached place | Can not delete reached place! |
  | 5 | 400 | 400 delete paid activity | Cannot delete activity Whale watching, because payment is already done! |
  | 6 | 400 | 400 paid activity no longer company paid | Cannot update activity Whale watching as not payment by company, because payment is already done! |
  | 7 | 400 | 400 delete paid hotel | Cannot delete hotel Cinnamon Grand, because payment is already done! |
  | 8 | 400 | 400 paid hotel no longer company paid | Cannot update hotel Cinnamon Grand as not payment by company, because payment is already done! |
  | 9 | 400 | 400 duplicate trip confirmed number | This trip confirmed number already used in another trip! |
  | 10 | 400 | 400 canceled trip | Trip not found! |
  | 11 | 400 | 400 not found | Trip not found! |
  | 12 | 400 | 400 missing tripConfirmedNumber | Trip Confirmed Number is required |
  | 13 | 400 | 400 invalid email | Email is invalid |
  | 14 | 400 | 400 missing places | Places are required |
  | 15 | 401 | 401 no token | Authentication invalid! |
  | 16 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 17 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Places sent unchanged (same description and ISO dates) → saved subdocs kept, including the reached one (src/modules/trip/trip.controller.ts:352-412).
