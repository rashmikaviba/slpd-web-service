runtime:
  scripts:
    - type: before-request
      code: |-
        // body dates: today (UTC midnight) .. +3 days; list range: yesterday .. +7 days
        const day0 = new Date();
        day0.setUTCHours(0, 0, 0, 0);
        const iso = (n) => new Date(day0.getTime() + n * 86400000).toISOString();
        bru.setVar("tripStartDate", iso(0));
        bru.setVar("tripDay2", iso(1));
        bru.setVar("tripDay3", iso(2));
        bru.setVar("tripEndDate", iso(3));
        bru.setVar("listFrom", iso(-1).slice(0, 10));
        bru.setVar("listTo", iso(7).slice(0, 10));
        let b = req.getBody();
        if (typeof b === "string") b = JSON.parse(b);
        b.places = JSON.parse(bru.getVar("mainPlacesJson"));
        req.setBody(b);
    - type: tests
      code: |-
        test("reached place 1 is preserved", function () {
          const p = res.body.data.places.find((x) => x._id === bru.getVar("mainPlace1Id"));
          expect(p.isReached).to.equal(true);
          expect(res.body.data.places.length).to.equal(3);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip Updated Successfully
    - expression: res.body.data.contactPerson
      operator: eq
      value: Bruno Updated

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

