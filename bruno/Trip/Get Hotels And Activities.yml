info:
  name: Get Hotels And Activities
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/trip/hotelsAndActivities/{{paymentTripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("one company-paid hotel and activity", function () {
          expect(res.body.data.hotels.map((h) => h._id)).to.eql([bru.getVar("payHotel1Id")]);
          expect(res.body.data.activities.map((a) => a._id)).to.eql([bru.getVar("payActivity1Id")]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 only company-paid items
    description: |-
      Filters hotels/activities by isPaymentByCompany === true (src/modules/trip/trip.controller.ts:1408-1416).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Hotels And Activities/Get Hotels And Activities - 200 only company-paid items.yml
    request:
      url: "{{baseUrl}}/trip/hotelsAndActivities/{{paymentTripId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "hotels": [
                {
                  "dates": "2026-11-18T00:00:00.000Z, 2026-11-19T00:00:00.000Z",
                  "hotelName": "Cinnamon Grand",
                  "city": "Colombo",
                  "isPaymentByCompany": true,
                  "isPaymentDone": false,
                  "paymentAmount": 0,
                  "paymentDate": null,
                  "paymentRemark": "",
                  "updatedBy": null,
                  "paymentMode": "0",
                  "receiptImageUrl": "",
                  "_id": "6651b2c3d4e5f6a7b8c9e112"
                }
              ],
              "activities": [
                {
                  "date": "2026-11-19T00:00:00.000Z",
                  "description": "Whale watching",
                  "adultCount": 2,
                  "childCount": 0,
                  "totalCost": 120,
                  "isPaymentByCompany": true,
                  "isPaymentDone": false,
                  "paymentAmount": 0,
                  "paymentDate": null,
                  "paymentRemark": "",
                  "updatedBy": null,
                  "paymentMode": "0",
                  "receiptImageUrl": "",
                  "_id": "6651b2c3d4e5f6a7b8c9e110"
                }
              ]
            }
          }
  - name: 200 [KNOWN BUG] unknown trip returns empty lists
    description: |-
      [KNOWN BUG] Unknown/cancelled trip id → 200 with empty lists instead of an error (src/modules/trip/trip.controller.ts:1403-1418, Document/trip.md Known issue 16).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Hotels And Activities/Get Hotels And Activities - 200 [KNOWN BUG] unknown trip returns empty lists.yml
    request:
      url: "{{baseUrl}}/trip/hotelsAndActivities/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": {
              "hotels": [],
              "activities": []
            }
          }
  - name: 401 no token
    description: |-
      No Authorization header → `authorize()` throws UnauthorizedError (src/middleware/auth.middleware.ts:24-26).

      Auth: none (no Authorization header)

      Source scenario: Trip/Get Hotels And Activities/Get Hotels And Activities - 401 no token.yml
    request:
      url: "{{baseUrl}}/trip/hotelsAndActivities/{{paymentTripId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches `Trip.findOne({_id})` → Mongoose CastError → error middleware returns 404 (src/middleware/error.middleware.ts, CastError branch). Controller: src/modules/trip/trip.controller.ts:1397.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Hotels And Activities/Get Hotels And Activities - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/trip/hotelsAndActivities/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/trip/hotelsAndActivities/:id`**

  This request runs the main scenario **200 only company-paid items**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 only company-paid items | (empty) |
  | 2 | 200 | 200 [KNOWN BUG] unknown trip returns empty lists | (empty) |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Filters hotels/activities by isPaymentByCompany === true (src/modules/trip/trip.controller.ts:1408-1416).
