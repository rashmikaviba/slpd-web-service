docs: |-
  **GET `/api/v1/trip`**

  This request runs the main scenario **200 default (pending, started, finished)**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 default (pending, started, finished) | (empty) |
  | 2 | 200 | 200 status pending | (empty) |
  | 3 | 200 | 200 status started | (empty) |
  | 4 | 200 | 200 status finished without driver salary | (empty) |
  | 5 | 200 | 200 status finished with driver salary | (empty) |
  | 6 | 200 | 200 unsupported status returns empty list | (empty) |
  | 7 | 200 | 200 driver sees own trips | (empty) |
  | 8 | 200 | 200 finance officer gets empty list | (empty) |
  | 9 | 401 | 401 no token | Authentication invalid! |
  | 10 | 404 | 404 [KNOWN BUG] missing date range | No item found with ID "Invalid Date"! |

  ## Main scenario notes

  status defaults to -1 → PENDING, START, FINISHED whose startDate or endDate is in range (trip.service.ts:27-56). Sorted by status priority then startDate (src/modules/trip/trip.controller.ts:673-684).
