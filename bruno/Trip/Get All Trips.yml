info:
  name: Get All Trips
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/trip?startDate={{listFrom}}&endDate={{listTo}}"
  params:
    - name: startDate
      value: "{{listFrom}}"
      type: query
    - name: endDate
      value: "{{listTo}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // body dates: today (UTC midnight) .. +3 days; list range: yesterday .. +7 days
        const day0 = new Date();
        day0.setUTCHours(0, 0, 0, 0);
        const iso = (n) => new Date(day0.getTime() + n * 86400000).toISOString();
        bru.setVar("tripStartDate", iso(0));
        bru.setVar("tripDay2", iso(1));
        bru.setVar("tripDay3", iso(2));
        bru.setVar("tripEndDate", iso(3));
        bru.setVar("listFrom", iso(-1).slice(0, 10));
        bru.setVar("listTo", iso(7).slice(0, 10));
    - type: tests
      code: |-
        test("returns an array", function () {
          expect(res.body.data).to.be.an("array");
        });

        test("main trip is listed", function () {
          expect(res.body.data.map((t) => t.id)).to.include(bru.getVar("tripId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 default (pending, started, finished)
    description: |-
      status defaults to -1 → PENDING, START, FINISHED whose startDate or endDate is in range (trip.service.ts:27-56). Sorted by status priority then startDate (src/modules/trip/trip.controller.ts:673-684).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get All Trips/Get All Trips - 200 default (pending, started, finished).yml
    request:
      url: "{{baseUrl}}/trip?startDate={{listFrom}}&endDate={{listTo}}"
