docs: |-
  **PUT `/api/v1/trip/:tripId/markAsReached/:placeId`**

  This request runs the main scenario **200 main trip place 1**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip place 1 | Place marked as reached successfully! |
  | 2 | 200 | 200 finish trip place 1 | Place marked as reached successfully! |
  | 3 | 400 | 400 place already reached | Place already reached! |
  | 4 | 400 | 400 mileage not greater than vehicle mileage | Current mileage should be greater than previous mileage! |
  | 5 | 400 | 400 place not found | Place not found! |
  | 6 | 400 | 400 trip not started | Started trip not found! |
  | 7 | 400 | 400 no active driver | No active driver found! |
  | 8 | 400 | 400 caller is not the active driver | Only active driver can update place as reached! |
  | 9 | 400 | 400 selected vehicle not active | Selected vehicle not found! |
  | 10 | 400 | 400 missing currentMilage | Current milage is required |
  | 11 | 400 | 400 currentMilage not number | currentMilage is invalid |
  | 12 | 400 | 400 lat not number | lat is invalid |
  | 13 | 400 | 400 lng not number | lng is invalid |
  | 14 | 400 | 400 location not object | "location" must be of type object |
  | 15 | 400 | 400 unknown field | "foo" is not allowed |
  | 16 | 401 | 401 no token | Authentication invalid! |
  | 17 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 18 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |
  | 19 | 500 | 500 [KNOWN BUG] trip without active vehicle | Cannot read properties of undefined (reading 'vehicle') |

  ## Main scenario notes

  Active driver = caller, place found, mileage > vehicle mileage → place reached, vehicle odometer advanced (src/modules/trip/trip.controller.ts:1218-1244). Freelance vehicle: no mileage check, distance 0 (src/modules/trip/trip.controller.ts:1210-1217).
