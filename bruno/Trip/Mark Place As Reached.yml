info:
  name: Mark Place As Reached
  type: http
  seq: 12

http:
  method: PUT
  url: "{{baseUrl}}/trip/{{tripId}}/markAsReached/{{mainPlace1Id}}"
  body:
    type: json
    data: |-
      {
        "location": {
          "lat": 7.2906,
          "lng": 80.6337
        },
        "currentMilage": {{nextMilage}}
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const m = Number(bru.getVar("vehicleMileage") || 0) + 10;
        bru.setVar("nextMilage", m);
    - type: after-response
      code: if (res.status === 200) bru.setVar("vehicleMileage", bru.getVar("nextMilage"));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Place marked as reached successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 main trip place 1
    description: |-
      Active driver = caller, place found, mileage > vehicle mileage → place reached, vehicle odometer advanced (src/modules/trip/trip.controller.ts:1218-1244). Freelance vehicle: no mileage check, distance 0 (src/modules/trip/trip.controller.ts:1210-1217).

      Auth: bearer {{driverToken}}

      Source scenario: Trip/Mark Place As Reached/Mark Place As Reached - 200 main trip place 1.yml
    request:
      url: "{{baseUrl}}/trip/{{tripId}}/markAsReached/{{mainPlace1Id}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "location": {
              "lat": 7.2906,
              "lng": 80.6337
            },
            "currentMilage": {{nextMilage}}
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Place marked as reached successfully!",
            "data": null
          }
  - name: 200 finish trip place 1
    description: |-
      Reached place on the finish trip; later wiped by the Update Trip [KNOWN BUG] places: [] request.

