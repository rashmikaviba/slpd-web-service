info:
  name: Get Trip For Print
  type: http
  seq: 13

http:
  method: GET
  url: "{{baseUrl}}/trip/tripForPrint/{{undoTripId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data.expenses
      operator: isNull
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 with expenses
    description: |-
      Main trip is START → Expenses header exists → mapped TripExpensesResponseDto (src/modules/trip/trip.controller.ts:1283-1317).

