docs: |-
  **GET `/api/v1/trip/tripForPrint/:id`**

  This request runs the main scenario **200 [KNOWN BUG] expenses gone after undo**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 with expenses | (empty) |
  | 2 | 200 | 200 driver without expenses | (empty) |
  | 3 | 200 | 200 [KNOWN BUG] unknown trip returns null | (empty) |
  | 4 | 200 | 200 [KNOWN BUG] expenses gone after undo | (empty) |
  | 5 | 401 | 401 no token | Authentication invalid! |
  | 6 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [KNOWN BUG] Verification: no ACTIVE Expenses header remains for the trip (src/modules/trip/trip.controller.ts:1286-1316).
