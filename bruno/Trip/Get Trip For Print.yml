  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches `Trip.findOne({_id})` → Mongoose CastError → error middleware returns 404 (src/middleware/error.middleware.ts, CastError branch). Controller: src/modules/trip/trip.controller.ts:1271.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Trip For Print/Get Trip For Print - 404 invalid id.yml
