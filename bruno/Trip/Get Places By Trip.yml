info:
  name: Get Places By Trip
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/trip/places/{{tripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("place 1 reached", function () {
          expect(res.body.data.length).to.equal(3);
          expect(res.body.data[0].isReached).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 main trip
    description: |-
      Places mapped to TripPlaceResponseDto with reachedBy populated (trip.service.ts:94-104, trip.util.ts).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Places By Trip/Get Places By Trip - 200 main trip.yml
    request:
      url: "{{baseUrl}}/trip/places/{{tripId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": [
              {
                "description": "Kandy",
                "dates": [
                  "2026-11-18T00:00:00.000Z"
                ],
                "isReached": true,
