  - name: 200 [KNOWN BUG] reached place gone
    description: |-
      [KNOWN BUG] Verification of the wipe.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Update Trip/Get Places By Trip - 200 [KNOWN BUG] reached place gone.yml
    request:
      url: "{{baseUrl}}/trip/places/{{finishedTripId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": []
          }
  - name: 400 not found
    description: |-
      src/modules/trip/trip.controller.ts:1133-1135.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Places By Trip/Get Places By Trip - 400 not found.yml
    request:
      url: "{{baseUrl}}/trip/places/{{nonExistingId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Invalid trip!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header → `authorize()` throws UnauthorizedError (src/middleware/auth.middleware.ts:24-26).

      Auth: none (no Authorization header)

      Source scenario: Trip/Get Places By Trip/Get Places By Trip - 401 no token.yml
    request:
      url: "{{baseUrl}}/trip/places/{{tripId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches `Trip.findOne({_id})` → Mongoose CastError → error middleware returns 404 (src/middleware/error.middleware.ts, CastError branch). Controller: src/modules/trip/trip.controller.ts:1127.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Places By Trip/Get Places By Trip - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/trip/places/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/trip/places/:id`**

  This request runs the main scenario **200 main trip**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip | (empty) |
  | 2 | 200 | 200 [KNOWN BUG] reached place gone | (empty) |
  | 3 | 400 | 400 not found | Invalid trip! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Places mapped to TripPlaceResponseDto with reachedBy populated (trip.service.ts:94-104, trip.util.ts).
