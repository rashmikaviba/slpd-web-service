info:
  name: Get Trip For QR Code
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/trip/tripForQrCode/{{tripId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("personal data exposed without a token", function () {
          expect(res.body.data.passengers.length).to.be.greaterThan(0);
          expect(res.body.data).to.have.property("phoneNumber");
          expect(res.body.data).to.have.property("totalCost");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.data._id
      operator: eq
      value: "{{tripId}}"
    - expression: res.body.data.email
      operator: eq
      value: guest@example.com
    - expression: res.body.data.expenses
      operator: isDefined
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
