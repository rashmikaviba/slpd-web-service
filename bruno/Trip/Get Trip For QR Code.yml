    description: |-
      [KNOWN BUG] 200 with null data (src/modules/trip/trip.controller.ts:1335, :1371; Known issue 16).

      Auth: none (no Authorization header)

      Source scenario: Trip/Get Trip For QR Code/Get Trip For QR Code - 200 [KNOWN BUG] unknown trip returns null.yml
    request:
      url: "{{baseUrl}}/trip/tripForQrCode/{{nonExistingId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "",
            "data": null
          }
  - name: 404 invalid id
    description: |-
      Malformed ObjectId reaches `Trip.findOne({_id})` → Mongoose CastError → error middleware returns 404 (src/middleware/error.middleware.ts, CastError branch). Controller: src/modules/trip/trip.controller.ts:1329.

      Auth: none (no Authorization header)

      Source scenario: Trip/Get Trip For QR Code/Get Trip For QR Code - 404 invalid id.yml
    request:
      url: "{{baseUrl}}/trip/tripForQrCode/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"not-an-object-id\"!",
            "data": null
          }

docs: |-
  **GET `/api/v1/trip/tripForQrCode/:id`**

  This request runs the main scenario **200 [KNOWN BUG] public endpoint returns full trip**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 [KNOWN BUG] public endpoint returns full trip | (empty) |
  | 2 | 200 | 200 [KNOWN BUG] unknown trip returns null | (empty) |
  | 3 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  [KNOWN BUG] No token needed; returns the whole trip (passengers, contact, costs) plus expenses/driver salaries to anyone with the id (src/modules/trip/trip.route.ts:135, Document/trip.md Known issue 3). Expected after fix: a reduced public DTO (or 401).
