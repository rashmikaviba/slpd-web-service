docs: |-
  **PUT `/api/v1/trip/:id/status/:status`**

  This request runs the main scenario **200 setup start other-driver trip**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 finish trip | Trip finished successfully! |
  | 2 | 200 | 200 start main trip | Trip started successfully! |
  | 3 | 200 | 200 undo by driver | Trip pending successfully! |
  | 4 | 200 | 200 start finish trip | Trip started successfully! |
  | 5 | 200 | 200 start undo trip | Trip started successfully! |
  | 6 | 200 | 200 start payment trip | Trip started successfully! |
  | 7 | 200 | 200 setup restart undo trip | Trip started successfully! |
  | 8 | 200 | 200 start trip without vehicle | Trip started successfully! |
  | 9 | 200 | 200 undo by admin | Trip pending successfully! |
  | 10 | 200 | 200 setup restart undo trip before expense | Trip started successfully! |
  | 11 | 200 | 200 setup start other-driver trip | Trip started successfully! |
  | 12 | 200 | 200 [KNOWN BUG] undo deletes expense when no driver salary | Trip pending successfully! |
  | 13 | 200 | 200 setup restart undo trip before expense request | Trip started successfully! |
  | 14 | 200 | 200 setup start no-driver trip | Trip started successfully! |
  | 15 | 400 | 400 finish already finished trip | Trip not found or not in start status! |
  | 16 | 400 | 400 finish pending trip | Trip not found or not in start status! |
  | 17 | 400 | 400 start trip not pending | Trip not found or not in pending status! |
  | 18 | 400 | 400 invalid status value | Invalid status! |
  | 19 | 400 | 400 finish without POS trip end audit | Unable to finish trip because the trip end POS audit is not completed! |
  | 20 | 400 | 400 driver cannot finish | You'r not allowed to change status to FINISHED! |
  | 21 | 400 | 400 finish month end done | Trip is already month end done! |
  | 22 | 400 | 400 driver cannot cancel | You'r not allowed to change status to CANCELED! |
  | 23 | 400 | 400 admin cannot start | You'r not allowed to change status to START! |
  | 24 | 400 | 400 admin cannot cancel | You'r not allowed to change status to CANCELED! |
  | 25 | 400 | 400 status 5 not allowed | You'r not allowed to change status to REACHED! |
  | 26 | 400 | 400 start month end done | Trip is already month end done! |
  | 27 | 400 | 400 undo after expense request (driver) | Can't change status to pending after expense request added! |
  | 28 | 400 | 400 undo after expense request (admin) | Can't change status to pending after expense request added! |
  | 29 | 400 | 400 undo after hotel payment | Can't change status to pending after hotel or activity payment done! |
  | 30 | 400 | 400 undo after place reached (admin) | Can't change status to pending after reached at least one place! |
  | 31 | 400 | 400 undo after place reached (driver) | Can't change status to pending after reached at least one place! |
  | 32 | 400 | 400 undo trip not started (driver) | Trip not found or not in start status! |
  | 33 | 400 | 400 undo trip not started (admin) | Trip not found or not in start status! |
  | 34 | 400 | 400 undo month end done (driver) | Trip is already month end done! |
  | 35 | 400 | 400 undo month end done (admin) | Trip is already month end done! |
  | 36 | 401 | 401 no token | Authentication invalid! |
  | 37 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 38 | 404 | 404 invalid trip id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Setup: driver starts `otherDriverTripId` (not their trip — no ownership check, src/modules/trip/trip.controller.ts:831-859) so the next requests hit the START branch.
