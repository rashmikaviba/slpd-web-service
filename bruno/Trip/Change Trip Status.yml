info:
  name: Change Trip Status
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/trip/{{otherDriverTripId}}/status/3"
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip started successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 finish trip
    description: |-
      START → FINISHED, endedBy = caller (src/modules/trip/trip.controller.ts:967-968). No POS on this trip.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Change Trip Status - Finish/Change Trip Status - 200 finish trip.yml
    request:
      url: "{{baseUrl}}/trip/{{finishedTripId}}/status/4"
      method: PUT
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Trip finished successfully!",
            "data": null
          }
  - name: 200 start main trip
    description: |-
      Driver starts the main trip (src/modules/trip/trip.controller.ts:832-859).

      Auth: bearer {{driverToken}}

      Source scenario: Trip/Change Trip Status - Start/Change Trip Status - 200 start main trip.yml
    request:
      url: "{{baseUrl}}/trip/{{tripId}}/status/3"
