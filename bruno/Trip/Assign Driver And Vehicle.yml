docs: |-
  **PUT `/api/v1/trip/assignDriver/:id`**

  This request runs the main scenario **200 main trip driver and vehicle**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip driver and vehicle | Driver and vehicle assigned successfully! |
  | 2 | 200 | 200 finish trip driver and vehicle | Driver and vehicle assigned successfully! |
  | 3 | 200 | 200 undo trip driver and vehicle | Driver and vehicle assigned successfully! |
  | 4 | 200 | 200 driver only | Driver assigned successfully! |
  | 5 | 200 | 200 vehicle only | Vehicle assigned successfully! |
  | 6 | 200 | 200 non-driver user as driver | Driver assigned successfully! |
  | 7 | 200 | 200 empty body is a no-op | Vehicle assigned successfully! |
  | 8 | 200 | 200 started trip adds new active driver | Driver assigned successfully! |
  | 9 | 200 | 200 [KNOWN BUG] re-assigning previous driver duplicates entry | Driver assigned successfully! |
  | 10 | 400 | 400 finished trip | Trip not found! |
  | 11 | 400 | 400 driverId not string | Driver Id is invalid |
  | 12 | 400 | 400 vehicleId not string | Vehicle Id is invalid |
  | 13 | 400 | 400 unknown field | "foo" is not allowed |
  | 14 | 400 | 400 trip not found | Trip not found! |
  | 15 | 400 | 400 driver not found | Driver not found! |
  | 16 | 400 | 400 vehicle not found | Vehicle not found! |
  | 17 | 401 | 401 no token | Authentication invalid! |
  | 18 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 19 | 404 | 404 invalid trip id | No item found with ID "not-an-object-id"! |
  | 20 | 404 | 404 invalid driver id | No item found with ID "not-an-object-id"! |
  | 21 | 404 | 404 invalid vehicle id | No item found with ID "not-an-object-id"! |
  | 22 | 500 | 500 [KNOWN BUG] started trip without active driver | Cannot read properties of undefined (reading 'driver') |

  ## Main scenario notes

  PENDING trip → drivers/vehicles replaced by a single active entry (src/modules/trip/trip.controller.ts:713-720, :762-769).
