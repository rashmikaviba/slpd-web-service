info:
  name: Assign Driver And Vehicle
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/trip/assignDriver/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "driverId": "{{driverUserId}}",
        "vehicleId": "{{vehicleId}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Driver and vehicle assigned successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 main trip driver and vehicle
    description: |-
      PENDING trip → drivers/vehicles replaced by a single active entry (src/modules/trip/trip.controller.ts:713-720, :762-769).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Assign Driver And Vehicle/Assign Driver And Vehicle - 200 main trip driver and vehicle.yml
    request:
      url: "{{baseUrl}}/trip/assignDriver/{{tripId}}"
      method: PUT
      body:
        type: json
        data: |-
          {
            "driverId": "{{driverUserId}}",
            "vehicleId": "{{vehicleId}}"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Driver and vehicle assigned successfully!",
            "data": null
          }
  - name: 200 finish trip driver and vehicle
    description: |-
