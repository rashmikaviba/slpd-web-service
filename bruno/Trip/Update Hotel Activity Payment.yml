docs: |-
  **PUT `/api/v1/trip/updateHotelActivityPayment/:id`**

  This request runs the main scenario **200 hotel paid**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 hotel paid | Hotel payment updated successfully! |
  | 2 | 200 | 200 activity paid | Activity payment updated successfully! |
  | 3 | 200 | 200 [KNOWN BUG] body without payment fields accepted | Hotel payment updated successfully! |
  | 4 | 400 | 400 [KNOWN BUG] empty body | Invalid request type! |
  | 5 | 400 | 400 [KNOWN BUG] numeric string type rejected | Invalid request type! |
  | 6 | 400 | 400 invalid type | Invalid request type! |
  | 7 | 400 | 400 hotel not found | Hotel not found! |
  | 8 | 400 | 400 hotel not paid by company | Selected hotel is not paid by company! |
  | 9 | 400 | 400 activity not found | Activity not found! |
  | 10 | 400 | 400 activity not paid by company | Selected activity is not paid by company! |
  | 11 | 400 | 400 trip not found | Trip not found! |
  | 12 | 400 | 400 month end done | Cannot update trip after month end! |
  | 13 | 401 | 401 no token | Authentication invalid! |
  | 14 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 15 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Marks hotel[0] isPaymentDone = true with the payment fields (src/modules/trip/trip.controller.ts:1446-1469). This payment later blocks undo and hotel edits.
