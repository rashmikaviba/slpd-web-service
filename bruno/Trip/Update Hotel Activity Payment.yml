info:
  name: Update Hotel Activity Payment
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/trip/updateHotelActivityPayment/{{paymentTripId}}"
  body:
    type: json
    data: |-
      {
        "objectId": "{{payHotel1Id}}",
        "paymentAmount": 25000,
        "paymentDate": "{{tripStartDate}}",
        "paymentRemark": "Paid by Bruno",
        "paymentMode": 1,
        "receiptImageUrl": "",
        "type": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // body dates: today (UTC midnight) .. +3 days; list range: yesterday .. +7 days
        const day0 = new Date();
        day0.setUTCHours(0, 0, 0, 0);
        const iso = (n) => new Date(day0.getTime() + n * 86400000).toISOString();
        bru.setVar("tripStartDate", iso(0));
        bru.setVar("tripDay2", iso(1));
        bru.setVar("tripDay3", iso(2));
        bru.setVar("tripEndDate", iso(3));
        bru.setVar("listFrom", iso(-1).slice(0, 10));
        bru.setVar("listTo", iso(7).slice(0, 10));
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Hotel payment updated successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
