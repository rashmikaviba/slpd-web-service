docs: |-
  **PUT `/api/v1/trip/checkList/:id`**

  This request runs the main scenario **200 setup re-save checklist**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 main trip | Answers saved successfully! |
  | 2 | 200 | 200 undo trip | Answers saved successfully! |
  | 3 | 200 | 200 setup re-save checklist | Answers saved successfully! |
  | 4 | 400 | 400 trip not pending | Invalid trip or trip is not in pending status! |
  | 5 | 400 | 400 trip not found | Invalid trip or trip is not in pending status! |
  | 6 | 400 | 400 finished trip | Invalid trip or trip is not in pending status! |
  | 7 | 400 | 400 missing terms and conditions 1 | terms and conditions is required |
  | 8 | 400 | 400 terms and conditions 1 not boolean | terms and conditions is invalid |
  | 9 | 400 | 400 missing terms and conditions 2 | terms and conditions is required |
  | 10 | 400 | 400 answer not number | Answer is invalid |
  | 11 | 400 | 400 umbrellaCount not number | Answer is invalid |
  | 12 | 400 | 400 vehicleDamageImages not array | Vehicle Damage Images is invalid |
  | 13 | 400 | 400 unknown field | "foo" is not allowed |
  | 14 | 401 | 401 no token | Authentication invalid! |
  | 15 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 16 | 404 | 404 invalid id | No item found with ID "not-an-object-id"! |

  ## Main scenario notes

  Setup for the admin-undo checklist bug.
