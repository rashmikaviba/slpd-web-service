info:
  name: Save Check List
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/trip/checkList/{{undoTripId}}"
  body:
    type: json
    data: |-
      {
        "1": 1,
        "2": 1,
        "3": 1,
        "4": 1,
        "5": 1,
        "6": 1,
        "7": 1,
        "8": 1,
        "9": 1,
        "10": 1,
        "11": 1,
        "12": 1,
        "13": 1,
        "14": 1,
        "umbrellaCount": 2,
        "isTermsConditionsChecked1": true,
        "isTermsConditionsChecked2": true,
        "vehicleDamageImages": []
      }
  auth:
    type: bearer
    token: "{{driverToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Answers saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 main trip
    description: |-
      Stores the whole body as checkListAnswers and checkListCheckBy = driver (src/modules/trip/trip.controller.ts:1086-1089). No check that the caller is the trip's driver (Document/trip.md Known issue 8).

      Auth: bearer {{driverToken}}

      Source scenario: Trip/Save Check List/Save Check List - 200 main trip.yml
    request:
      url: "{{baseUrl}}/trip/checkList/{{tripId}}"
      method: PUT
