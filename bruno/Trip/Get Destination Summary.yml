info:
  name: Get Destination Summary
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/trip/destinationSummary/{{tripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("raw places", function () {
          expect(res.body.data.length).to.equal(3);
          expect(res.body.data[0].isReached).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 main trip
    description: |-
      trip.places as stored.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Trip/Get Destination Summary/Get Destination Summary - 200 main trip.yml
    request:
      url: "{{baseUrl}}/trip/destinationSummary/{{tripId}}"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
