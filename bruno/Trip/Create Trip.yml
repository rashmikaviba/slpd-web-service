  ## Main scenario notes

  Main trip (3 places). Ends the Trip folder in START for downstream modules.
  Stores `{{tripId}}`. Response 201 `Trip Created Successfully` with the saved document (src/modules/trip/trip.controller.ts:121-129). Place/passenger/activity/hotel `_id`s from the body are dropped (src/modules/trip/trip.controller.ts:69-91).
