info:
  name: Create Trip
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/trip"
  body:
    type: json
    data: |-
      {
        "tripConfirmedNumber": "{{mainTcn}}",
        "startDate": "{{tripStartDate}}",
        "endDate": "{{tripEndDate}}",
        "dateCount": 4,
        "contactPerson": "Bruno Tester",
        "totalCost": 1500,
        "totalCostLocalCurrency": 450000,
        "estimatedExpense": 60000,
        "isPaymentCollected": false,
        "specialRequirement": "Child seat",
        "requestedVehicle": "Van",
        "paymentMode": "Cash",
        "passengers": [
          {
            "_id": "new-passenger-1",
            "name": "John Doe",
            "nationality": "British",
            "age": 35,
            "gender": "Male"
          }
        ],
        "activities": [],
        "hotels": [],
        "email": "guest@example.com",
        "phoneNumber": "+94770000000",
        "arrivalInfo": {
          "arrivalDate": "{{tripStartDate}}",
          "arrivalTime": "{{tripStartDate}}",
          "arrivalFlightNumber": "UL504"
        },
        "departureInfo": {
          "departureDate": "{{tripEndDate}}",
          "departureTime": "{{tripEndDate}}",
          "departureFlightNumber": "UL503"
        },
        "pickUpInfo": {
          "pickupDate": "{{tripStartDate}}",
          "pickupTime": "{{tripStartDate}}",
          "pickupCity": "Colombo",
          "pickupAddress": "BIA Arrival Lounge"
        },
        "dropOffInfo": {
          "dropOffDate": "{{tripEndDate}}",
          "dropOffTime": "{{tripEndDate}}",
          "dropOffCity": "Colombo",
          "dropOffAddress": "BIA Departure"
        },
        "places": [
          {
            "_id": "new-place-1",
            "description": "Kandy",
            "dates": [
              "{{tripStartDate}}"
            ],
            "index": 1
          },
          {
            "_id": "new-place-2",
            "description": "Ella",
            "dates": [
              "{{tripDay2}}"
            ],
            "index": 2
          },
          {
            "_id": "new-place-3",
            "description": "Galle",
            "dates": [
              "{{tripDay3}}"
            ],
            "index": 3
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // body dates: today (UTC midnight) .. +3 days; list range: yesterday .. +7 days
        const day0 = new Date();
        day0.setUTCHours(0, 0, 0, 0);
        const iso = (n) => new Date(day0.getTime() + n * 86400000).toISOString();
        bru.setVar("tripStartDate", iso(0));
        bru.setVar("tripDay2", iso(1));
        bru.setVar("tripDay3", iso(2));
        bru.setVar("tripEndDate", iso(3));
        bru.setVar("listFrom", iso(-1).slice(0, 10));
        bru.setVar("listTo", iso(7).slice(0, 10));
        bru.setVar("mainTcn", "BRUNO-MAIN-" + Date.now());
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("tripId", res.body.data._id);
          bru.setVar("mainPlace1Id", res.body.data.places[0]._id);
          bru.setVar("mainPlace2Id", res.body.data.places[1]._id);
          bru.setVar("mainPlacesJson", JSON.stringify(res.body.data.places));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip Created Successfully
    - expression: res.body.data._id
      operator: isString
    - expression: res.body.data.status
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

