docs: |-
  **POST `/api/v1/pos/savePosProduct/:tripId`**

  This request runs the main scenario **201 2 kg**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 2 kg | Pos transaction saved successfully! |
  | 2 | 201 | 201 500 g | Pos transaction saved successfully! |
  | 3 | 201 | 201 negative quantity accepted | Pos transaction saved successfully! |
  | 4 | 400 | 400 missing productId | productId is required |
  | 5 | 400 | 400 productId not a string | productId is invalid |
  | 6 | 400 | 400 missing quantity | quantity is required |
  | 7 | 400 | 400 quantity not a number | quantity is invalid |
  | 8 | 400 | 400 missing unitOfMeasure | unitOfMeasure is required |
  | 9 | 400 | 400 unitOfMeasure not a number | unitOfMeasure is invalid |
  | 10 | 400 | 400 unknown field | "foo" is not allowed |
  | 11 | 400 | 400 trip not found | Pending or Started Trip not found! |
  | 12 | 400 | 400 product not found | Product is not found! |
  | 13 | 400 | 400 not enough stock | You can not save pos transaction, because product inventory is not enough! |
  | 14 | 400 | 400 unit category mismatch | Invalid Measure Unit Conversion! |
  | 15 | 401 | 401 no token | Authentication invalid! |
  | 16 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 17 | 404 | 404 invalid trip id | No item found with ID " |
  | 18 | 404 | 404 invalid product id | No item found with ID " |
  | 19 | 201 | 201 setup POS line on pending trip (Trip setup) | Pos transaction saved successfully! |
  | 20 | 201 | 201 setup POS line on undo trip (Trip setup) | Pos transaction saved successfully! |

  ## Main scenario notes

  Issues 2 kg of `{{productId}}` to the trip (trip PENDING or START). Stock -2000 g with a POS_TRANSACTION log.
  Creates the trip's POS doc on first call. Stores `{{posProductId}}`. `src/modules/pos/pos.controller.ts:23`
