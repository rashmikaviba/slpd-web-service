info:
  name: Save POS Product
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/pos/savePosProduct/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "productId": "{{productId}}",
        "quantity": 2,
        "unitOfMeasure": 13
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          const p = res.body.data.products;
          bru.setVar("posProductId", p[p.length - 1]._id);
        }
    - type: tests
      code: |-
        test("line stored in SI grams", function () {
          const l = res.body.data.products[res.body.data.products.length - 1];
          expect(l.quantityWithSiUnitOfMeasure).to.equal(2000);
          expect(l.status).to.equal(1);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Pos transaction saved successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 2 kg
    description: |-
      Issues 2 kg of `{{productId}}` to the trip (trip PENDING or START). Stock -2000 g with a POS_TRANSACTION log.
      Creates the trip's POS doc on first call. Stores `{{posProductId}}`. `src/modules/pos/pos.controller.ts:23`

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Save POS Product - 201 2 kg.yml
    request:
      url: "{{baseUrl}}/pos/savePosProduct/{{tripId}}"
      method: POST
      body:
        type: json
        data: |-
          {
            "productId": "{{productId}}",
            "quantity": 2,
            "unitOfMeasure": 13
          }
    response:
      status: 201
      statusText: Created
