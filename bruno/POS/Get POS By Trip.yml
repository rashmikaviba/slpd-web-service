  - name: 400 invalid conversion after partial audit
    description: |-
      [KNOWN BUG] Audit done but an ACTIVE line (`{{negativePosProductId}}`) has no audit entry -> `siUnitId` stays 0 in
      `pos.utils.ts:13-26` and `helperUtil.fromSiMeasureUnitToOtherMeasureUnit(0, …)` throws (`util/helper.util.ts:62-63`). The POS view is broken for this trip.
      Expected: 200. Precondition: `Trip End POS Audit - 200` with a line left out.

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Get POS By Trip - 400 invalid conversion after partial audit.yml
    request:
      url: "{{baseUrl}}/pos/getPosByTrip/{{tripId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Invalid Measure Unit Conversion!",
            "data": null
          }
  - name: 400 trip not found
    description: |-
      No POS and no PENDING/START/FINISHED trip. `src/modules/pos/pos.controller.ts:504`

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Get POS By Trip - 400 trip not found.yml
    request:
      url: "{{baseUrl}}/pos/getPosByTrip/{{nonExistingId}}"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Trip not found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: POS/Get POS By Trip - 401 no token.yml
    request:
      url: "{{baseUrl}}/pos/getPosByTrip/{{tripId}}"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 wrong role
    description: |-
      Route allows SUPERADMIN, ADMIN, TRIPMANAGER, FINANCEOFFICER only; `{{driverToken}}` is rejected by `auth.middleware.ts` role check.

      Auth: bearer {{driverToken}}

      Source scenario: POS/Get POS By Trip - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/pos/getPosByTrip/{{tripId}}"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid trip id
    description: |-
      `src/modules/pos/pos.controller.ts:492`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Get POS By Trip - 404 invalid trip id.yml
    request:
      url: "{{baseUrl}}/pos/getPosByTrip/{{invalidId}}"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **GET `/api/v1/pos/getPosByTrip/:tripId`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 400 | 400 invalid conversion after partial audit | Invalid Measure Unit Conversion! |
  | 3 | 400 | 400 trip not found | Trip not found! |
  | 4 | 401 | 401 no token | Authentication invalid! |
  | 5 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 6 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  ACTIVE lines as `PosGetByIdReponseDto` (audit fields 0 before audit). `src/modules/pos/pos.controller.ts:488`
