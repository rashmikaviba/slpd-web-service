info:
  name: Get POS By Trip
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/pos/getPosByTrip/{{tripId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("lines before audit", function () {
          expect(res.body.data.isTripEndAuditDone).to.equal(false);
          expect(res.body.data.products.map((p) => p.id)).to.include(bru.getVar("posProductId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      ACTIVE lines as `PosGetByIdReponseDto` (audit fields 0 before audit). `src/modules/pos/pos.controller.ts:488`

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Get POS By Trip - 200.yml
