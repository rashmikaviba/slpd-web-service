  - name: 400 return more than issued
    description: |-
      3 kg returned > 2 kg issued on `{{posProductId}}`. Needs `{{productName}}` from the Product folder. `src/modules/pos/pos.controller.ts:330`

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Trip End POS Audit - 400 return more than issued.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "auditRecords": [
              {
