info:
  name: Trip End POS Audit
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/pos/tripEndAudit"
  body:
    type: json
    data: |-
      {
        "tripId": "{{tripId}}",
        "auditRecords": [
          {
            "id": "{{posProductId}}",
            "returnQuantity": 0.5,
            "returnUnitOfMeasure": 13,
            "isReturned": true,
            "notReturnedReason": "partly consumed"
          }
        ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Trip end pos audit done successfully!
    - expression: res.body.data.isTripEndAuditDone
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      Audits only the 2 kg line: 0.5 kg returned -> +500 g stock (POS_TRANSACTION_RETURN log), `isTripEndAuditDone = true`.
      The negative line is intentionally left un-audited (allowed: not every line must be audited). No trip-status check. `src/modules/pos/pos.controller.ts:268`

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Trip End POS Audit - 200.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "auditRecords": [
              {
                "id": "{{posProductId}}",
                "returnQuantity": 0.5,
                "returnUnitOfMeasure": 13,
                "isReturned": true,
                "notReturnedReason": "partly consumed"
              }
            ]
          }
    response:
