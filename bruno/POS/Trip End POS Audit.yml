          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }
  - name: 500 empty auditRecords
    description: |-
      Zero records -> no audit entries -> `InternalServerError` (`src/modules/pos/pos.controller.ts:476`). A trip whose lines were all voided can only send this,
      so it can never be audited and Trip refuses to finish it (Known issues: deadlock).

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Trip End POS Audit - 500 empty auditRecords.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
