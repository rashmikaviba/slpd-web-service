  - name: 403 wrong role
    description: |-
      Route allows SUPERADMIN, ADMIN, TRIPMANAGER, FINANCEOFFICER only; `{{driverToken}}` is rejected by `auth.middleware.ts` role check.

      Auth: bearer {{driverToken}}

      Source scenario: POS/Trip End POS Audit - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "auditRecords": [
              {
                "id": "{{posProductId}}",
                "returnQuantity": 0.5,
                "returnUnitOfMeasure": 13,
