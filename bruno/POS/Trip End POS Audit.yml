          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Something went wrong while end trip pos audit!",
            "data": null
          }
  - name: 500 auditRecords omitted
    description: |-
      [KNOWN BUG] `auditRecords` not required in Joi; `for…of undefined` throws a TypeError (`src/modules/pos/pos.controller.ts:294`) -> 500 (raw message not asserted). Expected: 400.

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Trip End POS Audit - 500 auditRecords omitted.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "auditRecords is not iterable",
            "data": null
          }

docs: |-
  **PUT `/api/v1/pos/tripEndAudit`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | Trip end pos audit done successfully! |
  | 2 | 200 | 200 re-run accepted | Trip end pos audit done successfully! |
  | 3 | 400 | 400 missing tripId | tripId is required |
  | 4 | 400 | 400 tripId not a string | tripId is invalid |
  | 5 | 400 | 400 record missing id | id is required |
  | 6 | 400 | 400 record id not a string | id is invalid |
  | 7 | 400 | 400 record missing returnQuantity | returnQuantity is required |
  | 8 | 400 | 400 record returnQuantity not a number | returnQuantity is invalid |
  | 9 | 400 | 400 record missing returnUnitOfMeasure | returnUnitOfMeasure is required |
  | 10 | 400 | 400 record returnUnitOfMeasure not a number | returnUnitOfMeasure is invalid |
  | 11 | 400 | 400 record missing isReturned | isReturned is required |
  | 12 | 400 | 400 record isReturned not boolean | isReturned is invalid |
  | 13 | 400 | 400 record notReturnedReason not a string | notReturnedReason is invalid |
  | 14 | 400 | 400 unknown field | "foo" is not allowed |
  | 15 | 400 | 400 no POS for trip | Pos transaction not found for given trip! |
  | 16 | 400 | 400 line not found | Pos transaction not found for given trip! |
  | 17 | 400 | 400 return more than issued | Return quantity is more than available quantity for product " |
  | 18 | 401 | 401 no token | Authentication invalid! |
  | 19 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 20 | 404 | 404 invalid trip id | No item found with ID " |
  | 21 | 500 | 500 empty auditRecords | Something went wrong while end trip pos audit! |
  | 22 | 500 | 500 auditRecords omitted | auditRecords is not iterable |

  ## Main scenario notes

  Audits only the 2 kg line: 0.5 kg returned -> +500 g stock (POS_TRANSACTION_RETURN log), `isTripEndAuditDone = true`.
  The negative line is intentionally left un-audited (allowed: not every line must be audited). No trip-status check. `src/modules/pos/pos.controller.ts:268`
