  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: POS/Trip End POS Audit - 401 no token.yml
    request:
      url: "{{baseUrl}}/pos/tripEndAudit"
      method: PUT
      body:
        type: json
        data: |-
          {
            "tripId": "{{tripId}}",
            "auditRecords": [
              {
