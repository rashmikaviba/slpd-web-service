  - name: 400 trip not started
    description: |-
      Precondition: `{{tripId}}` PENDING or FINISHED. `src/modules/pos/pos.controller.ts:185`
      Not covered: void 'Product not found!' (`src/modules/pos/pos.controller.ts:221`, product inactivated after issue) and the 500 for a START trip without any POS doc
      (`src/modules/pos/pos.controller.ts:196`) — both need extra fixtures (second product / second started trip) outside this folder's shared vars.

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Manual Preconditions/Void POS Product - 400 trip not started.yml
    request:
      url: "{{baseUrl}}/pos/voidPosProduct/{{posProductId}}/trip/{{tripId}}"
      method: DELETE
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You can not void pos transaction, because trip is not in started status!",
            "data": null
          }
