  - name: 401 no token
    description: |-
      No Authorization header -> `authorize()` rejects before the handler.

      Auth: none (no Authorization header)

      Source scenario: POS/Void POS Product - 401 no token.yml
    request:
      url: "{{baseUrl}}/pos/voidPosProduct/{{posProductId}}/trip/{{tripId}}"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 wrong role
    description: |-
      Route allows SUPERADMIN, ADMIN, TRIPMANAGER, FINANCEOFFICER only; `{{driverToken}}` is rejected by `auth.middleware.ts` role check.

      Auth: bearer {{driverToken}}

      Source scenario: POS/Void POS Product - 403 wrong role.yml
    request:
      url: "{{baseUrl}}/pos/voidPosProduct/{{posProductId}}/trip/{{tripId}}"
      method: DELETE
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }
  - name: 404 invalid trip id
    description: |-
      `src/modules/pos/pos.controller.ts:175`

      Malformed ObjectId reaches a Mongoose query -> `CastError` -> `error.middleware.ts` returns 404 `No item found with ID "<value>"!` (asserted in tests because of the quotes).

      Auth: collection default ({{superAdminToken}})

      Source scenario: POS/Void POS Product - 404 invalid trip id.yml
    request:
      url: "{{baseUrl}}/pos/voidPosProduct/{{posProductId}}/trip/{{invalidId}}"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No item found with ID \"",
            "data": null
          }

docs: |-
  **DELETE `/api/v1/pos/voidPosProduct/:id/trip/:tripId`**

  This request runs the main scenario **201**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 201 | 201 | Pos transaction void successfully! |
  | 2 | 201 | 201 already voided line re-voided | Pos transaction void successfully! |
  | 3 | 400 | 400 trip not started | You can not void pos transaction, because trip is not in started status! |
  | 4 | 400 | 400 trip not found | Trip not found! |
  | 5 | 400 | 400 line not found | Pos transaction not found to void! |
  | 6 | 401 | 401 no token | Authentication invalid! |
  | 7 | 403 | 403 wrong role | You're unauthorized to access this resource! |
  | 8 | 404 | 404 invalid trip id | No item found with ID " |

  ## Main scenario notes

  [DESTRUCTIVE] Trip must be START. Line -> DELETED, 500 g put back in stock (logged as POS_TRANSACTION). Responds 201. `src/modules/pos/pos.controller.ts:169`
