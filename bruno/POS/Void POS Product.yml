info:
  name: Void POS Product
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/pos/voidPosProduct/{{voidPosProductId}}/trip/{{tripId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: eq
      value: Pos transaction void successfully!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "201"
    description: |-
