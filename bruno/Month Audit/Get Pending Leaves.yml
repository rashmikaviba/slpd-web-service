    description: |-
      [PRECONDITION] Only passes when no ACTIVE CompanyWorkingInfo exists; in a normal run it returns 200 and fails. monthAudit.controller.ts:329-331.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Month Audit/Get Pending Leaves - 400 no working info.yml
    request:
      url: "{{baseUrl}}/monthAudit/pendingLeaves"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "No active company information found!",
            "data": null
          }
  - name: 401 no token
    description: |-
      No Authorization header → auth.middleware.ts:24-26 `UnauthorizedError`. monthAudit.route.ts:20-24.

      Auth: none (no Authorization header)

      Source scenario: Month Audit/Get Pending Leaves - 401 no token.yml
    request:
      url: "{{baseUrl}}/monthAudit/pendingLeaves"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "Authentication invalid!",
            "data": null
          }
  - name: 403 admin
    description: |-
      Route allows SUPERADMIN only; `{{adminToken}}` is rejected by auth.middleware.ts:73-77. monthAudit.route.ts:20-24.

      Auth: bearer {{adminToken}}

      Source scenario: Month Audit/Get Pending Leaves - 403 admin.yml
    request:
      url: "{{baseUrl}}/monthAudit/pendingLeaves"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": false,
            "timeStamp": "2026-11-18T08:30:00.000Z",
            "message": "You're unauthorized to access this resource!",
            "data": null
          }

docs: |-
  **GET `/api/v1/monthAudit/pendingLeaves`**

  This request runs the main scenario **200**. Every other scenario (success and error) is saved as an example — open the Examples tab, pick one, and its request body/params are shown with the expected response.

  ## Scenarios

  | # | Status | Scenario (example) | Message |
  |---|---|---|---|
  | 1 | 200 | 200 | (empty) |
  | 2 | 400 | 400 no working info | No active company information found! |
  | 3 | 401 | 401 no token | Authentication invalid! |
  | 4 | 403 | 403 admin | You're unauthorized to access this resource! |

  ## Main scenario notes

  SUPERADMIN. PENDING leaves via `findAllLeavesByMonthYearAndStatusIn(Y, M)` (monthAudit.controller.ts:321-371).
  [KNOWN BUG] month off-by-one: returns leaves starting in month M+1 (Document/monthAudit.md #1); availableLeaveCount
  only for FINANCEOFFICER (comma operator, #2). Not asserted because it depends on existing data.
