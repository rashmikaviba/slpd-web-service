info:
  name: Get Pending Leaves
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/monthAudit/pendingLeaves"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("LeaveResponseDto array", function () {
          expect(res.body.data).to.be.an("array");
          res.body.data.forEach((l) => expect(l.statusName).to.equal("PENDING"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      SUPERADMIN. PENDING leaves via `findAllLeavesByMonthYearAndStatusIn(Y, M)` (monthAudit.controller.ts:321-371).
      [KNOWN BUG] month off-by-one: returns leaves starting in month M+1 (Document/monthAudit.md #1); availableLeaveCount
      only for FINANCEOFFICER (comma operator, #2). Not asserted because it depends on existing data.

      Auth: collection default ({{superAdminToken}})

      Source scenario: Month Audit/Get Pending Leaves - 200.yml
    request:
      url: "{{baseUrl}}/monthAudit/pendingLeaves"
      method: GET
    response:
