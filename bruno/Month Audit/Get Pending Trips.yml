info:
  name: Get Pending Trips
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/monthAudit/pendingTrip"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("array of trips without full driver salary", function () {
          expect(res.body.data).to.be.an("array");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccessful
      operator: eq
      value: "true"
    - expression: res.body.message
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: "200"
    description: |-
      SUPERADMIN. Trips ending before next month without all driver salaries (monthAudit.controller.ts:393-453). [KNOWN BUG] trips with drivers always appear unpaid (Document/monthAudit.md #9).

      Auth: collection default ({{superAdminToken}})

      Source scenario: Month Audit/Get Pending Trips - 200.yml
    request:
      url: "{{baseUrl}}/monthAudit/pendingTrip"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "isSuccessful": true,
